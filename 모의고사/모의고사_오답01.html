{"s": 1, "p": 2, "q": "집합투자증권의 거래가격에 대한 설명 중 잘못된 것은?", "o": ["투자매매업자 또는 투자중개업자가 집합투자증권을 판매하는 경우 그 가격은 금전 등을 납입한 후 최초로 산정되는 기준가격(미래가격)으로 판매해야 한다.", "외국환평형기금에게 단기금융집합투자기구의 펀드를 판매하는 경우 판매가격은 금전 등의 납입일에 공고된 기준가격으로 한다.", "투자자가 금융투자상품 매수에 따른 결제대금을 지급하기 위하여 MMF를 환매하기로 증권사와 미리 약정한 경우 환매가격은 환매청구일에 공고되는 기준가격으로 한다.", "장 마감 후 거래는 금전 등의 납입일에 공고된 기준가격으로 한다."], "a": 3, "ep": [1], "n": 4, "takeaway": "집합투자증권은 주문 당시 이미 공고된 가격을 일률적으로 적용하지 않습니다. 먼저 매수인지 환매인지, 기준시점 전후인지, MMF 예외가 있는지를 구분합니다.", "reasons": ["일반적인 판매는 납입 후 산정되는 기준가격을 적용합니다. 주문할 때 가격이 확정된 주식 거래와 구별합니다.", "외국환평형기금에 대한 MMF 판매는 납입일에 이미 공고된 기준가격을 적용할 수 있는 예외입니다.", "다른 금융투자상품의 결제에 쓰기 위해 MMF를 환매하기로 사전 약정한 경우에는 환매청구일 공고 가격을 적용하는 예외가 있습니다.", "기준시점 이후 접수분에는 기준시점 이전 접수분에 적용되는 가격의 다음 기준가격을 적용합니다. 늦게 접수했다는 이유만으로 납입일 공고 가격을 적용할 수는 없습니다."]},
{"s": 1, "p": 2, "q": "금융소비자보호법상 금융투자업자의 상품판매와 관련한 투자성 상품에 해당하지 않는 것은?", "o": ["금융투자상품", "투자일임계약", "신탁계약(관리형신탁 및 투자성 없는 신탁은 제외)", "연계투자 (P2P 투자)"], "a": 3, "ep": [1], "n": 5, "takeaway": "출제의 범위는 금융투자업자의 상품판매입니다. 증권·파생상품 자체를 판매하는 경우와 고객의 자산을 일임 또는 신탁받아 운용하는 계약을 함께 봅니다.", "reasons": ["증권이나 파생상품을 포함하는 금융투자상품은 이 문항이 묻는 범위에 해당합니다.", "투자일임은 고객이 투자판단을 맡기고 업자가 고객별 자산을 운용하는 계약입니다. 투자성 상품 범위에 포함됩니다.", "보기처럼 관리형신탁과 투자성이 없는 신탁을 제외한 신탁계약은 이 문항의 범위에 포함됩니다.", "P2P 연계투자는 온라인투자연계금융업자가 차입자에게 제공하는 연계대출과 연결됩니다. 금융소비자보호법 시행령상 투자성 상품의 일반 분류에는 연계투자도 포함되므로, 정답 ④는 문항의 판매업자 범위에서 판단합니다."], "reference": ["금융소비자보호법 시행령 제3조 · 투자성 상품 범위", "https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lspttninfSeq=166719"]},
{"s": 1, "p": 2, "q": "다음 중 자본시장법이 금지하는 불건전 영업행위와 거리가 먼 것은?", "o": ["투자권유의 요청을 받지 않은 증권과 장내파생상품에 대한 투자권유행위", "일반투자자를 상대로 하는 차별적인 판매촉진노력", "수익률 보장 또는 손실보전 행위", "투자자로부터 집합투자증권을 매수·중개·주선·대리하는 행위"], "a": 0, "ep": [1], "n": 6, "takeaway": "요청받지 않은 투자권유에 대한 예외와 판매과정에서 별도로 금지되는 행위를 구분하는 문제입니다.", "reasons": ["이 문항에서 증권 및 장내파생상품은 불초청권유 금지의 예외에 해당합니다. 다른 권유 규정까지 면제된다는 뜻은 아닙니다.", "일반투자자에게 차별적으로 판매촉진을 하는 행위는 공정한 판매를 해칠 수 있어 금지 대상으로 봅니다.", "수익률을 보장하거나 손실을 보전해 주겠다고 하는 행위는 투자위험을 왜곡하므로 금지 대상입니다.", "판매사가 투자자로부터 집합투자증권을 매수하거나 그 거래를 중개하는 행위는 정해진 환매 절차와 구별되는 제한 행위입니다."]},
{"s": 1, "p": 3, "q": "다음 중 집합투자증권의 환매에 대한 설명이 잘못된 것은?", "o": ["투자자는 언제든지 판매사(투자매매·중개업자)에 집합투자증권의 환매를 청구할 수 있다.", "판매사가 환매에 응할 수 없는 경우 집합투자업자, 신탁업자에게 청구할 수 있다.", "집합투자자 전원의 동의를 얻으면 집합투자재산으로 환매대금을 지급할 수 있다.", "환매수수료는 집합투자증권 평가잔액을 기준으로 부과하며, 징수한 환매수수료는 판매사 에 귀속된다."], "a": 3, "ep": [1], "n": 7, "takeaway": "환매청구는 판매사에서 시작하고, 환매수수료는 누가 내는지와 어디에 귀속되는지를 따로 기억합니다.", "reasons": ["환매 가능한 집합투자증권의 투자자는 원칙적으로 해당 증권을 판매한 회사에 환매를 청구합니다.", "판매사가 해산 등으로 응할 수 없으면 집합투자업자에게, 그 업자도 응할 수 없으면 신탁업자에게 청구하는 순서입니다.", "투자자 전원의 동의를 얻으면 집합투자재산 자체로 환매대금을 지급할 수 있습니다. 통상적인 현금 지급과 구별됩니다.", "부과 기준은 환매금액 또는 이익금이며, 수수료는 환매 청구 투자자가 부담하고 해당 집합투자재산에 귀속됩니다."], "reference": ["자본시장법 제235·236조 · 환매청구와 수수료", "https://law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1032431739"]},
{"s": 1, "p": 3, "q": "다음 중 집합투자증권의 가격결정 기준에 대한 설명이 잘못된 것은?", "o": ["집합투자증권의 가격결정은 원칙적으로 미래가격을 기준으로 한다.", "판매가격과 환매가격은 순자산가치에 비하여 할인 또는 할증된다.", "결제대금으로 결제일에 MMF를 매수하기로 약정하거나, 급여 등 정기적 금전 수취일에 MMF를 매수하기로 약정한 경우에는 예외적으로 과거가격을 기준으로 한다.", "장 마감 후 거래는 기준시점 이전에 적용되는 기준가격 다음에 산출되는 기준가격을 적용한다."], "a": 1, "ep": [1], "n": 8, "takeaway": "개방형 펀드의 매수·환매 가격은 순자산가치에 기초한 기준가격으로 정합니다. 장내에서 거래되는 ETF의 시장가격과 구별합니다.", "reasons": ["미래가격은 신청 후 산출될 기준가격입니다. 투자자가 이미 아는 가격을 선택해 거래하는 문제를 줄입니다.", "이 문항의 판매·환매 가격은 기준가격에서 임의로 할인하거나 할증하지 않습니다. 판매수수료 등이 따로 붙는 것과 구별합니다.", "결제일 또는 정기적인 돈의 수취일에 MMF를 매수하기로 미리 약정한 경우, 이미 공고된 가격을 적용하는 예외가 있습니다.", "기준시점 이후 신청분은 기준시점 이전 신청분에 적용되는 기준가격보다 한 회차 뒤의 가격을 씁니다."]},
{"s": 1, "p": 3, "q": "다음 중 투자신탁 자산의 운용에 대한 설명이 잘못된 것은?", "o": ["투자신탁의 집합투자업자는 신탁업자에 대하여 투자대상자산의 취득·처분 등에 관하여 필요한 지시를 한다.", "신탁업자는 집합투자업자의 지시에 따라 투자대상자산의 취득·처분 등을 하여야 한다.", "투자신탁은 신탁업자의 명의로만 투자대상자산을 취득·처분할 수 있다.", "회사형 집합투자기구의 경우 집합투자업자는 집합투자기구 명의로 투자대상자산을 취득·처분하고, 신탁업자는 집합투자업자의 지시에 따라야 한다."], "a": 2, "ep": [1], "n": 9, "takeaway": "투자신탁에서는 운용 의사결정과 자산의 보관·집행 역할이 나뉩니다. ‘신탁업자 명의로만’의 ‘만’이 정답을 가르는 표현입니다.", "reasons": ["집합투자업자는 어떤 자산을 취득하거나 처분할지 결정하고 신탁업자에게 지시합니다.", "신탁업자는 원칙적으로 집합투자업자의 운용지시에 따라 거래를 집행합니다.", "효율적인 신탁재산 운용에 불가피한 경우 등 정해진 예외에서는 집합투자업자 자신의 명의로 직접 취득·처분할 수 있습니다.", "회사형은 투자회사 등 집합투자기구 자체의 명의로 취득·처분하는 구조입니다. 투자신탁의 기본 구조와 구별합니다."]},
{"s": 1, "p": 4, "q": "ETF 운용규제의 특례에 대한 설명이 잘못된 것은?", "o": ["ETF는 자산총액의 30%까지 동일종목의 증권에 운용할 수 있다.", "각 ETF에서 동일법인 등이 발행한 지분증권 총수의 20%까지 투자할 수 있다.", "투자자보호 차원에서 ETF 설정 목적으로 이해관계인과 거래하는 것은 금지된다.", "ETF는 자본시장법 규정 중 집합투자증권 환매, 계열사 발행주식에 대한 중립투표 의무, 자산운용보고서, 내부자의 단기매매차익 반환의무, 임원 등의 특정증권 소유상황보고 등 에 관한 규정이 적용되지 않는다."], "a": 2, "ep": [2], "n": 12, "takeaway": "ETF 운용 특례는 지수 추적과 설정·환매가 가능하도록 일반 펀드의 일부 제한을 다르게 적용하는 규정입니다.", "reasons": ["30%는 ETF 자체 자산총액을 분모로 하는 동일종목 투자 한도입니다.", "20%는 해당 발행인의 지분증권 총수를 분모로 하는 한도입니다. ①과 분모가 다릅니다.", "ETF 설정 목적의 이해관계인 거래는 일반적인 이해관계인 거래 제한의 예외에 해당합니다. 설정 목적이라는 요건을 확인합니다.", "보기의 규정은 출제 범위에서 ETF에 적용을 배제하는 특례의 사례입니다."]},
{"s": 1, "p": 8, "q": "금융위원회의 금융투자업자에 대한 제재권의 내용과 거리가 먼 것은?", "o": ["회원의 제명권", "조치명령권", "승인권", "금융업등록 취소권"], "a": 0, "ep": [2], "n": 22, "takeaway": "감독기관의 권한과 금융투자협회가 회원사에 행사하는 자율규제 권한을 구분합니다.", "reasons": ["제명은 협회의 회원 자격을 박탈하는 조치이므로 금융투자협회의 회원 제재에 해당합니다.", "시정 등 필요한 감독상 조치를 명하는 권한은 금융위원회의 권한입니다.", "업무나 지위 변경 등 법에서 승인을 요구하는 사항의 승인 주체는 금융위원회입니다.", "금융위원회가 부여한 등록을 법정 사유에 따라 취소하는 것과 협회에서 제명하는 것은 별개의 조치입니다."]},
{"s": 1, "p": 10, "q": "수익증권의 인출 및 해지에 대한 설명이 잘못된 것은?", "o": ["환매가 제한되어 있지 않더라도 3개월 이내에 환매하는 것은 금지된다.", "저축자가 수익증권현물을 요구하는 경우 판매회사는 특별한 사유가 없는 한 수익증권 현물로 지급해야 한다.", "판매회사는 정액적립식 저축자가 계속하여 6개월 이상 저축금을 납입하지 않는 경우 저축 계약을 해지할 수 있다.", "판매회사는 저축자가 저축금을 납입하지 않는 경우 14일 이상의 기간을 부여하여 저축금 의 추가납입을 요구할 수 있다."], "a": 0, "ep": [2], "n": 29, "takeaway": "수익증권의 인출 가능 여부, 인출할 때 드는 환매수수료, 저축계약 해지는 각각 다른 문제입니다.", "reasons": ["환매 제한이 없으면 전부 또는 일부를 인출할 수 있습니다. 일정 기간 이내 수수료가 부과된다는 조건이 곧 환매 금지를 뜻하지는 않습니다.", "교재의 저축거래 기준에서 저축자가 현물을 요구하면 특별한 사유가 없는 한 현물로 지급합니다.", "정액적립식의 6개월 이상 계속 미납은 판매회사가 저축계약 해지 절차를 밟을 수 있는 요건입니다.", "14일 이상은 추가납입을 요청할 때 부여하는 기간입니다. ③의 6개월과 쓰임이 다릅니다."]},
{"s": 1, "p": 11, "q": "수익증권저축의 만기지급일과 관련된 내용 중 잘못된 것은?", "o": ["저축기간을 월,연 단위로 정한 경우 저축기간이 만료되는 월의 최초 납입상당일을 만기지 급일로 한다.", "①의 경우 만료되는 월에 그 해당일이 없으면 그 월의 말일을 만기지급일로 한다.", "저축기간을 일 단위로 정한 경우 최초 매수일로부터 계산하여 저축기간이 만료되는 날을 만기 지급일로 한다.", "투자신탁계약을 해지한 경우에는 해지결산 후 첫 영업일을 만기지급일로 한다."], "a": 2, "ep": [2], "n": 32, "takeaway": "기간 단위가 월·연인지 일인지 먼저 보고, 해지결산은 별도 규칙으로 판단합니다.", "reasons": ["월·연 단위는 만료되는 달에서 첫 납입일과 같은 날짜를 찾아 만기지급일로 봅니다.", "그 달에 해당 날짜가 없으면 말일을 적용합니다. 예를 들어 그 달에 31일이 없으면 말일을 씁니다.", "일 단위는 최초 매수일을 기준으로 기간 만료일을 구한 뒤 그 다음 영업일에 지급합니다.", "투자신탁계약 자체를 해지하면 해지결산을 한 뒤 첫 영업일이 만기지급일입니다."]},
{"s": 1, "p": 11, "q": "적립식 저축에 대한 설명 중 잘못된 것은?", "o": ["저축기간 중 저축재산의 일부인출이 가능하지만 신탁계약에서 정한 환매수수료를 징구한다.", "저축금을 완납하고 저축기간이 종료된 이후에는 일부인출하여도 환매수수료가 없다.", "저축자가 6개월 이상 저축금을 납입하지 않은 경우에는 14일 이상 기간을 정하여 추가납 입을 요구하고 그 기간 동안 저축자가 적절한 조치를 취하지 않으면 판매회사는 저축계약 을해지할 수 있다.", "저축자가 약정한 만기일이 도래했으나 미납입 저축금이 있는 경우 이를 납입한 날을 만기 지급일로 한다."], "a": 3, "ep": [2], "n": 33, "takeaway": "저축계약의 상태를 기간 중, 정상 만기, 중도 미납, 만기 후 미납 해소로 나누면 지급일과 수수료를 구분할 수 있습니다.", "reasons": ["저축기간 중 일부인출이 가능하며, 수수료 여부와 금액은 신탁계약의 환매수수료 규정을 따릅니다.", "보기는 완납과 기간 종료가 모두 된 경우입니다. 이 경우 일부인출에 환매수수료가 없다고 판단합니다.", "6개월 이상 미납 시 14일 이상을 주어 추가납입을 요구하고, 그 기간에도 조치가 없으면 계약을 해지할 수 있습니다.", "만기가 지난 뒤 미납금을 완납하면 그날은 납입완료일입니다. 만기지급일은 다음 영업일입니다."]},
{"s": 1, "p": 12, "q": "투자신탁의 수입시기는 과세시기를 의미한다. 다음 중 투자신탁의 과세시기가 아닌 것은?", "o": ["투자신탁의 이익을 지급받는 날, 즉 현금으로 이익을 수령하는 날", "당초 소득이 신탁재산에 귀속된 날", "재투자 특약에 의하여 원본이 전입되는 날", "신탁계약기간을 연장하는 경우 그 기간을 연장하는 날"], "a": 1, "ep": [3], "n": 34, "takeaway": "펀드 재산에서 소득이 발생한 시점과 투자자가 그 소득을 인식하는 시점을 분리합니다.", "reasons": ["투자자가 이익을 지급받으면 투자자에게 수입이 발생한 것으로 봅니다.", "소득이 신탁재산에 들어오는 날에는 펀드 안에서만 소득이 생긴 것입니다. 그 사실만으로 투자자의 과세시기가 도래하지 않습니다.", "재투자 특약으로 이익이 원본에 전입되면 현금을 받지 않더라도 이익을 받은 뒤 재투자한 것과 같은 시점으로 봅니다.", "신탁계약기간을 연장하는 날도 교재의 수입시기 항목에 해당합니다."]},
{"s": 1, "p": 12, "q": "파생상품과 파생결합증권에 간접투자하는 경우, 매매평가손익의 과세에 대한 설명 중 잘못된 것은?", "o": ["상장 주식의 매매평가손익은 투자신탁이익 계산 시 과세제외된다.", "장외파생상품의 매매평가손익은 투자신탁이 익에 포함하여 배당소득으로 과세한다.", "ELW에서 발생한 소득은 양도소득으로 과세된다.", "비상장 파생결합증권의 매매평가손익은 투자신탁이익에 포함되지 않는다."], "a": 3, "ep": [3], "n": 35, "takeaway": "펀드 내부의 매매·평가손익을 투자신탁이익에 넣는 문제인지, 개인이 ELW를 직접 거래할 때의 소득구분인지 구분합니다.", "reasons": ["교재의 투자신탁이익 계산에서는 상장주식 매매·평가손익을 과세대상 이익에서 제외합니다.", "장외파생상품 손익은 펀드의 과세대상 투자신탁이익에 포함되며, 그 이익은 투자자에게 배당소득으로 과세됩니다.", "이 보기는 직접 거래한 ELW에서 생기는 양도손익의 소득구분을 가리킵니다. 펀드 내부 손익의 처리와 같은 질문이 아닙니다.", "이 문항에서 비상장 파생결합증권인 ELS·DLS 등의 매매·평가손익은 과세대상 투자신탁이익에 포함됩니다."]},
{"s": 1, "p": 14, "q": "펀드의 분류에 대한 설명으로 잘못된 것은?", "o": ["추가형은 신탁계약기간이 정해져 있지 않고 최초모집기간이 종료된 이후에도 투자할 수 있으나 단위형은 신탁계약기간이 정해져 있고 추가로 투자할 수 없다.", "개방형은 계약기간 중도에 환매를 요구할 수 있으나 폐쇄형은 환매를 요구할 수 없다.", "주식형(채권형)펀드는 주식(채권)에 펀드재산의 60%이상을 투자하는 펀드로 시장위험, 개별위험, 유동성위험이 있다.", "장내파생상품에 투자하는 펀드는 장외파생상품에 투자하는 위험에 해당하는 위험 외에 거래상대방위험, 계약 조기해지위험, 지급금액 변동위험 등이 발생할 수 있다."], "a": 3, "ep": [3], "n": 40, "takeaway": "펀드는 추가 설정 여부, 중도 환매 여부, 주된 투자자산 등 서로 다른 기준으로 분류합니다.", "reasons": ["추가형과 단위형을 구분하는 핵심은 최초 모집이 끝난 뒤 추가 설정이나 납입이 가능한지입니다.", "개방형과 폐쇄형은 존속기간 중 투자자의 환매청구가 가능한지를 기준으로 구분합니다.", "교재 분류상 주식형과 채권형은 해당 자산에 60% 이상 투자하는 유형입니다. 집중하는 자산에 따라 시장·개별·유동성 위험이 생길 수 있습니다.", "거래상대방 신용, 조기해지, 지급구조 관련 위험이 더 두드러지는 쪽은 맞춤 계약으로 거래하는 장외파생상품입니다. 보기는 장내와 장외를 바꿔 적었습니다."]},
{"s": 1, "p": 14, "q": "인덱스펀드에 대한 설명으로 잘못된 것은?", "o": ["비용이 저렴하고, 운용이 투명하다.", "장기투자를 할 경우 인덱스펀드는 동일한 수준의 수익률을 실현하는 액티브펀드보다 높은 수익률을 내는 것이 보통이다.", "인핸스드 인덱스펀드는 추적 대상지수 수익률을 초과하는 수익률을 목표로 하는 인덱스펀 드로 알파 추구 전략 또는 차익거래를 이용한다.", "인핸스드 인덱스펀드는 액티브펀드와 같이 위험을 제한 없이 부담하면서 추가수익전략을 수행한다."], "a": 3, "ep": [3], "n": 41, "takeaway": "일반 인덱스펀드는 지수 추적을, 인핸스드 인덱스펀드는 지수 추적을 바탕으로 한 제한적인 초과수익을 목표로 합니다.", "reasons": ["정해진 지수를 추종하므로 보유종목과 운용 원칙을 파악하기 쉽고 운용비용도 비교적 낮습니다.", "비용 차감 전 성과가 같다면 낮은 비용은 장기 순수익률에 유리합니다. 인덱스펀드가 항상 액티브펀드를 이긴다는 뜻은 아닙니다.", "지수 추적을 유지하면서 일부 비중 조정이나 차익거래로 추가 수익을 추구할 수 있습니다.", "인핸스드 운용은 벤치마크에서 벗어나는 정도를 제한합니다. ‘위험을 제한 없이 부담’한다는 설명이 틀렸습니다."]},
{"s": 1, "p": 14, "q": "특별자산펀드에 대한 설명으로 잘못된 것은?", "o": ["집합투자재산의 50%를 초과하여 증권 및 부동산을 제외한 투자대상자산인 특별자산에 투자하는 펀드이다.", "자본시장법은 특별자산펀드를 반드시 환매금지 형 펀드로 설정하도록 의무화하고 있다.", "발행일로부터 30일 이내에 증권시장에 상장해야 한다.", "특별자산펀드를 금융위원회에 등록 시 특별자산 평가방법을 기재한 서류를 금융위원회에 제출해야 한다."], "a": 2, "ep": [3], "n": 42, "takeaway": "출제 의도는 환매금지형의 상장기한을 30일과 90일 중에서 고르는 것입니다. 상장은 환매가 제한된 투자자에게 시장에서 매도할 통로를 마련합니다.", "reasons": ["교재의 분류 기준은 집합투자재산의 50%를 초과해 특별자산에 투자하는 것입니다. 특별자산은 원칙적으로 증권·부동산 외의 투자대상자산입니다.", "원본은 환금성이 낮은 자산에 투자하는 환매금지형을 전제로 합니다. 법상 환매금지형 의무 여부는 투자대상과 적용 요건을 함께 확인해야 합니다.", "별도의 환금성 보장 방법을 정하지 않은 일반적인 경우 상장기한은 최초 발행일부터 90일입니다. 30일로 바꾼 보기가 원본 정답입니다.", "보기의 서류는 일반 시장가격만으로 평가하기 어려운 특별자산을 어떤 방식으로 평가할지 확인하기 위한 것입니다."], "reference": ["자본시장법 제230조 · 환매금지형의 상장기한", "https://law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1022955721"]},
{"s": 1, "p": 15, "q": "특별자산펀드에서 펀드재산의 50%를 초과하여 투자해야 하는 특별자산과 거리가 먼 것은?", "o": ["특별자산이 신탁재산의 50%이상을 차지하는 경우의 수익증권", "해외자원개발 전담회사와 특별자산에 대한 투자만을 목적으로 하는 법인이 발행한 수익 증권", "사회기반시설사업의 시행을 목적으로 하는 법인이 발행한 주식과 채권", "증권 및 부동산을 제외한 자산으로서 펀드에서 투자할 만한 경제적 가치가 있는 모든 투자대상자산"], "a": 1, "ep": [3], "n": 43, "takeaway": "발행인이 무엇을 하는지뿐 아니라 그 발행인이 발행한 증권의 종류까지 일치해야 특별자산 투자비중에 산입할 수 있습니다.", "reasons": ["특별자산이 신탁재산의 50% 이상인 수익증권은 문항이 제시한 특례 대상입니다. 이 수익증권 자체의 요건과 펀드의 ‘50% 초과’ 분류 기준을 구분합니다.", "해당 법인이 발행한 지분증권·채무증권이 보기의 특례에 해당합니다. 수익증권이라고 바꿔 쓴 것이 함정입니다.", "사회기반시설사업을 시행하는 법인의 주식·채권은 출제 기준에서 특별자산 투자로 보는 특례의 예입니다.", "증권 및 부동산 이외에 경제적 가치가 있는 투자대상자산은 특별자산의 기본 범위입니다."]},
{"s": 1, "p": 15, "q": "모자형집합투자기구에 대한 설명으로 잘못된 것은?", "o": ["운용의 집중도를 높일 수 있다.", "기존 집합투자기구를 모자형집합투자기구로 변경할 수 있으며, 이 경우 하나의 집합투자 기구의 자산을 분리하여 둘 이상의 모집합투자기구로 이전할 수 있다.", "사모집합투자기구가 아닌 집합투자기구로서 원본액이 50 억원 미만일 경우에는 금융위원 회가 고시하는 기준에 따라 이전이 가능하다.", "모자형집합투자기구는 상위 및 하위 투자기구의 집합투자업자가 동일하지만 Fund of Funds의 경우에는 집합투자업자가 동일하지 않은 경우가 대부분이다."], "a": 1, "ep": [3], "n": 44, "takeaway": "모자형은 자펀드가 모펀드에 투자하고 모펀드가 실제 자산을 운용하는 구조입니다. 기존 펀드를 전환할 때에는 자산 이전의 범위가 제한됩니다.", "reasons": ["여러 자펀드의 자금을 모펀드에 모아 운용을 집중할 수 있습니다.", "모자형 전환 자체는 가능하지만 기존 펀드 하나의 자산을 쪼개 여러 모펀드에 넘기는 방식은 허용되지 않습니다.", "보기의 공모펀드 원본액 50억원 미만은 단서에 해당합니다. 기준 충족 여부는 금융위원회가 정하는 요건과 함께 봅니다.", "모자형의 모펀드와 자펀드는 같은 집합투자업자가 운용합니다. 재간접펀드는 다른 운용사 펀드에도 투자할 수 있습니다."]},
{"s": 2, "p": 21, "q": "기초자산의 가격·이자율·지표·단위 또는 이를 기초로 하는 지수 등의 변동과 연계하여 미리 정해진 방법에 따라 지급하거나 회수하는 금전 등이 결정되는 권리가 표시된 것은?", "o": ["ETF", "ELS", "주권", "Futures"], "a": 1, "ep": [4], "n": 62, "takeaway": "기초자산 변동과 연계한 지급조건을 권리로 표시한 ‘증권’이라는 점이 핵심입니다.", "reasons": ["ETF는 거래소에 상장된 집합투자증권입니다. 지수를 추종할 수 있지만 지급구조를 정한 파생결합증권과 다른 범주입니다.", "ELS는 주가나 주가지수 등과 연계해 미리 약속한 방식으로 지급액을 정하는 파생결합증권입니다.", "주권은 회사의 지분을 나타내는 증권입니다. 기초자산에 연동한 별도 지급 공식이 분류의 기준은 아닙니다.", "선물은 미래에 정해진 조건으로 거래하는 파생상품 계약입니다. 보기에서 묻는 파생결합증권은 아닙니다."]},
{"s": 2, "p": 21, "q": "단기금융집합투자기구에 대한 제한사항과 거리가 먼 것은?", "o": ["부동산에 투자할수 없다.", "특별자산에 투자할 수 없다.", "채무증권에 투자할수 없다.", "파생상품에 투자할 수 없다."], "a": 2, "ep": [4], "n": 63, "takeaway": "MMF는 유동성과 안정성을 우선하며, 투자 가능한 자산의 범위가 제한됩니다. 채무증권이라는 이유만으로 투자 금지되는 것은 아닙니다.", "reasons": ["부동산은 MMF가 투자할 수 없는 자산에 해당합니다.", "특별자산도 MMF의 허용 대상에서 벗어납니다.", "단기 채무증권 중 잔존만기와 신용등급 등 요건을 충족하는 자산은 투자할 수 있습니다. 따라서 채무증권 전체를 금지한 설명은 틀립니다.", "파생상품 거래 역시 이 문항에서 묻는 MMF의 투자 제한에 해당합니다."]},
{"s": 2, "p": 21, "q": "집합투자업자가 파생상품매매에 따른 명목계약금액을 산정할 때 사용할 수 있는 방법과 거리가 먼 것은?", "o": ["옵션매도는 델타위험액에 감마위험액과 베가위험액을 모두 합산하여 산정한다.", "회계기준상 위험회피 회계의 적용대상이 되는 거래는 명목계약금액 산정대상에서 제외 할 수 있다.", "서로 다른 통화를 교환하는 거래(통화스왑)의 경우 지급하기로 한 통화의 명목원금이 계 약금액이 된다.", "기초자산이 동일하고 가격의 변화방향이 반대인 파생상품 거래는 명목계약금액 산정대상 에서 제외할 수 있다."], "a": 3, "ep": [4], "n": 64, "takeaway": "규정상 산정에서 제외할 수 있는 거래와 두 거래의 위험을 상계한 뒤 남는 금액을 계산하는 거래를 나눕니다.", "reasons": ["옵션 매도 포지션은 기초자산 가격에 대한 1차 변화인 델타 외에 곡률인 감마와 변동성 민감도인 베가의 위험도 반영합니다.", "회계기준상 위험회피회계 적용대상 거래에는 문항에서 제시된 산정 제외 처리를 적용할 수 있습니다.", "서로 다른 통화를 교환하는 통화스왑에서는 내가 지급하기로 한 통화의 명목원금이 산정의 기준입니다.", "같은 기초자산을 반대 방향으로 보유한 포지션은 요건을 충족하면 위험평가액을 상계합니다. 예를 들어 상계 가능한 위험평가액이 100과 60이면 40이 남으므로 전액을 제외할 수 없습니다."], "reference": ["금융투자업규정 · 위험평가액 산정", "https://www.law.go.kr/LSW/admRulLsInfoP.do?admRulSeq=2100000285020"]},
{"s": 2, "p": 22, "q": "파생상품거래에 따른 만기시점의 손익구조를 공시하는 방법에 대한 설명 중 잘못된 것은?", "o": ["당해 파생상품 기초자산의 가격변동에 따른 손익구조변동을 기재해야 한다.", "이 익발생구간, 손실발생구간으로 구분해야 한다.", "투자자가 이해하기 쉽도록 도표 등으로 나타내야 한다.", "서술식으로 요약하여 기재해야 한다."], "a": 1, "ep": [4], "n": 66, "takeaway": "만기 손익 공시는 기초자산이 어느 수준에 있을 때 이익·무손익·손실이 되는지 읽을 수 있어야 합니다.", "reasons": ["기초자산 가격이 달라질 때 손익구조가 어떻게 달라지는지 표시합니다.", "이익과 손실 두 구간만 쓰면 본전인 경우가 빠집니다. 무손익 구간을 포함해 세 가지로 구분합니다.", "도표는 기초자산 가격과 손익이 연결되는 모습을 시각적으로 보여 주는 방법입니다.", "서술식 요약은 도표에서 중요한 조건과 투자자가 경험할 수 있는 결과를 문장으로 설명합니다."]},
{"s": 2, "p": 22, "q": "파생상품펀드 위험지표의 공시 시기가 잘못된 것은?", "o": ["계약금액은 파생상품 거래 후 그 다음 날까지 공시해야 한다.", "파생상품 거래에 따른 만기시점의 손익구조는 파생상품 거래 후 그 다음 날까지 공시해 야 한다.", "시장상황 변동에 따른 펀드재산의 손익구조변동은 파생상품 거래 후 그 다음 날까지 공시 해야 한다.", "최대손실예상금액은 매일 공시해야 한다."], "a": 2, "ep": [4], "n": 67, "takeaway": "거래로 정해진 항목 두 가지는 거래 후 다음 날까지, 시장 상황에 따라 변하는 위험 지표 두 가지는 매일 공시합니다.", "reasons": ["계약금액은 해당 거래의 규모에 관한 항목이므로 거래 후 다음 날까지입니다.", "만기 손익구조는 거래 계약이 정한 지급구조에 관한 항목으로, 거래 후 다음 날까지입니다.", "펀드재산 손익구조의 변동은 시장 상황에 따라 달라지므로 매일 공시합니다.", "최대손실예상금액도 시장 위험이 변하면 달라지는 지표이므로 매일 공시합니다."], "reference": ["금융투자업규정 · 위험지표 공시", "https://www.law.go.kr/LSW/admRulLsInfoP.do?admRulSeq=2100000285020"]},
{"s": 2, "p": 23, "q": "다음 중 환율관련펀드에 대한 설명으로 올바른 것은?", "o": ["원화 강세가 예상될 때는 하락형 낙아웃 (Knock-Out) 구조가 적절하다.", "환율은 안정적으로 움직이다가 짧은 기간에 큰 폭의 등락을 보이기 때문에 위험관리에 신중하여야 한다.", "환율이 제한적으로 움직일 것으로 예상될 때는 디지털 구조가 유효하다.", "환율 변동 범위가 제한적으로 예상될 때는 낙인 (Knock-In) 구조가 효과적이다."], "a": 1, "ep": [4], "n": 69, "takeaway": "환율연계형은 단순히 환율의 방향만 맞추면 되는 상품이 아닙니다. 지급 기준과 장벽에 도달했을 때 효력이 생기는지 또는 사라지는지도 구분합니다.", "reasons": ["원화 강세는 원/달러 환율 하락을 뜻합니다. 교재는 이 전망에 대응하는 구조로 디지털을 들었으며, 하락형 낙아웃을 정답으로 보지 않습니다.", "환율은 한동안 좁게 움직이다가 짧은 기간 크게 움직일 수 있습니다. 장벽이 있는 상품은 그 한 번의 변동으로 지급조건이 달라질 수 있습니다.", "교재가 제한적인 움직임에 대응하는 사례로 든 구조는 양방향 낙아웃입니다. 디지털은 정해진 조건의 충족 여부로 지급이 갈립니다.", "낙인은 장벽에 닿으면 약정 효과가 생기고, 낙아웃은 장벽에 닿으면 사라지는 구조입니다. 교재는 좁은 변동 범위 전망에 낙아웃을 연결합니다."]},
{"s": 2, "p": 26, "q": "만기가 1개월 남은 선물 1계약을 매입한 투자자의 일일정산 후 증거금이 165만원이다. 증거금 수준이 다음과 같을 때 추가증거금을 가장 많이 납부하여야 하는 경우는?", "o": ["개시증거금 230만원·유지증거금 140만원", "개시증거금 220만원·유지증거금 150만원", "개시증거금 210만원·유지증거금 160만원", "개시증거금 200만원·유지증거금 170만원"], "a": 3, "ep": [5], "n": 77, "takeaway": "먼저 잔고 165만원이 유지증거금보다 적은지 판단합니다. 적을 때만 개시증거금까지 채우며, 산식은 개시증거금 − 현재 잔고입니다.", "reasons": ["165만원은 유지증거금 140만원 이상이므로 추가 납부액은 0원입니다.", "165만원은 유지증거금 150만원 이상이므로 추가 납부액은 0원입니다.", "165만원은 유지증거금 160만원 이상이므로 추가 납부액은 0원입니다.", "165만원이 유지증거금 170만원보다 적으므로 200만원까지 채웁니다. 추가 납부액은 200 − 165 = 35만원입니다."]},
{"s": 2, "p": 26, "q": "주가지수선물 이론가격에 대한 설명으로 가장 올바른 것은?", "o": ["이론적 보유비용은 이론선물가격과 현물가격의 차이이다.", "이론선물가격이 실제선물가격보다 높을 경우 현물을 매입하고 선물을 매도하는 차익거래가 가능하다.", "이자율과 배당률이 동일할 때, 선물의 만기가 길어질수록 이론선물가격은 높아진다.", "배당률이 낮아지면 이론선물가격은 낮아진다."], "a": 0, "ep": [5], "n": 78, "takeaway": "시험에서 쓰는 식은 이론선물가격 = 현물가격 + 현물가격 × (이자율 − 배당률) × 잔존기간(연 단위)입니다. 이자율은 보유 비용이고 배당은 보유 편익입니다.", "reasons": ["이론선물가격에서 현물가격을 빼면 이론적 순보유비용이 남습니다.", "실제 선물이 이론가보다 싸면 상대적으로 싼 선물을 매수하고 현물을 매도하는 방향입니다. 보기는 두 거래 방향을 뒤집었습니다.", "이자율과 배당률이 같으면 순보유비용이 0이므로 잔존기간이 길어져도 이 식에서 이론가는 현물가와 같습니다.", "배당률이 낮아지면 이자율 − 배당률이 커집니다. 따라서 다른 조건이 같을 때 선물 이론가는 올라갑니다."], "reference": ["필수암기공식 30 · 선물의 균형가격", "../%ED%95%B4%EC%BB%A4%EC%8A%A4/%ED%95%84%EC%88%98%EC%95%94%EA%B8%B0%EA%B3%B5%EC%8B%9D_30.html#formula-21"]},
{"s": 2, "p": 27, "q": "A 주식의 가격이 150 원일 때, A 주식에 대한 콜옵션 매수 포지션의 시간가치가 가장 큰 것은?", "o": ["만기 1개월, 행사가격 160원, 프리미엄 10원", "만기 2개월, 행사가격 155원, 프리미엄 20원", "만기 3개월, 행사가격 145원, 프리미엄 30원", "만기 4개월, 행사가격 140원, 프리미엄 40원"], "a": 3, "ep": [5], "n": 80, "takeaway": "콜옵션의 내재가치는 max(주가 − 행사가격, 0)입니다. 시간가치는 프리미엄에서 내재가치를 뺀 값입니다. 만기가 가장 긴 것을 고르기 전에 각 보기를 계산합니다.", "reasons": ["행사가 160원은 주가 150원보다 높습니다. 내재가치 0원, 시간가치 10 − 0 = 10원입니다.", "행사가 155원은 주가 150원보다 높습니다. 내재가치 0원, 시간가치 20 − 0 = 20원입니다.", "행사가 145원이므로 내재가치 150 − 145 = 5원, 시간가치 30 − 5 = 25원입니다.", "행사가 140원이므로 내재가치 150 − 140 = 10원, 시간가치 40 − 10 = 30원으로 가장 큽니다."]},
{"s": 2, "p": 28, "q": "다음 중 백투백 (BTB) 거래를 하는 파생결합증권 발행사의 리스크관리에 대한 설명으로 옳은 것은?", "o": ["신용 리스크의 관리방안으로는 Funded Swap의 활용 및 담보제공계약 등이 있다.", "파생결합증권과 동일한 수익구조의 장외파생상품 거래를 하므로 시장 리스크는 발생하지 않는다.", "표준적인 담보제공계약서는 별도의 법률적 자문이 필요 없다.", "파생결합증권과 장외파생상품 거래는 상이한 양식의 계약서로 이루어져 있으므로 특별히 검토할 필요는 없다."], "a": 1, "ep": [5], "n": 84, "takeaway": "백투백은 발행사가 투자자에게 지급할 손익과 맞물리는 거래를 외부 상대방과 체결하는 방식입니다. 시장위험을 맞춰도 거래상대방과 계약의 위험은 별도로 남습니다.", "reasons": ["교재는 신용위험 관리 수단으로 Unfunded Swap과 담보제공계약을 제시합니다. 보기는 스왑의 유형을 바꿨습니다.", "조건과 현금흐름이 정확히 대응하고 계약이 정상 이행된다는 출제 전제에서는 시장변동 손익이 서로 상쇄됩니다.", "표준 담보계약 양식을 쓰더라도 준거법과 담보권, 계약 종료 시 정산 조항 등 실제 효력을 검토해야 합니다.", "발행 증권과 헤지 계약의 지급조건·일정 등이 다르면 손익이 어긋날 수 있으므로 계약 간 일치 여부를 확인해야 합니다."]},
{"s": 2, "p": 28, "q": "다음 중 환리스크 헤지에 대한 설명으로 거리가 먼 것은?", "o": ["채권형 펀드의 경우 대체로 투자원금 규모의 50 〜 70% 의 환헤지를 하는 것이 보통이다.", "역외펀드의 경우 환율의 폭등과 투자원금의 손실이 겹치면서 의도하지 않은 과다헤지로 인한 추가손실이 발생하기도 한다.", "통화선물보다 선물환 거래의 유동성이 더 풍부하다.", "펀드 만기보다 짧은 만기의 선물환 거래를 하였을 경우, 만기이월 시 펀드에서 가용현금이 부족한 사태가 발생할 수 있다."], "a": 0, "ep": [5], "n": 85, "takeaway": "환헤지 금액은 외화자산의 노출액과 연결됩니다. 헤지 비율, 자산가치 변동, 헤지 계약 만기는 구분해서 봅니다.", "reasons": ["교재는 채권형 펀드가 통상 투자원금 규모로 환헤지한다고 설명합니다. 50~70%를 채권형에 일률적으로 적용한 것이 틀렸습니다.", "외화자산이 줄었는데 기존 헤지 금액이 그대로면 실제 외화노출보다 많은 외화를 매도한 상태가 될 수 있습니다. 외화가 급등하면 초과 매도분에서 손실이 날 수 있습니다.", "교재는 기관투자자의 환헤지 수단을 비교할 때 선물환 시장의 유동성이 더 풍부하다고 봅니다.", "선물환이 펀드보다 먼저 만기되면 기존 계약의 정산과 새 계약 체결이 필요합니다. 정산 시점에 가용현금이 모자랄 수 있습니다."]},
{"s": 3, "p": 29, "q": "부동산펀드의 운용제한에 대한 설명 중 잘못된 것은?", "o": ["부동산펀드에서 취득한 부동산은 일정 기간 내 처분을 제한하고 있다.", "부동산펀드에서 토지를 취득한 경우 원칙적으로 그 토지에 대하여 부동산개발사업 시행 전에 처분할 수 없다.", "전문투자형사모펀드가 부동산에 투자하는 경우에는 ①의 처분제한 이외의 다른 운용규제 를 적용받지 않는다.", "부동산개발회사가 발행한 증권은 사모에 한하여 펀드재산의 100%까지 투자할 수 있다."], "a": 3, "ep": [5], "n": 87, "takeaway": "문항은 실물 부동산의 처분 제한과 부동산 관련 증권의 투자 한도를 섞어 놓았습니다. 두 규제는 적용 대상이 다릅니다.", "reasons": ["부동산을 직접 취득하면 단기 처분을 제한하는 규정이 적용될 수 있습니다.", "개발 목적으로 보유한 토지의 사업 시행 전 처분도 출제 기준에서는 원칙적으로 제한됩니다.", "보기의 ‘전문투자형사모펀드’는 원본 용어입니다. 문항은 교재의 당시 분류에서 사모펀드 운용 특례를 묻습니다.", "부동산개발회사·부동산투자목적회사가 발행한 증권과 주택저당담보부채권·주택저당증권은 이 문제의 기준에서 공모와 사모 모두 100%까지 투자할 수 있습니다. ‘사모에 한하여’가 틀렸습니다."]},
{"s": 3, "p": 31, "q": "펀드재산의 50%를 초과하여 부동산과 관련된 증권에 투자하는 부동산펀드는?", "o": ["실물형부동산펀드", "대출형부동산펀드", "재간접형부동산펀드", "증권형부동산펀드"], "a": 3, "ep": [5], "n": 91, "takeaway": "부동산과 관련된 증권에 펀드재산의 50%를 초과해 투자한다는 표현이 증권형을 가리킵니다.", "reasons": ["실물형은 건물이나 토지 등 부동산 자체를 직접 보유하는 방식입니다.", "대출형은 개발사업 등에 대출해 이자·원리금을 회수하는 구조입니다. 대출과 증권 매입은 구별합니다.", "재간접형은 다른 펀드의 집합투자증권에 투자하는 구조입니다. 글로벌 리츠에 투자하는 사례처럼 증권형과 재간접의 설명이 함께 해당할 수 있지만, 이 문항에는 재간접을 특정하는 단서가 없습니다.", "부동산담보부채권처럼 부동산 관련 증권을 주된 자산으로 삼는 유형이 증권형입니다."]},
{"s": 3, "p": 31, "q": "부동산펀드의 종류 및 특성에 관한 설명으로 잘못된 것은?", "o": ["펀드의 설정·설립 이전에 펀드재산으로 투자할 부동산 등이나 대출할 대상개발사업을 미 리 특정하는 형태를 사전특정형부동산펀드라고 한다.", "국내에서 설정·설립되는 대부분의 부동산펀드는 사전불특정 (Blind) 형부동산펀드에 해당한다.", "펀드재산으로 투자할 대상이 미리 특정하지 않은 상태에서 펀드자금을 모집하는 펀드를 사전불특정 형 부동산펀드라고 한다.", "경·공매형부동산펀드는 사전불특정 형부동산펀드의 대표적인 사례이다."], "a": 1, "ep": [5], "n": 92, "takeaway": "기준은 펀드 설정·설립 또는 자금 모집 전에 구체적인 투자대상이 정해져 있는지입니다.", "reasons": ["어느 부동산을 취득하거나 어떤 개발사업에 대출할지 미리 정했다면 사전특정형입니다.", "원본 해설은 국내의 대표적인 유형을 사전특정형으로 설명합니다. ‘사전불특정형’으로 뒤집은 것이 출제 의도입니다.", "투자대상을 확정하지 않고 먼저 자금을 모집한 뒤 대상을 찾는 구조가 사전불특정형(블라인드)입니다.", "경매나 공매로 실제 취득할 물건은 낙찰 결과에 달려 있어 교재가 든 사전불특정형의 사례입니다."]},
{"s": 3, "p": 31, "q": "다음 중 임대형부동산펀드에 대한 설명으로 거리가 먼 것은?", "o": ["일종의 매입 - 임대 (Buy & Lease) 방식의 부동산펀드라고 할 수 있다.", "업무용 부동산 또는 상업용 부동산 등과 같은 수익성 부동산을 대상으로 한다.", "안정적인 이자소득과 매각에 따른 자본소득을 주된 운용전략으로 한다.", "대표적인 위험요인은 관리비 상승이다."], "a": 3, "ep": [5], "n": 93, "takeaway": "원본 정답은 ④입니다. 임대형의 수익원은 보유 기간의 임대료와 매각차익이며, 공실은 임대료 수입을 직접 줄입니다.", "reasons": ["부동산을 매입한 뒤 임대해 현금흐름을 얻는 Buy & Lease 전략에 해당합니다.", "업무용·상업용 부동산은 임대료를 얻기 위해 매입하는 대표적인 수익성 자산입니다.", "문제 PDF에는 ‘이자소득’이라고 인쇄되어 있으나, 임대형이 직접 얻는 것은 임대소득입니다. 이자소득은 대출형의 수익에 가깝습니다.", "관리비 상승도 운영비 부담이지만, 교재가 강조하는 대표 위험은 공실률입니다. 빈 면적이 늘면 임대료 수입이 감소합니다."]},
{"s": 3, "p": 33, "q": "부동산시장의 세 가지 하부시장으로 잘못된 것은?", "o": ["공간시장", "자산시장", "개발시장", "대출시장"], "a": 3, "ep": [5], "n": 97, "takeaway": "세 하부시장은 공간의 사용, 부동산 소유권의 거래, 새로운 공간의 공급으로 나뉩니다.", "reasons": ["공간시장에서는 임차 수요와 공간 공급이 임대료와 공실률에 영향을 줍니다.", "자산시장에서는 부동산을 매입하고 매각합니다. 임대수익과 투자자가 요구하는 수익률이 자산가격에 영향을 줍니다.", "개발시장에서는 개발사업을 통해 신규 부동산이 공급됩니다. 개발비용과 준공 후 예상 가치가 중요한 판단 요소입니다.", "대출시장은 자금조달에 영향을 주지만 이 문항이 적용하는 세 하부시장 분류에는 포함되지 않습니다."]},
{"s": 3, "p": 33, "q": "다음 중 프로젝트 파이낸싱(PF)에 대한 설명으로 잘못된 것은?", "o": ["프로젝트 파이낸싱 (PF)은 물적 담보로 대출을 받는 것이 아니라 사업자의 신용이나 해 당 사업으로부터 발생하는 미래의 현금흐름을 담보로 자금을 조달하는 공급자금융이다.", "원리금 상환은 해당 사업에서 발생하는 현금흐름에 의존하기 때문에 사업의 수익성이 장 기, 안정, 고수익성이어야 하므로 대부분 대규모 프로젝트나 해외 건설부문에 많이 사용 된다.", "해당 사업이 도산할 경우 사업의 수익성을 담보로 한 대출이기 때문에 사업주는 개인적인 채무를 지지 않지만, 이 경우에 해당 사업에서 발생하는 현금흐름이나 자산의 범위 내에 서 채권청구가 가능하다.", "다양한 사업 주체가 해당 사업에 참여하고 이해당사자 간의 위험분산이 가능하나 이해당 사자 간의 계약관계에 따라 절차가 복잡하므로 사업이 지연될 가능성이 있다."], "a": 0, "ep": [5], "n": 98, "takeaway": "PF의 핵심은 해당 프로젝트에서 창출될 현금흐름으로 원리금을 갚도록 자금조달을 설계하는 데 있습니다.", "reasons": ["‘사업자의 신용이나’라는 부분이 틀렸습니다. 사업주 전체의 신용을 주된 상환재원으로 삼는 기업금융과 구별합니다.", "대규모·장기 프로젝트에서는 사업 진행과 운영을 통해 상환에 필요한 현금흐름이 꾸준히 발생할지 검토합니다.", "교재는 비소구·제한소구 구조를 전제로 합니다. 채권자의 청구 범위와 보증 등 추가 책임은 계약 조건으로 정합니다.", "시공사, 대주, 운영사 등 여러 참여자에게 위험을 배분할 수 있지만 계약 협상과 의사결정은 복잡해질 수 있습니다."]}
];const SUBJECTS={"1":"펀드일반","2":"파생상품펀드","3":"부동산펀드"};
const S='fund-hackers-wrong-01-v1',circ=['①','②','③','④'];
let A=Array(Q.length).fill(null),filter=0,wrong=false,unanswered=false,allExp=false,summaryOpen=false;
try{const saved=JSON.parse(localStorage.getItem(S)||'null');if(Array.isArray(saved))A=Q.map((_,i)=>Number.isInteger(saved[i])&&saved[i]>=0&&saved[i]<4?saved[i]:null)}catch(e){document.getElementById('storageStatus').textContent='저장된 기록을 읽지 못해 새 풀이를 시작합니다.'}

function esc(text){return String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function questionText(text){
 const lines=text.split('\n');
 const bulletIndex=lines.findIndex(line=>line.trimStart().startsWith('•'));
 if(bulletIndex<0)return esc(text);
 return esc(lines.slice(0,bulletIndex).join('\n'))+`<span class="question-bullets">${esc(lines.slice(bulletIndex).join('\n'))}</span>`;
}
function context(q){
 if(q.data)return `<div class="question-data">${q.data.map((item,i)=>`<p>${'㉠㉡㉢㉣㉤㉥㉦'[i]} ${esc(item)}</p>`).join('')}</div>`;
 if(q.table){const [headers,values]=q.table;return `<div class="table-scroll question-table"><table aria-label="A펀드 성과지표"><tbody>${headers.map((x,i)=>`<tr><th scope="row">${esc(x)}</th><td>${esc(values[i])}</td></tr>`).join('')}</tbody></table></div>`}
 return '';
}
function explanation(q){
 const reasons=q.reasons.map((reason,index)=>{
  const answer=index===q.a;
  return `<li${answer?' class="answer"':''}><span class="choice-number">${circ[index]}</span><span>${esc(reason)}</span></li>`;
 }).join('');
 const reference=q.reference?`<a class="source" href="${esc(q.reference[1])}">${esc(q.reference[0])}</a>`:'';
 return `<p class="review-takeaway">${esc(q.takeaway)}</p><ol class="review-reasons" aria-label="보기별 해설" role="list">${reasons}</ol><div class="review-citation"><span class="source">정답·해설 PDF ${q.ep.join('·')}쪽</span>${reference}</div>`;
}
function render(){let shown=0;document.getElementById('questions').innerHTML=Q.map((q,i)=>{if(filter&&q.s!==filter)return '';const a=A[i],done=a!==null,ok=a===q.a;if(wrong&&(!done||ok))return '';if(unanswered&&done)return '';shown++;return `<article class="qcard ${done?'answered':''} ${done&&!ok?'wrong-answer':''}" id="q${q.n}"><div class="meta"><span>제${q.s}과목 · ${SUBJECTS[q.s]}</span><a class="source" href="%ED%95%B4%EC%BB%A4%EC%8A%A4_%EC%8B%A4%EC%A0%84%EB%AA%A8%EC%9D%98%EA%B3%A0%EC%82%AC_01.html#q${q.n}">원본 Q${q.n}</a><span>문제 PDF ${q.p}쪽</span></div><div class="q">Q${q.n}. ${questionText(q.q)}</div>${context(q)}<div class="opts">${q.o.map((x,j)=>`<button class="opt ${done&&j===q.a?'ok':''} ${done&&j===a&&!ok?'bad':''}" aria-pressed="${a===j}" onclick="pick(${i},${j})">${circ[j]} ${esc(x)}</button>`).join('')}</div><div class="exp ${done||allExp?'show':''}"><b>${done?(ok?'정답입니다.':'오답입니다.')+' ':''}정답 ${circ[q.a]} · 상세 해설</b>${explanation(q)}</div></article>`}).join('')||'<div class="empty">해당 조건의 문제가 없습니다.</div>';document.getElementById('countline').textContent=`현재 ${shown}문항 표시 · ${filter?SUBJECTS[filter]:'전체 과목'}${wrong?' · 다시 틀린 문제만':''}${unanswered?' · 미응답만':''}`;document.querySelectorAll('.filter').forEach((b,i)=>b.setAttribute('aria-pressed',String(filter===i)));document.getElementById('wrongbtn').setAttribute('aria-pressed',String(wrong));document.getElementById('unansweredbtn').setAttribute('aria-pressed',String(unanswered));document.getElementById('expbtn').setAttribute('aria-pressed',String(allExp));document.getElementById('expbtn').textContent=allExp?'해설 전체 접기':'해설 전체 펼치기';progress();if(summaryOpen)updateSummary()}
function pick(i,j){const x=window.scrollX,y=window.scrollY;A[i]=j;save();const q=Q[i],c=document.getElementById('q'+q.n);if(c){c.classList.add('answered');c.classList.toggle('wrong-answer',j!==q.a);c.querySelectorAll('.opt').forEach((b,n)=>{b.classList.toggle('ok',n===q.a);b.classList.toggle('bad',n===j&&j!==q.a);b.setAttribute('aria-pressed',String(n===j))});const e=c.querySelector('.exp');e.classList.add('show');e.innerHTML=`<b>${j===q.a?'✓ 정답입니다.':'✕ 오답입니다.'} 정답 ${circ[q.a]} · 상세 해설</b>${explanation(q)}`;progress();if(summaryOpen)updateSummary()}else render();if(window.scrollY!==y)window.scrollTo({left:x,top:y,behavior:'instant'});requestAnimationFrame(()=>{if(window.scrollY!==y)window.scrollTo({left:x,top:y,behavior:'instant'})})}
function progress(){
 [0,1,2,3].forEach(subject=>{
  const indices=Q.map((q,i)=>i).filter(i=>!subject||Q[i].s===subject);
  const total=indices.length;
  const done=indices.filter(i=>A[i]!==null).length;
  const correct=indices.filter(i=>A[i]===Q[i].a).length;
  const percentage=total?Math.round(done/total*100):0;
  document.getElementById('t'+subject).textContent=`풀이 ${done}/${total} · 정답 ${correct}`;
  document.getElementById('b'+subject).style.width=percentage+'%';
  document.getElementById('progress'+subject).setAttribute('aria-valuenow',String(percentage));
 });
}
function setf(s){filter=s;render()}
function toggleWrong(){wrong=!wrong;unanswered=false;render()}
function toggleUnanswered(){unanswered=!unanswered;wrong=false;render()}
function toggleExp(){allExp=!allExp;render()}
function updateSummary(){let rows='';[0,1,2,3].forEach(s=>{const idx=Q.map((q,i)=>i).filter(i=>!s||Q[i].s===s),done=idx.filter(i=>A[i]!==null).length,ok=idx.filter(i=>A[i]===Q[i].a).length;rows+=`<tr><th>${s?SUBJECTS[s]:'전체'}</th><td>${ok}/${idx.length}</td><td>${done-ok}</td><td>${idx.length-done}</td><td>${done?(ok/done*100).toFixed(1)+'%':'—'}</td></tr>`});document.getElementById('summary').innerHTML=`<h2>채점 요약 · 총 ${Q.filter((q,i)=>A[i]===q.a).length}/${Q.length}점</h2><div class="table-scroll"><table><thead><tr><th>과목</th><th>정답/전체</th><th>오답</th><th>미응답</th><th>응답 정답률</th></tr></thead><tbody>${rows}</tbody></table></div><p class="meta">각 1점 · 응답 정답률은 푼 문항만 기준으로 계산합니다.</p>`}
function grade(){summaryOpen=true;updateSummary();const el=document.getElementById('summary');el.hidden=false;el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}
function resetAll(){if(!confirm('이 오답 복습의 풀이기록을 모두 초기화할까요?'))return;A=Array(Q.length).fill(null);wrong=false;unanswered=false;allExp=false;summaryOpen=false;document.getElementById('summary').hidden=true;save();render()}
window.addEventListener('beforeprint',()=>{window._printState={filter,wrong,unanswered,allExp};filter=0;wrong=false;unanswered=false;allExp=true;render()});window.addEventListener('afterprint',()=>{if(!window._printState)return;({filter,wrong,unanswered,allExp}=window._printState);delete window._printState;render()});
render();

if(Number.isInteger(requestedSubject)&&requestedSubject>=0&&requestedSubject<=3)setf(requestedSubject);
