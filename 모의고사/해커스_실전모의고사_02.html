<div class="controls" aria-label="문제 필터"><button type="button" class="study-theme-toggle" id="study-theme-toggle" aria-pressed="false">다크모드</button><button class="btn filter" id="filter0" aria-pressed="true" onclick="setf(0)">전체</button><button class="btn filter" id="filter1" aria-pressed="false" onclick="setf(1)">제1과목 · 펀드일반</button><button class="btn filter" id="filter2" aria-pressed="false" onclick="setf(2)">제2과목 · 파생상품펀드</button><button class="btn filter" id="filter3" aria-pressed="false" onclick="setf(3)">제3과목 · 부동산펀드</button><button class="btn" id="wrongbtn" aria-pressed="false" onclick="toggleWrong()">오답만 보기</button><button class="btn" id="unansweredbtn" aria-pressed="false" onclick="toggleUnanswered()">미응답만 보기</button><button class="btn" id="expbtn" aria-pressed="false" onclick="toggleExp()">해설 전체 펼치기</button><button class="btn" onclick="grade()">채점 요약</button><button class="btn" onclick="resetAll()">기록 초기화</button></div><div class="countline" id="countline" aria-live="polite"></div><div class="status" id="storageStatus" role="status"></div><section class="summary" id="summary" hidden tabindex="-1" aria-label="채점 결과"></section></section><main class="wrap"><div id="questions"></div><footer>문제 및 해설의 쪽수는 각 원본 PDF 기준입니다.<br>진행기록은 이 브라우저에 저장됩니다. 파일을 다른 브라우저나 경로에서 열면 기록이 별도로 관리될 수 있습니다.</footer></main><script>const Q=[{"s":1,"p":1,"q":"집합투자증권의 투자권유에 대한 설명 중 잘못된 것은?","o":["집합투자증권 판매를 위한 광고 시 과거 운용실적은 광고에 포함될 수 없다.","불초청 투자권유 행위는 원칙적으로 금지되나 투자자보호 및 거래질서를 해할 우려가 없는 증권과 장내파생상품에 대한 투자권유 행위는 예외적으로 가능하다.","투자자정보의 확인은 서명, 기명날인, 녹취뿐만 아니라 전자우편이나 전화자동응답시스 템의 방법으로도 가능하다.","투자설명서는 집합투자업자가 작성하며, 판매 시 투자자에게 투자설명서를 제공하고 그 주요내용을 설명해야 한다."],"a":0,"e":"집합투자증권 판매를 위한 광고 시 과거 운용실적은 광고에 포함될 수 있다.","ep":[1]},{"s":1,"p":1,"q":"다음 중 일반사무관리회사의 업무와 거리가 먼 것은?","o":["투자회사재산의 계산","주식발행","명의개서","투자자산의 보관"],"a":3,"e":"일반사무관리회사의 업무에는 투자회사운영, 주식 발행 및 명의개서, 투자회사재산의 계산, 법령 또는 정관에 의한 통지 및 공고, 이사회·주주총회의 소집 등이 포함된다.","ep":[1]},{"s":1,"p":1,"q":"다음 중 금융소비자보호법상 금융소비자의 대출성 상품 청약철회권에 대한 설명이 잘못 된 것은?","o":["금융투자회사와 관련하여 청약철회의 대상은 자본시장법 제72조 1 항에 따른 신용공여가 대표적이다.","대출성 상품에 대하여 일반금융소비자는 계약서류제공일 또는 계약체결일로부터 7일 이 내에만 청약을 철회할 수 있다.","담보로 제공된 증권이 자본시장법에 따라 처분된 경우에는 청약철회권을 행사할 수 없다.","청약철회는 일반금융소비자가 금융상품판매업자에게 청약철회의 의사를 서면 등으로 발 송하고, 금융상품판매업자에게 이미 공급받은 금전 등을 회사에 반환한 때 효력이 발생 한다."],"a":1,"e":"대출성 상품에 대하여 일반소비자는 계약서류제공일 또는 계약체결일로부터 14일 이내에 청약을 철회 할 수 있다.","ep":[1]},{"s":1,"p":2,"q":"집합투자업자의 불건전 영업행위와 거리가 먼 것은?","o":["특정 집합투자기구의 이익을 해하지 않으면서 자기 또는 제3자의 이익을 도모하는 행위","투자대상자산의 가격에 중대한 영향을 미칠 수 있는 매매의사를 결정한 후 이를 실행하기 전에 그 투자대상자산을 집합투자업자 자기의 계산으로 매매하거나 제3자에게 매매를 권유하는 행위","제3자와의 계약 또는 담합 등에 의하여 집합투자재산으로 특정 자산에 교차하여 투자하 는 행위","특정 집합투자재산을 집합투자업자의 고유재산 또는 그 집합투자업자가 운용하는 다른 집합투자재산, 투자일임재산 또는 신탁재산과 거래하는 행위"],"a":0,"e":"특정 집합투자기구의 이익을 해하면서 자기 또는 제3자의 이익을 도모하는 행위는 불건전 영업행위로 금지된다. 특정 집합투자기구의 이익을 해하지 않으면서 자기 또는 제3자의 이익을 도모하는 행위는 가능하다.","ep":[1]},{"s":1,"p":2,"q":"신탁업자의 확인사항과 거리가 먼 것은?","o":["폐쇄형펀드 집합투자증권 추가 발행 시 기존 투자자의 이익을 해할 우려가 없는지 여부","장외파생상품 운용에 따른 위험관리방법의 작성이 적정한지 여부","자산운용보고서 작성이 적정한지 여부","펀드재산의 운용 여부"],"a":3,"e":"펀드재산의 운용은 집합투자업자의 업무이다.","ep":[1]},{"s":1,"p":2,"q":"집합투자증권의 집합투자재산 보관에 대한 설명 중 옳은 것은?","o":["투자신탁재산은 집합투자업자 명의로 신탁업자가 보관한다.","투자회사재산은 투자회사 명의로 자산보관회사가 보관한다.","대부분의 유가증권은 증권금융에서 보관한다.","집합투자업자가 집합투자재산을 직접 보관하기도 한다."],"a":1,"e":"① 투자신탁재산은 신탁업자 명의로 신탁업자가 보관한다.\n③ 대부분의 유가증권은 예탁결제원이 보관한다.\n④ 집합투자업자가 집합투자재산을 직접 보관하는 경우는 없다.","ep":[1]},{"s":1,"p":3,"q":"집합투자증권의 집합투자재산에는 주식도 포함된다. 주식을 보유하면 의결권을 행사할 수 있는데 이에 대한 설명으로 옳은 것은?","o":["투자신탁 집합투자업자는 의결권을 직접 행사할 수 없다.","주식발행인이 집합투자업자의 계열사인 경우에는 중립투표를 해야 한다.","동일종목 투자한도를 초과하면 모든 의결권 행사가 제한된다.","집합투자업자의 의결권 행사내용은 공시사항이 아니다."],"a":1,"e":"① 투자신탁 집합투자업자는 의결권을 직접 행사할 수 있다. ③ 동일종목 투자한도를 초과하면 초과분에 한하여 의결권 행사가 제한된다. ④ 집합투자업자는 의결권 행사내용을 공시해야 한다.","ep":[1]},{"s":1,"p":3,"q":"투자신탁의 수익자총회에 대한 설명 중 잘못된 것은?","o":["3%이상 보유 수익자는 집합투자업자에게 총회소집을 요구할 수 있다.","신탁계약으로 정한 사항의 의결은 출석자 과반수와 총좌수의 1/5 이상으로 의결할 수 있다.","총회 결의에 반대하는 수익자는 결의일로부터 20일 이내에 집합투자업자에 대하여 자신 의 수익증권 매수를 청구할 수 있다.","간주의결권이 행사되려면 수익자총회의 의결권을 행사한 총좌수가 발행총좌수의 1/10 이상이어야한다."],"a":0,"e":"5%이상 보유 수익자는 집합투자업자에게 총회소집을 요구할 수 있다.","ep":[1]},{"s":1,"p":3,"q":"투자신탁의 집합투자업자는 신탁재산의 효율적 운용을 위하여 자신의 명의로 직접 투자 대상자산을 취득·처분하는 경우가 있다. 다음 중 이에 대한 설명으로 잘못된 것은?","o":["집합투자업자는 상장채권을 취득·처분 시 상장채권의 운용을 담당하는 직원과 취득·처분 의 실행을 담당하는 직원을 구분해야 한다.","신탁업자는 신탁재산의 취득·처분 등의 주문서와 자산배분명세서의 적정성 및 그 이행 여부를 확인해야 한다.","집합투자업자는 신탁재산별로 미리 정하여진 자산배분명세에 따라 취득·처분의 결과를 공정하게 배분해야 한다.","집합투자업자는 신탁재산을 취득·처분하기 전에 신탁재산별로 주문금액, 가격, 수량 등을 기재한 주문서와 배분내용을 기재한 자산배분명세서를 작성해야 한다."],"a":1,"e":"집합투자업자의 준법감시인은 신탁재산의 취득·처분 등의 주문서와 자산배분명세서의 적정성 및 그 이행 여부를 확인해야 한다.","ep":[1]},{"s":1,"p":4,"q":"다음 중 신탁업자의 확인사항과 거리가 먼 것은?","o":["집합투자재산 평가의 공정성 여부","환매수수료 산정의 적정성 여부","장외파생상품 운용에 따른 위험관리방법의 작성이 적정한지 여부","폐쇄형펀드 집합투자증권 추가발행 시 기존 투자자의 이익을 해할 우려가 없는지 여부"],"a":1,"e":"신탁업자의 확인사항에는 ①③④ 이외에도 투자설명서가 법령 및 규약에 부합하는지 여부, 기준가격 산정의 적정성 여부(편차가 0.3%이내이면 적정한 것), 자산운용보고서 작성의 적정성 여부, 운용지시 등의 시정요구에 대한 집합투자업자의 이행명세 등이 있다.","ep":[1]},{"s":1,"p":4,"q":"집합투자업자의 영업행위 규제에 대한 설명 중 잘못된 것은?","o":["투자신탁의 집합투자업자는 신탁업자에 대하여 투자대상자산의 취득·처분 등에 관하여 필요한 지시를 한다.","신탁업자는 집합투자업자의 지시에 따라 투자대상자산의 취득·처분 등을 해야 한다.","단기대출 (Call Loan)은 집합투자업자가 직접 투자대상자산을 취득·처분할 수 없다.","시가총액비중이 10%를 넘는 지분증권은 그 시가총액비중까지 투자할 수 있다."],"a":2,"e":"단기대출 (Call Loan)은 집합투자업자가 직접 취득·처분할 수 있다.","ep":[1]},{"s":1,"p":4,"q":"자본시장법상 집합투자업의 규제에 대한 설명 중 잘못된 것은?","o":["공모집합투자기구는 원칙적으로 성과보수를 받을 수 없다.","투자신탁 집합투자재산의 법적 소유자는 신탁업자이다.","집합투자업자의 수시공시 방법은 인터넷 홈페이지, 전자우편, 본점·지점·그 밖의 영업소 에 게시하는 방법 중 어느 하나의 방법만 하면 안 되고 3 가지 방법 모두를 이행하여야 한다.","원칙적으로 집합투자재산으로 금전차입과 대여를 할 수 있다."],"a":3,"e":"원칙적으로 집합투자재산으로 금전차입과 대여가 금지된다.","ep":[1]},{"s":1,"p":5,"q":"집합투자기구의 증권 투자제한에 대한 설명 중 잘못된 것은?","o":["원칙적으로 자산총액의 10%를 초과하여 동일종목에 투자할 수 없다.","지방채, 특수채, 파생결합증권, OECD 회원국 또는 중국 정부 발행채권은 자산총액의 30%까지 투자할 수 있다.","동일법인이 발행한 지분증권 총수의 20%를 초과하여 투자할 수 없다.","집합투자업자가 다수의 집합투자기구를 운용하는 경우 모든 집합투자기구의 자산총액 으로 동일법인이 발행한 지분증권 총수의 20%를 초과하여 투자할 수 없다."],"a":2,"e":"동일법인이 발행한 지분증권 총수의 10%를 초과하여 투자할 수 없다.","ep":[2]},{"s":1,"p":5,"q":"윤리경영과 직무윤리가 강조되는 이유와 가장 거리가 먼 것은?","o":["윤리경쟁력은 기업과 개인의 경쟁력 평가기준이 되기 때문이다.","위기의 시대, 불확실성의 시대에는 위험비용을 고려해야 하기 때문이다.","직무윤리가 공공재 역할을 하며 무형의 자본이 되었기 때문이다.","이익상충과 정보비대칭 문제가 없어졌기 때문이다."],"a":3,"e":"이익상충과 정보비대칭 문제가 발생하기 때문에 직무윤리가 강조되는 것이다.","ep":[2]},{"s":1,"p":5,"q":"다음 중 ‘투자성 상품’을 일반금융소비자에게 권유하는 경우 설명해야 할 사항과 가장 거 리가 먼 것은?","o":["투자성 상품의 내용과 위험","투자성 상품에 대한 금융상품직접판매업자가 정하는 위험등급","금리 및 변동 여부","금융상품과 연계되거나 제휴된 금융상품 또는 서비스"],"a":2,"e":"금리 및 변동 여부는 ‘대출성 상품’을 일반금융소비자에게 권유하는 경우에 설명해야 할 사항에 해당한다.","ep":[2]},{"s":1,"p":6,"q":"다음 중 직무윤리에 대한 설명이 잘못된 것은?","o":["과당매매, 매매형태 명시의무 위반 등이 이해상충에 해당한다고 볼 수 있다.","Chinese Wall 구축의무는 정보교류를 차단시키기 위함이다.","투자매매 업자나 투자중개업자가 증권시장을 통하여 매매하는 경우 자기계약금지규정이 적용된다.","금융투자업종사자는 투자대상 선정과 포트폴리오 구축 시 적용되는 기본적 원칙과 방법, 이들에 중대한 영향을 미칠 수 있는 모든 사항 및 그 중대한 변경 등을 고객이 이해할 수 있도록 설명해야 한다."],"a":2,"e":"투자매매업자나 투자중개업자가 증권시장 또는 파생상품시장을 통하여 매매하는 경우에는 자기계약 금지규정이 적용되지 않는다.","ep":[2]},{"s":1,"p":6,"q":"금융투자업종사자의 합리적 근거 제공 및 정확한 표시의무에 대한 설명 중 잘못된 것은?","o":["중요한 사실에 대한 정확한 표시는 반드시 문서로 해야 한다.","정확한 표시란 중요사항이 빠짐없이 표시되고 그 내용이 충분, 명료한 것을 의미한다.","고객의 투자판단에 중요한 영향을 미친다고 생각되는 투자대상에 관한 중요정보뿐만 아니 라 투자수익에 영향을 주는 정보에도 적용되는 의무이다.","금융투자업자의 투자권유 시 정밀한조사·분석에 기초한 자료에 의하여야 하고, 합리적이 고 충분한 근거를 가져야 한다."],"a":0,"e":"정확한 표시의 방법은 구두, 문서, 이메일 등 제한이 없으므로 반드시 문서로 해야 하는 것은 아니다.","ep":[2]},{"s":1,"p":6,"q":"금융투자업종사자에 대한 재산상 이익의 제한에 대한 규제내용이 잘못된 것은?","o":["금융투자업종사자는 수수료 및 비용징수에 관한 사항을 사전에 고객에게 고지해야 한다.","조사분석자료 작성 담당자에 대하여 기 업금융업무와 연동된 성과보수를 지급하는 것은 금지된다.","수수료 부과기준을 정할 때 투자자를 정당한 사유 없이 차별하면 안 된다.","금융투자업자는 수수료 부과기준 및 절차에 관한 사항을 금융위원회에 통보해야 한다."],"a":3,"e":"금융투자업자는 수수료 부과기준 및 절차에 관한 사항을 금융투자협회에 통보해야 한다. 금융투자협회는 통보받은 사항을 금융투자업자별로 비교하여 공시해야 한다.","ep":[2]},{"s":1,"p":7,"q":"아래 금융투자업종사자의 투자권유 중 직무윤리를 준수했다고 볼 수 있는 경우는?","o":["A 상담사는 주식은 미래가치를 반영하므로 미래전망 위주로 설명하였다.","B 상담사는 주관적 예감으로 확실히 수익이 날 것 같은 상품을 권유하였다.","C 상담사는 중요한 사실이 아니고 오히려 그것을 설명함으로써 고객의 판단에 혼선을 줄 수 있는 사항을 설명하지 않았다.","D 상담사는 고객을 강하게 설득하기 위해 투자성과가 보장된다고 설명하였다."],"a":2,"e":"투자권유는 객관적 사실에 기초하여야 하고, 사실과 의견을 구분하여야 하며, 투자성과를 보장하는 듯한 표현은 금지된다.","ep":[2]},{"s":1,"p":7,"q":"금융투자업종사자의 회사에 대한 의무로 옳은 것은?","o":["지적재산물의 처분권한은 원칙적으로 개발자에게 있다.","금융투자업종사자가 대외활동을 할 경우에는 고객, 회사와의 이해상충뿐만 아니라 주주와 의 이해상충도 발생하지 않도록 필요한 준법절차를 밟아야 한다.","성희롱방지도 넓은 의미의 직무전념의무에 해당한다.","회사에 대한 선관주의의무는 퇴직시점에 종료된다."],"a":1,"e":"① 지적재산물의 처분권한은 원칙적으로 회사에 있다. ③ 성희롱방지도 넓은 의미의 품위유지의무에 해당한다. ④ 회사에 대한 선관주의의무는 퇴직 후에도 상당기간 지속된다.","ep":[2]},{"s":1,"p":7,"q":"금융투자업종사자의 대외활동 규제에 대한 설명 중 잘못된 것은?","o":["익명성이 보장되는 경우에도 비공개를 요하는 정보는 언급하지 않아야 한다.","정기적 정보제공이나 경미한 것은 준법감시인에게 사전 보고하지 않아도 된다.","임직원-고객 간 이메일은 회사 내 컴퓨터를 이용하는 경우에 한하여 표준내부통제기준 및 관계법령이 적용된다.","비밀정보인지 불명확한 경우 준법감시인의 사전 승인을 받아야 한다."],"a":2,"e":"임직원-고객 간 이메일은 사용 장소에 관계없이 표준내부통제기준 및 관계법령이 적용된다.","ep":[2]},{"s":1,"p":8,"q":"준법감시제도에 대한 설명 중 잘못된 것은?","o":["내부통제기준은 임직원이 직무를 수행함에 있어서 준수하여야 할 적절한 기준 및 절차를 의미한다.","내부통제기준의 제정 및 개정은 이사회 결의를 거쳐야한다.","준법감시인은 회사경영 및 영업활동 등 업무전반에 대한 준법감시 프로그램을 구축하고 운영해야 한다.","내부고발자가 인사상 불이익을 받은 경우 준법감시인은 회사에 대해 시정을 요구할 수 있으나, 회사가 이에 응해야 할 의무는 없다."],"a":3,"e":"내부고발자가 인사상 불이익을 받은 경우 준법감시인은 회사에 대해 시정을 요구할 수 있으며, 회사는 정당한 사유가 없는 한 이에 응해야 한다.","ep":[2]},{"s":1,"p":8,"q":"투자자와의 금융분쟁에 대한 설명 중 잘못된 것은?","o":["금융분쟁은 금융수요자 등이 금융업무와 관련하여 이해관계가 발생함에 따라 금융기관을 상대로 제기하는 분쟁이다.","금융 관련 기관이 금융 관련 기관을 상대로 제기하는 분쟁은 금융분쟁에 해당하지 않는다.","금융분쟁은 주로 금융투자업자에게 부여하는 의무 이행 여부가 쟁점이 된다.","금융투자업 영위과정에서 거래관계가 수반되는 권리·의무에 대한 상반된 주장을 분쟁이 라는 형태로 도출하는 것이다."],"a":1,"e":"금융 관련 기관이 금융 관련 기관을 상대로 제기하는 분쟁도 금융분쟁에 해당한다.","ep":[2]},{"s":1,"p":8,"q":"다음 중 금융상품판매업자의 불공정영업행위 금지의무와 거리가 먼 것은?","o":["업무와 관련하여 편익을 요구하거나 제공받는 행위","특정 대출상환방식을 강요하는 행위","대출계약 성립일로부터 3년 경과 전 중도상환수수료를 부과하는 행위","연계제휴서비스 등이 있는 경우 이를 부당하게 축소하거나 변경하는 행위"],"a":2,"e":"대출계약 성립일로부터 3년 경과 후 수수료, 위약금 또는 그 밖에 어떤 명목이든 중도상환수수료를 부과 하는 행위는 금지된다. 다만, 대출계약 성립일로부터 3년 이내에 상환하는 경우, 다른 법령에 따라 중도상환수수료 부과가 허용되는 경우에는 예외적으로 중도해지수수료의 부과가 가능하다.","ep":[2]},{"s":1,"p":9,"q":"금융투자상품 관련 분쟁의 유형 및 책임에 대한 설명이 잘못된 것은?","o":["금융투자회사의 직원이 임의매매한 경우 민사상 손해배상책임뿐만 아니라 형사처벌도 받을 수 있다.","과도한 매매는 고객충실의무에 위반하는 행위로 민사상 손해배상책임이 발생할 수 있다.","불완전판매는 부당권유행위라고 볼 수는 없으므로 불법행위에 해당되지는 않는다.","설명의무를 제대로 하지 않아 위험성에 대한 투자자의 인식형성을 방해하면 부당권유행위 에 해당되어 민사상 손해배상책임을 질 수 있다."],"a":2,"e":"불완전판매는 부당권유의 한 유형에 해당되며, 적정성의 원칙·적합성의 원칙·설명의무·손실보전약정 금지 등을 종합적으로 고려하여 민법상의 불법행위 여부를 판단하게 된다.","ep":[2]},{"s":1,"p":9,"q":"우리나라 자금세탁방지제도 (CDD, STR, CTR)를 규정하고 있는 법률로 올바른 것은?","o":["특정금융거래보고법","전자금융거래법","자본시장법","조세특례제한법"],"a":0,"e":"CDD, STR, CTR 등과 같은 주요 자금세탁방지제도는 특정금융거래보고법에 규정되어 있다.","ep":[2]},{"s":1,"p":9,"q":"해외금융계좌 납세자협력법 (FATCA)의 적용대상자와 거리가 먼 것은?","o":["미국 시민권자","미국 영주권자","외국인 중 세법상미국 거주자","한국과 중국 국적을 모두 보유한 이중국적자"],"a":3,"e":"해외금융계좌 납세자협력법 (FATCA)의 적용대상자는 미국 시민권자, 미국 영주권자, 외국인 중 세법상 미국 거주자 등이다.","ep":[2]},{"s":1,"p":10,"q":"자금세탁방지제도에 대한 설명 중 잘못된 것은?","o":["금융회사는 고객확인·의심거래·고액현금거래 자료 등을 고객과의 거래관계 종료 후 5년 이상 보존하여야 한다.","실명이 확인된 계좌에 보유하고 있는 자산은 명의자 소유로 추정한다.","금융기관 등은 100 만원을 초과하는 모든 국내·외 전신송금에 대하여 고객과 관련된 정보 를 확인하고 보관해야 한다.","CDD는 회사가 자금세탁 등에 임직원이 이용되지 않도록 하기 위해 임직원을 채용(재직 중 포함)하는 때에 그 신원사항을 확인하는 것을 말한다."],"a":3,"e":"CDD는 고객확인제도이다. 회사가 자금세탁 등에 임직원이 이용되지 않도록 하기 위해 임직원을 채용 (재직 중 포함)하는 때에 그 신원사항을 확인하는 것은 직원알기 제도 (Know Your Employee) 이다.","ep":[2]},{"s":1,"p":10,"q":"펀드판매절차에 대한 설명으로 가장 거리가 먼 것은?","o":["투자자정보 파악 절차를 거부하는 경우 투자자의 서명을 받고 투자자가 요구하는 펀드를 판매해야 한다.","투자자정보 확인서를 통하여 본인의 투자성향을 알려주고 그 과정과 의미를 설명해야 한다.","투자자가 투자자성향에 따른 권유 펀드를 거부하고 더 높은 위험수준의 펀드 매수를 요청 하는 경우 부적합 금융투자상품 거래 확인서를 받고 판매하거나 거래를 중단해야 한다.","투자자가 펀드매수를 원치 않으면 해당 펀드를 이해할 때까지 좀 더 쉽고 자세하게 설명 해야 한다."],"a":3,"e":"투자자가 펀드매수를 원치 않으면 해당 펀드 투자권유를 중지해야 한다.","ep":[2]},{"s":1,"p":10,"q":"투자권유에 대한 설명 중 잘못된 것은?","o":["투자자가 투자권유를 희망하지 않아 투자자정보를 제공하지 않는 경우에는 향후에도 투자 권유를 할 수 없음을 알려야 한다.","투자권유가 없었는데 고객이 스스로 찾아와서 파생상품 등을 판매하게 된 경우에는 그 투자자의 투자자정보를 파악하지 않아도 된다.","집합투자증권의 경우에는 투자자가 투자설명서 교부를 별도로 요청하지 않는 경우 간이투 자설명서 교부로 갈음할 수 있다.","위험이 높지 않은 상품만 거래하는 투자자는 별도의 투자자정보 확인서를 사용하여 투자 자정보를 간략하게 파악할 수 있다."],"a":1,"e":"파생상품 등을 판매하려는 경우에는 투자권유를 하지 않더라도 면담·질문 등을 통하여 그 투자자의 투자자정보를 파악하여야 한다","ep":[2]},{"s":1,"p":11,"q":"설문이나 답변 등을 통하여 부적합한 상품을 제거해 나가는 투자성향 분류방식은?","o":["점수화방식","추출방식","혼합방식","상담보고서방식"],"a":1,"e":"추출방식은 설문이나 답변을 통해 부적합상품을 제거해 나가는 방식이다.","ep":[2]},{"s":1,"p":11,"q":"임의식 수익증권저축의 내용과 거리가 먼 것은?","o":["저축기간을 정하지 않는다.","저축금액을 정하지 않는다.","추가납입이 가능하다.","일부인출이 불가능하다."],"a":3,"e":"일부인출이 가능하다.","ep":[2]},{"s":1,"p":11,"q":"납세의무의 성립시기가 잘못된 것은?","o":["소득세, 법인세-과세기간이 종료하는 때","원천징수하는소득세·법인세-소득금액·수입금액이 확정되는 때","증여세-증여에 의하여 재산을 취득하는 때","상속세-상속이 개시되는 때"],"a":1,"e":"원천징수하는 소득세·법인세는 소득금액·수입금액을 지급하는 때에 납세의무가 성립한다.","ep":[2]},{"s":1,"p":11,"q":"세법상 제 2 차 납세의무자에 해당하지 않는 자는?","o":["사업양수인","법인","출자자","법정대리인"],"a":3,"e":"제 2 차 납세의무자는 청산인, 잔여재산을 분배받은 자, 출자자, 법인, 사업양수인 등이다.","ep":[2]},{"s":1,"p":12,"q":"소득이 장기간에 걸쳐 발생되거나 비경상적으로 발생된 것으로 종합소득과 구분하여 각 소득별로 소득세를 과세하는 방법으로 옳은 것은?","o":["종합과세","분리과세","분류과세","비과세"],"a":2,"e":"소득이 장기간에 걸쳐 발생되거나 비경상적으로 발생된 것으로 종합소득과 구분하여 각 소득별로 소득세를 과세하는 방법을 분류과세라 하며, 양도소득과 퇴직소득에 대해서는 분류과세방법에 의하여 과세 한다.","ep":[2]},{"s":1,"p":12,"q":"세법상 일부손익 과세제외 규정에 따라 과세제외되는 경우에 해당하는 것은?","o":["재간접펀드에서 발생한 소득","국채에서 발생한 소득","비상장주식에서 발생한 소득","주식옵션에서 발생한 소득"],"a":3,"e":"일부손익 과세제외 규정이 적용되는 유가증권은 상장된 유가증권(단, 채권, 외국법령에 의한 외국집합투자기구의 주식·수익증권 제외), 증권을 대상으로 하는 장내파생상품, 벤처기업의 주식 또는 출자지분 등이다.","ep":[2]},{"s":1,"p":12,"q":"우리나라의 대표적인 집합투자기구 형태로 올바른 것은?","o":["투자신탁","투자회사","투자유한회사","투자합자회사"],"a":0,"e":"우리나라 집합투자기구의 대표적인 형태는 투자신탁이다.","ep":[2]},{"s":1,"p":12,"q":"증권신고서를 제출하지 않아도 되는 경우에 해당하는 것은?","o":["투자신탁의 수익증권을 발행하고자 하는 경우","투자회사의 증권을 발행하고자 하는 경우","투자조합의 조합원을 모집하려고 하는 경우","특수채증권을 발행하고자 하는 경우"],"a":3,"e":"국채, 지방채, 특수채, 국가 또는 지자체가 원리금 의 지급을 보증한 채무증권 등을 발행하는 경우에는 사실상 지급불능의 위험이 없으므로 별도의 증권신고서 제출이 면제된다.","ep":[3]},{"s":1,"p":13,"q":"일괄신고서제도에 대한 설명 중 잘못된 것은?","o":["최초 신고 시 일정 기간 동안 모집하거나 매출할 증권의 총액을 미리 정해야 한다.","정해진 기간과 금액 범위 내에서는 해당 집합투자업자가 자신의 고유 권한으로 그 증권을 추가 발행할 수 있다.","집합투자업자는 최초 신고 이후에는 증권이 추가 발행되어도 증권신고서를 추가로 제출 할 의무가 없다.","일괄신고서는 폐쇄형 집합투자기구가 증권발행을 효율적으로 하기 위해 도입되었다."],"a":3,"e":"일괄신고서는 개방형 집합투자기구가 증권발행을 효율적으로 하기 위해 도입되었다.","ep":[3]},{"s":1,"p":13,"q":"증권신고서의 내용에 대하여 금융위원회가 정정신고를 요구할 수 있는 사유와 거리가 먼 것은?","o":["증권신고서의 형식이 갖추어지지 않은 경우","증권신고서 주요 사항에 대하여 거짓으로 기재한 경우","증권신고서 주요 사항이 누락된 경우","집합투자업자의 보수가 높은 경우"],"a":3,"e":"집합투자업자의 보수가 높다는 이유로 금융위원회가 정정신고를 요구할 수는 없다.","ep":[3]},{"s":1,"p":13,"q":"집합투자기구 등록 시 1 억원의 자본금을 요건으로 하는 집합투자기구와 거리가 먼 것은?","o":["투자신탁","투자회사","투자유한회사","투자합자회사"],"a":0,"e":"투자신탁 등록 시에는 자본금 1 억원의 요건이 없다.","ep":[3]},{"s":1,"p":13,"q":"수익자총회의 결의가 필요한 신탁계약 변경사항에 해당하는 것은?","o":["보수 및 수수료의 인하","판매회사의 변경","폐쇄형에서 개방형으로 변경하는 경우","신탁계약기간을 변경하는 경우"],"a":3,"e":"신탁계약기간을 변경하는 경우에는 수익자총회의 결의가 필요하다.","ep":[3]},{"s":1,"p":14,"q":"다음 중 부동산집합투자기구로 보기 힘든 것은?","o":["A 집합투자기구는 부동산투자회사가 발행한 주식에 51%를 투자하였다.","B 집합투자기구는 부동산개발회사가 발행한 증권에 61%를 투자하였다.","C 집합투자기구는 부동산투자목적회사가 발행한 지분증권에 60%를 투자하였다.","D 집합투자기구는 부동산이 대부분을 차지하는 상장법인의 지분에 61%를 투자하였다."],"a":3,"e":"부동산이 대부분을 차지하는 상장법인의 지분에 50%를 초과하여 투자하면 증권집합투자기구에 해당한다.","ep":[3]},{"s":1,"p":14,"q":"다음 중 금융소비자보호법상 금융위원회의 판매제한명령에 대한 설명이 잘못된 것은?","o":["금융위원회가 판매제한명령권을 행사하려면 명령대상자에게 명령의 필요성 및 판단근거, 절차 및 예상시기, 의견제출방법 등을 사전에 고지해야 한다.","금융위원회는 명령 발동 전에 명령대상자에게 의견을 제출할 수 있는 충분한 기간을 보장 해야 한다.","금융위원회는 명령 발동 후 지체 없이 그 내용을 홈페이지에 게시해야 한다.","판매제한명 령을 하면 신규판매행위를 중단하더라도 판매제한명령권 행사를 중단할 수 없다."],"a":3,"e":"금융위원회는 이미 금융소비자의 재산상 피해 발생 우려가 제거된 경우, 신규판매행위를 중단한 경우 등의 사유가 발생하면 판매제한명령권의 행사를 중단할 수 있다.","ep":[3]},{"s":1,"p":14,"q":"자본시장법상 집합투자기구의 종류에 대한 설명으로 잘못된 것은?","o":["일반투자자가 가장 많이 투자하는 집합투자기구는 증권집합투자기구이다.","부동산개발과 관련된 법인에 대한 대출은 부동산 관련 자산에 포함되지 않는다.","와인, 그림, 날씨 등에 투자하는 집합투자기구는 특별자산집합투자기구에 해당한다.","혼합자산집합투자기구는 어떤 자산이든 투자비율의 제한 없이 투자할 수 있다."],"a":1,"e":"부동산개발과 관련된 법인에 대한 대출도 부동산관련 자산에 포함된다.","ep":[3]},{"s":1,"p":15,"q":"특수한 형태의 집합투자기구에 대한 설명으로 잘못된 것은?","o":["자산총액의 20%를 초과하여 시장성 없는 자산에 투자하는 경우에는 환매금지형집합투자 기구로 설정해야 한다.","종류형집합투자기구라도 집합투자업자 및 신탁업자의 보수는 클래스별로 차별화하지 못한다.","전환형집합투자기구의 경우 투자기구 간 교체를 위해 투자기구를 환매하는 경우에는 교체 시점에 환매수수료를 징수한다.","모자형집합투자기구는 다수의 투자기구 대신 하나의 투자기구만 운용할 수 있게 되므로 운용의 집중도를 높일 수 있다는 장점이 있다."],"a":2,"e":"전환형집합투자기구의 경우 투자기구 간 교체를 위해 투자자가 집합투자증권을 환매하는 경우에는 해당 투자기구의 환매수수료 조항에도 불구하고 그 환매수수료를 적용하지 않고 유보한다. 다만, 그 투자자가 마지막으로 투자한 투자기구에서 사전에 정한 기간에 미치지 못하는 기간만 투자하고 해당증권을 환매하는 경우에는 유보했던 환매수수료를 재징수하게 된다.","ep":[3]},{"s":1,"p":15,"q":"사모집합투자기구에 대한 설명으로 가장 거리가 먼 것은?","o":["공모에 의하지 아니하고 해당 집합투자기구의 집합투자증권을 매각하여 투자기구를 설정 하는 것이다.","투자자의 수가 적으므로 공모보다 제약이 낮은 수준으로 규제하고 있다.","사모투자자는 그 자산에 대하여 어느 정도 이해하고 투자하는 것으로 간주한다.","공모집합투자기구에 적용되는 규정 중 투자광고규정은 적용이 배제되지만, 회계감사인의 손해배상책임의무에 대한 규정은 적용된다."],"a":3,"e":"회계감사인의 손해배상책임의무에 대한 규정도 적용되지 않는다.","ep":[3]},{"s":1,"p":15,"q":"파생상품펀드에 대한 설명으로 가장 거리가 먼 것은?","o":["주가연계파생상품의 기초자산은 지수뿐만 아니라 개별종목도 가능하다.","증권사는 파생 결합증권을 발행하고, 운용사는 주가연계 파생결합증권을 편입한 구조화펀 드를 제공한다.","금융공학펀드(또는 델타펀드)는 장외파생상품을 이용한 펀드이다.","기초자산이 두 종목으로 구성된 원금비보존형 파생상품펀드는 두 종목의 상관관계가 낮을수록 쿠폰이 높다."],"a":2,"e":"금융공학펀드(또는 델타펀드)는 장내파생상품을 이용한 펀드이다. 장외파생상품(장외옵션)을 매입하여 운용하는 펀드는 ELF (구조화펀드)이다.","ep":[3]},{"s":1,"p":16,"q":"특별자산펀드에서 펀드재산의 50%를 초과하여 투자해야만 하는 특별자산에 해당하지 않는 것은?","o":["특별자산이 신탁재산의 50%이상을 차지하는 수익증권","선박투자회사가 발행한 주식","사회기반시설사업의 시행을 목적으로 하는 법인이 발행한 주식과 채권","부동산투자회사가 발행한 주식"],"a":3,"e":"부동산투자회사가 발행한 주식은 부동산펀드에서 펀드재산의 50%를 초과하여 투자해야만 하는 부동산자산에 해당한다.","ep":[3]},{"s":1,"p":16,"q":"신탁의 기본구조에 대한 설명 중 잘못된 것은?","o":["대부분의 신탁은 유언에 의하여 설정된다.","신탁이 설정되면 신탁재산의 소유자 및 권리자는 위탁자에서 수탁자로 변경된다.","신탁 원본과 이익은 모두 수익자에게 귀속된다.","수익자는 수탁자를 감시하고 감독할 권한이 있다."],"a":0,"e":"신탁은 신탁계약, 유언, 신탁선언 등에 의하여 설정되며, 대부분의 신탁은 신탁계약에 의하여 설정 된다.","ep":[3]},{"s":1,"p":16,"q":"다음 중 재산신탁과 거리가 먼 것은?","o":["증권신탁","특정금전신탁","부동산신탁","무체재산권신탁"],"a":1,"e":"재산신탁에는 증권신탁, 금전채권신탁. 동산신탁, 부동산신탁, 부동산권리신탁, 무체 재산권신탁 등이 있다.","ep":[3]},{"s":1,"p":17,"q":"신탁상품의 판매에 대한 설명 중 잘못된 것은?","o":["지정형 특정금전신탁의 경우 반드시 투자자정보를 확인해야 하며. 불원 또는 미제공 시 신탁계약을 체결할 수 없다.","특정금전신탁의 경우에는 일반적인 신탁상품에 대하여 설명하는 사항 이외에 추가로 설명해야 하는 것이 있다.","전문투자자라 할지라도 상품설명서 및 상담확인서를 징구해야 한다.","여러 신탁재산을 집합하여 운용하는 행위는 금지된다."],"a":0,"e":"불특정금전신탁 또는 비지정형 특정금전신탁의 경우 반드시 투자자정보를 확인해야 하며, 불원 또는 미제공 시 신탁계약 체결이 불가능하다.","ep":[3]},{"s":1,"p":17,"q":"주식투자분석에 대한 설명으로 잘못된 것은?","o":["주가매출액비율 (PSR : Price Sales Ratio)은 주가를 주당매출액으로 나누어 계산한다.","주가수익비율 (PER : Price Earning Ratio)은 주가가 주당순이익의 몇 배인가를 나타내는 지표이다.","주가순자산비율 (PBR : Price to Book value Ratio)은 주가를 주당순자산으로 나누어 계산한다.","PBR은 부(—)의 EPS 기업에는 적용할 수 없다."],"a":3,"e":"PER은 부(-)의 EPS 기업에 적용할 수 없으나 PBR은 적용 가능하다.","ep":[3]},{"s":1,"p":17,"q":"말킬 (B. G. Malkiel)의 채권가격정리에 대한 설명으로 잘못된 것은?","o":["채권가격과 채권수익률은 반비례 관계에 있다.","장기채가 단기채보다 일정한 수익률 변동에 대한 가격 변동폭이 크다.","만기가 일정할 때 수익률 하락에 의한 가격 상승폭이 같은 폭의 수익률 상승에 의한 가격 하락폭보다 작다.","표면이자율이 낮은 채권이 높은 채권보다 일정한 수익률 변동에 따른 가격 변동률이 크다."],"a":2,"e":"만기가 일정할 때 수익률 하락에 의한 가격 상승폭이 같은 폭의 수익률 상승에 의한 가격 하락폭보다 크다.","ep":[3]},{"s":1,"p":18,"q":"다음의 신용등급을 가진 채권 중 다른 조건이 일정하다고 가정했을 때, 채권금리가 가장 높다고 볼 수 있는 것은?","o":["BB 등급 회사채","AAA 등급 은행채","AA 등급 회사채","국고채"],"a":0,"e":"위험과 수익률은 비례한다. 일반적으로 채권의 신용 위험은 ‘국채 \u003c AAA 등급 은행채 \u003c AA 등급 회사채 \u003c BBB 등급 회사채 \u003c BB 등급 회사채’ 순이다. 그러므로 위험이 가장 높은 BB 등급 회사채의 채권금리가 가장 높다.","ep":[3]},{"s":1,"p":18,"q":"다음 중 절대적 위험지표로 옳은 것은?","o":["공분산 (Covariance)","표준편차 (Standard Deviation)","초과수익률 (Excess Return)","상대 VaR(Relative VaR)"],"a":1,"e":"절대적 위험 척도에는 표준편차와 VaR가 있다. 상대적 위험 척도에는 공분산, 초과수익률, 베타, 상대 VaR, 추적오차가 있다.","ep":[3],"image":"assets/mock-02-056-explanation.webp"},{"s":1,"p":18,"q":"펀드운용의 3단계 중 계획단계가 순서대로 나열된 것은?","o":["투자방침 설정 → 투자자의 투자목적(수익·위험)과 제약요인 파악 → 투자대상자산의 위험 및 기대수익률 계산 → 전략적 자산배분 결정","투자자의 투자목적(수익·위험)과 제약요인 파악 → 투자방침 설정 → 투자대상자산의 위험 및 기대수익률 계산 → 전략적 자산배분 결정","투자방침 설정 → 투자대상자산의 위험 및 기대수익률 계산 → 투자자의 투자목적(수익·위험)과 제약요인 파악 → 전략적 자산배분 결정","투자자의 투자목적(수익·위험)과 제약요인 파악 → 투자대상자산의 위험 및 기대수익률 계산 → 투자방침 설정 → 전략적 자산배분 결정"],"a":1,"e":"계획단계는 투자자의 투자목적(수익·위험)과 제약요인 파악 → 투자방침 설정 → 투자대상자산의 위험 및 기대수익률 계산 → 전략적 자산배분 결정 순이다.","ep":[3]},{"s":1,"p":19,"q":"다음 중 펀드의 유형에 대한 적절한 설명으로 모두 묶인 것은?","o":["㉠, ㉡","㉠, ㉢","㉡, ㉢","㉠, ㉡, ㉢"],"a":3,"e":"㉠, ㉡, ㉢ 모두 옳은 설명이다.","ep":[3],"data":["수익·위험구조 및 벤치마크가 유형분류의 기준이 되기도 한다.","펀드의 유형이 바뀌면 펀드의 상대적인 우열(순위 등)이 바뀔 수 있다.","펀드평가회사에 따라 펀드의 유형이 달라질 수 있다."]},{"s":1,"p":19,"q":"채권투자 성과를 이자수익과 자본손익으로 구분하여 측정하고자 한다. 2년 만기 은행채를 4%에 매입하여 1년간 보유한 후 4.5%에 매도할 때의 투자수익률로 옳은 것은? (단, 매도 시 듀레이션은 1로 가정)","o":["연 3.5%","연 4.0%","연 4.5%","연 5.0%"],"a":0,"e":"이자수익 = 매입금리 = 4%\n자본손익 = −매도 시 듀레이션 × 금리변동 × 연율화 = −1 × 0.5%p × 1 = −0.5%\n채권투자수익률 = 이자수익 + 자본손익 = 연 3.5%","ep":[3]},{"s":1,"p":19,"q":"A펀드의 성과지표가 다음과 같을 때, A펀드의 베타 값으로 옳은 것은?","o":["0.8","1.0","1.2","1.5"],"a":1,"e":"젠센의 알파 = (펀드수익률 − 무위험수익률) − (시장수익률 − 무위험수익률) × 베타\n10% = (30% − 5%) − (20% − 5%) × 베타\n따라서 베타는 1.0이다.","ep":[3,4],"table":[["A펀드 수익률","A펀드 젠센의 알파","무위험수익률","시장수익률(벤치마크 수익률)"],["30%","10%","5%","20%"]]},{"s":2,"p":20,"q":"다음 중 지분증권과 거리가 먼 것은?","o":["주권","신주인수권이 표시된 것","출자지분","지급청구권이 표시된 것"],"a":3,"e":"지급청구권이 표시된 것은 채무증권에 해당한다.","ep":[4]},{"s":2,"p":20,"q":"다음 중 장내파생상품시장의 거래에 해당하지 않는 것은?","o":["한국거래소 규정에 따라 장내에서 이루어지는 코스피 200 선물거래","한국 금융기관에서 환위험을 방지하기 위해 이루어지는 선물환거래","런던 금속거래소 규정에 따라 장외에서 이루어지는 금속거래","미국 선물협회 규정에 따라 장외에서 이루어지는 외국환거래"],"a":1,"e":"선물환거래는 장외파생상품시장의 거래에 해당한다. 반면 장내파생상품시장의 거래에는 국내 파생상품시장에서 거래되는 것과 해외 파생상품시장에서 거래되는 것이 있다.","ep":[4]},{"s":2,"p":20,"q":"파생상품펀드에 대한 설명 중 잘못된 것은?","o":["자본시장법에서 독립된 하나의 펀드로 명시적으로 인정하고 있지 않다.","펀드재산의 50%를 초과하여 파생결합증권에 운용하는 펀드이다.","파생상품매매에 따른 위험평가액이 펀드자산총액의 10%를 초과하여 투자할 수 있는 펀드이다.","MMF 도 예외적인 경우에는 파생상품에 투자할 수 있다."],"a":3,"e":"MMF는 파생상품 투자가 불가능하다.","ep":[4]},{"s":2,"p":21,"q":"모든 펀드에 공통적으로 적용되는 운용규제에 대한 설명 중 잘못된 것은?","o":["동일종목의 파생결합증권에 투자하는 경우 펀드자산총액의 30%까지 투자할 수 있고, 사모펀드의 경우에는 100%까지 투자할 수 있다.","펀드재산으로 파생상품을 매매하는 경우 파생상품 매매에 따른 위험평가액이 순자산총액의 100%를 초과할 수 없다.","파생상품의 기초자산 중 동일법인이 발행한 증권의 가격변동으로 인한 위험평가액이 각 펀드자산총액의 20%를 초과할 수 없다.","같은 거래 상대방과의 장외파생상품 매매에 따른 거래 상대방 위험평가액이 각 펀드자산총액의 10%를 초과할 수 없다."],"a":2,"e":"파생상품의 기초자산 중 동일법인이 발행한 증권의 가격변동으로 인한 위험평가액이 각 펀드자산총액의 10%를 초과할 수 없다.","ep":[4]},{"s":2,"p":21,"q":"다음 중 금융투자상품에 포함되지 않는 것은?","o":["RP","CD","ETF","ELS"],"a":1,"e":"자본시장법은 원화표시 CD, 관리형신탁의 수익권, 주식매수선택권 (Stock Option)을 명시적으로 금융투자상품에 해당하지 않는 것으로 정하였다.","ep":[4]},{"s":2,"p":21,"q":"투자자 등급별로 차등화된 투자권유준칙을 고려할 경우 가장 적절하지 않은 것은?","o":["만 65 세 이상의 투자자에게 파생상품 등의 투자권유를 하지 않았다.","만 65 세 이상이면서 파생상품 등에 대한 투자경험이 1 〜 3 년인 투자자에게 원금손실률이 20% 미만인 파생결합증권에 대해 투자권유를 하였다.","만 65 세 미만의 투자자에게 원금손실률이 20% 미만인 파생결합증권에 대해 투자권유를 하였다.","만 65 세 미만이면서 파생상품 등에 대한 투자경험이 1 〜 3 년인 투자자에게 장외파생상품 에 대해 투자권유를 하였다."],"a":3,"e":"만 65 세 미만이면서 파생상품 등에 대한 투자경험이 1~3 년인 투자자에게는 장외파생상품에 대한 투자권유를 하지 않는 것이 바람직하다.","ep":[4]},{"s":2,"p":21,"q":"파생상품펀드에 적용되는 강화된 투자자보호제도와 거리가 먼 것은?","o":["부당권유 규제","적정성의 원칙","차등화된 투자권유 준칙 마련","투자권유대행인의 투자권유 제한"],"a":0,"e":"부당권유 규제는 일반적인 투자자보호제도에 해당한다.","ep":[4]},{"s":2,"p":22,"q":"워런트 투자에 대한 설명과 거리가 먼 것은?","o":["선물투자와 같은 선형구조의 수익 추구가 가능하다.","레버리지 효과, 즉 적은 자본을 투자하여도 큰 자본을 투자하는 효과를 얻을 수 있다.","기초자산의 가격 변동에 따른 수익을 얻으면서도 원금보존 추구형이 가능하다.","가격 위험과 신용 위험에 동시에 노출된다."],"a":0,"e":"워런트 투자는 비선형구조의 수익 추구가 가능하다.","ep":[4]},{"s":2,"p":22,"q":"다음 빈칸에 들어갈 용어를 순서대로 바르게 나열한 것은?\n파생결합증권 편입 시 원금이 거래 상대방에게 제공될 때 ( )이라고 하며, 원금 교환 없이 이자만 교환할 때 ( ) 또는 ( )이라고 한다.","o":["Unfunded Swap, Funded Swap, CD Swap","Funded Swap, Unfunded Swap, CD Swap","CD Swap, Unfunded Swap, Funded Swap","Funded Swap, Unfunded Swap, FX Swap"],"a":1,"e":"파생결합증권 편입 시 원금이 거래 상대방에게 제공될 때는 Funded Swap 이라고 하며, 원금 교환 없이 이자만 교환할 때는 Unfunded Swap 또는 CD Swap 이라고 한다.","ep":[4]},{"s":2,"p":22,"q":"다음 중 주가연계증권 (ELS) 에 대한 설명으로 잘못된 것은?","o":["주가연계증권 (ELS)의 기초자산은 대개 개별주가나 국내·국외 주가지수를 이용한다.","수익구조가 미리 확정되어 있기 때문에 증권사의 신용도와는 관련이 없다.","증권사에서 발행하며 수익구조는 기초자산에 연동된다.","증권사는 만기 또는 조기상환 시 기초자산 가격에 따라 원리금을 지급하여야 한다."],"a":1,"e":"증권사는 만기 또는 조기상환 시 기초자산 가격에 따라 원리금을 지급하여야 하므로 투자매매업자인 증권사의 신용도는 중요하다.","ep":[4]},{"s":2,"p":22,"q":"워런트 투자의 수익률은 참여율에 의하여 결정된다. 만일 기초자산이 KOSPI200 지수 이고 참여율이 40% 인 유럽형 콜옵션에 투자하였다면, 만기에 KOSPI200 지수가 30% 상승하였을 때 워런트 수익률은 얼마인가?","o":["10%","12%","14%","16%"],"a":1,"e":"참여율이 40%이므로 워런트 수익률은 0.3 × 0.4 = 0.12이다. 따라서 수익률은 12%이다.","ep":[4]},{"s":2,"p":23,"q":"3개월 동안 CD 91 일물이 0%이상 7%이하에 있는 일수를 계산한 후, 3개월 동안의 전체 일수로 나누어 쿠폰을 결정하는 상품으로 옳은 것은?","o":["스프레드 (Spread)","레인지 (Range)","레인지 어크루얼 (Range Accrual)","디지털 (Digital)"],"a":2,"e":"일정 기간을 두고 기초자산에 대한 특정 조건을 만족하는 일수를 계산하여 수익을 결정하는 구조는 레인지 어크루얼 (Range Accrual) 이다.","ep":[4]},{"s":2,"p":23,"q":"다음 중 지수가 10% 상승하면 펀드는 10% 수익이 나고, 지수가 10% 하락하면 10% 손 실을 보는 펀드로 옳은 것은?","o":["파생형 인덱스펀드","리버스(Reverse) 인덱스펀드","시스템 운용형(Managed Futures) 펀드","시장 중립형(Market Neutral) 펀드"],"a":0,"e":"② 리버스 (Reverse) 인덱스펀드는 지수의 움직임과 반대의 수익률을 추구하는 펀드, 즉 지수가 상승하면 손실이 발생하고, 지수가 하락하면 이익이 발생하는 펀드이다. ③ 시스템 운용형 (Managed Futures) 펀드는 펀드 매니저의 주관을 배제한 채 시스템에서 보내주는 매매 신호에 따라 기계적으로 파생상품을 거래하는 펀드이다. ④ 시장 중립형 (Market Neutral) 펀드는 시장의 움직임과 무관하게 사전에 정해진 목표수익률을 추구하는 절대수익 (Absolute Return) 추구형 펀드이다.","ep":[4]},{"s":2,"p":23,"q":"포트폴리오 보험형 펀드의 투자기법과 가장 거리가 먼 것은?","o":["방어적 풋전략","Covered Call 전략","시간 불변 포트폴리오 보존전략 (TIPP)","이자추출전략"],"a":1,"e":"Covered Call 전략은 포트폴리오 보험형 펀드의 투자기법에 해당되지 않는다.","ep":[4]},{"s":2,"p":23,"q":"다음 중 환리스크 헤지에 대한 설명으로 잘못된 것은?","o":["현물환 매입·선물환 매도의 FX Swap은 펀드 만기와 선물환 만기가 일치하지 않을 경우 추가자금이 필요하므로 가장 꺼리는 방법이다.","현물환 매입·선물 매도의 Block Deal은 선물의 경우 만기 때마다 만기이월해야 한다.","통화옵션도 활용 가능한 상품이다.","무비용전략(옵션의 매입 + 매도)을 활용하여 다양한 합성선물 포지션을 만들어 초기자금 부담을 경감하는 방법도 있다."],"a":0,"e":"현물환 매입·선물환 매도의 FX Swap이 가장 많이 쓰는 방법이다.","ep":[4]},{"s":2,"p":24,"q":"선물 근월물의 가격이 100, 원월물의 가격이 105인 상태에서 원월물의 가격이 급격히 상승하면서 가격차이가 급격히 커졌다. 이때 투자자가 이 스프레드가 다시 좁아질 것으로 예상할 경우 바람직한 투자전략으로 옳은 것은?","o":["근월물 매수·원월물 매도","근월물 매도·원월물 매수","근월물 매수·원월물 매수","근월물 매도·원월물 매도"],"a":0,"e":"원월물이 위에 있고 근월물이 아래에 있는 상태에서 스프레드가 좁아질 것이므로, 가격이 싼 근월물을 매수하고 가격이 비싼 원월물을 매도한다.","ep":[4]},{"s":2,"p":24,"q":"행사가격이 낮은 풋옵션을 매수하고 행사가격이 높은 풋옵션을 매도하는 전략은?","o":["스트랭글 매도","풋 레이쇼 버티컬 스프레드","풋 약세 스프레드","풋 강세 스프레드"],"a":3,"e":"행사가격이 낮은 풋옵션을 매수하고 행사가격이 높은 풋옵션을 매도하는 전략은 풋 강세 스프레드이다.","ep":[4]},{"s":2,"p":24,"q":"이색옵션에 대한 설명으로 옳은 것은?","o":["낙아웃 옵션 (Knock-Out Option)은 만기 이전에 기초자산의 가격이 경계수준 (Barrier)을 건드리면 옵션이 유효화된다.","리버스 컨버터블 (Reverse Convertible)은 채권 매수에 콜옵션 매도 포지션이 첨가된다.","파생결합증권에 사용되는 옵션은 주로 장외옵션이다.","룩백 콜옵션의 경우에는 만기까지의 최고가격이 행사가격이 된다."],"a":2,"e":"파생결합증권에 사용되는 옵션은 주로 장외옵션이고, 그 중에서도 이색옵션이 대부분이다. ① 낙아웃 옵션 (Knock-Out Option)은 만기 이전에 기초자산의 가격이 미리 설정된 경계수준 (Barrier)을 건드리면 옵션이 무효가 되도록 짜여진 옵션이다. ② 리버스 컨버터블 (Reverse Convertible)은 채권 매수에 풋옵션 매도 포지션이 첨가된다. ④ 룩백 콜옵션은 만기까지의 최저가격, 룩백 풋옵션은 만기까지의 최고가격이 행사가격이 된다.","ep":[4]},{"s":2,"p":24,"q":"포트폴리오 보험전략에 대한 설명으로 옳은 것은?","o":["초과수익 추구라는 목표가 구조와 정확하게 일치하는 전략이다.","보험을 드는 것과 비슷하게 풋옵션을 매도하는 전략을 방어적 풋전략이라 한다.","채권 매수와 동시에 풋옵션 매수전략을 병행하는 것을 이자추출전략이라 한다","동적자산배분전략은 주식과 채권으로 자금을 운용함으로써 상승 가능성과 하락 위험 방어 라는 두 가지 목표를 동시에 달성하고자 하는 전략이다."],"a":3,"e":"① 포트폴리오 보험전략은 파생결합증권의 가장 기본이 되는 구조, 즉 원금회복 구조와 정확하게 일치하는 전략이다. ② 주식포트폴리오를 보유한 상태에서 보험을 드는 것과 비슷하게 풋옵션을 매입하는 전략을 방어적 풋 전략이라 한다. ③ 채권 매수와 동시에 콜옵션 매수전략을 병행하는 것을 이자추출전략이라 한다.","ep":[4]},{"s":2,"p":25,"q":"어떤 파생결합증권에서 KOSPI 지수가 10% 상승 시 수익이 5% 라면 지수 상승에 대한 참여율로 옳은 것은?","o":["0.2","0.4","0.5","0.8"],"a":2,"e":"10% 상승 시 절반인 5% 의 수익이 발생하였으므로 참여율은 0.5(50%) 이다.","ep":[5]},{"s":2,"p":25,"q":"다음 중 기초자산의 가격 하락 시 유효화되는 옵션으로 옳은 것은?","o":["다운 앤 인 (Down and In) 옵션","다운 앤 아웃 (Down and Out) 옵션","업 앤 인 (Up and In) 옵션","업 앤 아웃 (Up and Out) 옵션"],"a":0,"e":"일정 부분 이상 기초자산의 가격 하락 시, 유효화되는 옵션은 다운 앤 인 (Down and In) 옵션이다.","ep":[5]},{"s":2,"p":25,"q":"다음 중 펀드에서 파생상품의 활용에 대한 설명으로 잘못된 것은?","o":["자본시장법상 활용할 수 있는 파생상품의 기초자산 종류에는 제한이 없다.","Funded Swap은 파생 결합증권에 내재된 파생상품 부분만 따로 떼어내서 거래를 체결하는 방식을 말한다.","파생결합증권의 수익구조는 원금보존 여부, 중도상환 여부, 기초자산의 개수 등에 따라 분류되기도 한다.","통상적으로 파생상품펀드라 하면 파생결합증권을 펀드에 편입시켜 파생결합증권의 수익 구조에 따라 펀드의 수익구조가 정해지는 경우를 말한다."],"a":1,"e":"Unfunded Swap 에 대한 설명이다.","ep":[5]},{"s":2,"p":26,"q":"장외파생상품의 리스크관리에 관한 설명으로 잘못된 것은?","o":["자체헤징은 파생결합증권의 판매회사가 자체적으로 매매활동을 통한 수익구조를 창출 하는 경우이다.","BTB 거래란 동일한 수익구조를 가진 장외파생상품거래를 통해 다른 거래상대에게 위험 을 전가하는 것이다.","Funded Swap은 파생결합증권의 발행금액 대부분(현재는 액면의 99% 수준)을 거래상대 방에게 지급하고 중도상환 혹은 만기일에 원리금을 되돌려 받는 구조이다.","Unfunded Swap은 파생결합증권에 내재된 파생상품부분만 따로 떼어내서 거래를 체결 하는 방식이다."],"a":0,"e":"자체헤징은 파생결합증권의 발행사가 자체적으로 매매활동을 통한 수익구조를 창출하는 경우이다.","ep":[5]},{"s":2,"p":26,"q":"파생결합증권의 발행사가 자체헤지를 이용하여 리스크관리를 할 경우에 대한 설명으로 가장 올바른 것은?","o":["BTB 거래와 같이 자금의 유·출입이 일치한다.","거래 상대방에 대한 신용 위험은 존재하지 않는다.","헤지수단은 장내파생상품으로 한정된다.","시장 리스크의 운용결과에 따라 손익이 달라질 수 있다."],"a":3,"e":"① BTB 거래와 달리 자금 유·출입의 불일치로 인한 자금 유동성 리스크가 크다. ② 장외파생상품 이용 시에는 거래 상대방에 대한 신용 위험이 존재한다. ③ 헤지수단은 장내 및 장외파생상품 등의 제한이 없다.","ep":[5]},{"s":2,"p":26,"q":"다음 중 파생상품펀드의 기초자산 범위의 확대에 관한 설명으로 잘못된 것은?","o":["원자재 등 상품 (Commodity)의 경우 파생상품보다 현물거래의 형태로 활성화되고 있다.","자산배분형의 경우 자산배분기능이 내재되어 있는 펀드를 통하여 안정성과 함께 기초자산 의 투자수익을 추구한다.","보증 (Guarantee) 이라는 일차상품을 시장성 있는 상품으로 발전시킨 신용부도스왑 (CDS)을 필두로 신용 관련 시장의 파생상품은 폭발적으로 증가하였다.","기존의 채권 등에서만 가능했던 신용 리스크에 대한 투자가 신용 관련 파생상품을 통하여 다양한 형태로 조합되면서 투자 가능 범위를 확대시키고 있다."],"a":0,"e":"현물거래보다 파생상품의 형태로 거래가 활성화되고 있다.","ep":[5]},{"s":3,"p":27,"q":"부동산펀드의 비율요건을 충족하기 위해 펀드재산의 50%를 초과하여 투자해야 하는 대상에 해당하는 것을 모두 고른 것은?","o":["㉠, ㉡","㉠, ㉡, ㉢","㉠, ㉢, ㉣","㉠, ㉡, ㉢, ㉣"],"a":1,"e":"㉣은 특별자산펀드의 비율요건을 충족하기 위해 펀드재산의 50%를 초과하여 투자해야 하는 대상에 해당한다.","ep":[5],"data":["부동산이 펀드재산의 50% 이상을 차지하는 집합투자증권","부동산투자회사가 발행한 주식","유동화증권으로서 유동화자산 가액의 70% 이상인 유동화증권","사회기반시설사업의 시행을 목적으로 하는 법인이 발행한 주식과 채권"]},{"s":3,"p":27,"q":"부동산펀드의 상장의무에 대한 설명 중 잘못된 것은?","o":["투자신탁은 상장의무가 있다.","투자회사는 상장의무가 있다.","부동산투자유한회사는 상장의무가 있다.","사모환매금지 형부동산펀드는 상장의무가 없다."],"a":2,"e":"부동산투자유한회사는 상장의무가 없다.","ep":[5]},{"s":3,"p":27,"q":"부동산펀드가 투자할 수 있는 부동산 관련 증권과 거리가 먼 것은?","o":["부동산이 펀드재산의 50%이상을 차지하는 경우의 집합투자증권","부동산개발회사 발행 증권","주택저당채권담보부채권","선박투자회사 발행 주식"],"a":3,"e":"선박투자회사 발행 주식은 특별자산에 해당한다.","ep":[5]},{"s":3,"p":28,"q":"부동산펀드의 운용특례에 대한 설명 중 잘못된 것은?","o":["부동산펀드는 금전차입이 허용된다.","부동산펀드는 금전대여가 허용된다.","부동산펀드는 본질적 업무를 제외한 업무를 제3자에게 위탁할 수 있다.","부동산펀드가 보유하는 부동산은 원칙적으로 공정가액으로 평가해야 한다."],"a":3,"e":"부동산펀드가 보유하는 부동산은 원칙적으로 시가로 평가하고, 시가가 없는 경우에 공정가액으로 평가한다.","ep":[5]},{"s":3,"p":28,"q":"다음 중 부동산펀드의 집합투자업자가 사업계획서를 작성해야 하는 경우는?","o":["부동산개발사업에 투자하는 경우","부동산개량사업에 투자하는 경우","부동산관리사업에 투자하는 경우","부동산임대사업에 투자하는 경우"],"a":0,"e":"집합투자업자가 펀드 재산으로 부동산개발사업에 투자하고자 하는 경우에는 사업계획서를 작성해야 한다.","ep":[5]},{"s":3,"p":28,"q":"펀드의 설립국가 기준에 따른 부동산펀드의 분류로 잘못된 것은?","o":["역내펀드","해외투자펀드","Off-Shore Fund","역외펀드"],"a":1,"e":"국내투자펀드 (Domestic Investment Fund) 와 해외투자펀드 (Overseas Investment Fund)는 펀드의 투자대상지역에 따른 부동산펀드의 분류이다.","ep":[5]},{"s":3,"p":28,"q":"임대형부동산펀드의 수익 및 위험에 대한 설명으로 잘못된 것은?","o":["수익성 부동산을 매입한 후 매각을 통해 안정적인 수익을 취득하는 것이 주된 수익 모델이다.","분배금을 지급하며 매각을 통해 자본차익을 추구하는 펀드이다.","공실률과 임대료의 상승(하락) 요인을 잘 점검해 보아야 한다.","부담하는 차입금의 이자율수준이 레버리지 효과를 누리기에 적정한지 점검할 필요가 있다."],"a":0,"e":"임대형부동산펀드의 수익 모델은 임대수익과 매각 차익이지만, 임대기간동안 발생하는 임대수익의 비중이 더욱 높다.","ep":[5]},{"s":3,"p":29,"q":"경·공매형부동산펀드에 대한 설명으로 잘못된 것은?","o":["경매 또는 공매 등을 통해 주로 업무용 부동산 또는 상업용 부동산 등을 저가에 취득한다.","매각차익만을 획득하거나 또는 임대수익과 매각차익을 동시에 획득하는 것을 주된 목적 으로 한다.","펀드규모가 너무 작거나 지나치게 회전율이 높은 경우, 투자 자금은 미운용자금 (Idle Money)이 될 수 있다.","낙찰 받은 물건의 명도 및 관리 등에 많은 시간과 비용이 소요될 위험을 갖고 있다."],"a":2,"e":"펀드규모가 너무 크거나 물건을 확보하지 못하는 경우, 투자 자금은 미운용자금 (Idle Money)이 될 수 있다.","ep":[5]},{"s":3,"p":29,"q":"대출형부동산펀드에 대한 설명으로 잘못된 것은?","o":["부동산개발사업과 관련된 법인에 대한 대출이 주된 투자대상이다.","대상 부동산개발사업이 차질 없이 진행될 수 있는 것인지 확인해야 한다.","시공사의 신용평가등급으로 BB(-) 이상을 요구하고 있다.","대출에 대한 신용보강장치가 적정한지 등을 점검해야 한다."],"a":2,"e":"대출형부동산펀드는 시공사의 신용평가등급으로 투자적격등급인 BBB(-) 이상을 요구하고 있다.","ep":[5]},{"s":3,"p":29,"q":"임대형부동산펀드에 대한 점검사항으로 거리가 먼 것은?","o":["임대료","공실률","시공사의 신용수준","매입가격"],"a":2,"e":"임대형부동산펀드의 점검사항은 임대료, 공실률, 매입가격, 매각가격과 매각지연 등이고, 시공사의 신용수준은 대출형부동산펀드의 점검사항이다.","ep":[5]},{"s":3,"p":29,"q":"다음 중 자산시장에 관한 설명으로 거리가 먼 것은?","o":["대체원가 (Replacement Cost)가 시가보다 낮아서 개발이익이 발생하면 개발이 결정되는 시장이다.","자산시장의 수급에 따라서 해당 부동산시장의 시장요구 자본환원율 (Market Required Capitalization Rate) 수준이 결정된다.","시장요구 자본환원율은 자산시장의 거래지표가 될 수 있다.","자산시장의 현금흐름과 시장요구 자본환원율을 알면 부동산의 시장가격을 추정할 수 있다."],"a":0,"e":"대체원가가 시가보다 낮아서 개발이익이 발생하면 개발이 결정되는 시장은 개발시장이다.","ep":[5]},{"s":3,"p":30,"q":"부동산시장 실패로 인한 정부의 개입 근거로 올바른 것으로만 모두 묶인 것은?","o":["㉠, ㉡, ㉢","㉠, ㉣, ㉤","㉡, ㉢, ㉣","㉡, ㉣, ㉤"],"a":2,"e":"시장실패의 원인으로는 불완전경쟁시장, 독과점, 외부효과, 정보의 비대칭성, 상품의 개별성 등이 있다.","ep":[5],"data":["완전경쟁시장","독과점","정보의 비대칭성","외부효과","상품의 동질성"]},{"s":3,"p":30,"q":"거시경제변수와 부동산의 관계에 대한 설명으로 옳은 것은? (단, 다른 변수는 일정)","o":["경제성장률이 상승하면 임대료가 상승한다.","금리가 상승하면 부동산가격도 상승한다.","통화량이 증가하면 물가가 하락하고 부동산가격도 하락한다.","부동산가격은 주가에 선행한다."],"a":0,"e":"② 금리가 상승하면 부동산가격이 하락한다. ③ 통화량이 증가하면 물가가 상승하고 부동산가격도 상승한다. ④ 부동산가격은 주가에 후행하며, 주가가 상승하면 부동산가격이 상승하는 경향이 있다.","ep":[5]},{"s":3,"p":30,"q":"대안투자(부동산투자)의 특성에 대한 설명으로 잘못된 것은?","o":["투자대상으로 짧은 역사를 가졌다.","전통적인 투자에 비하여 유동성이 낮다.","전통적인 자산보다환금성이 낮기 때문에 비용이 저렴하다.","전통적인 투자자산과의 상관관계가 낮다."],"a":2,"e":"대안투자는 높은 수수료를 지불한다.","ep":[5]},{"s":3,"p":30,"q":"경기수준이나 인플레이션으로 인한 부동산 또는 부동산 관련 유가증권의 가격변동 위험 을 관리하는 방법으로 활용되는 방안인 것은?","o":["파생금융상품","각종 사전옵션계약","풋백옵션","장기운용계약"],"a":0,"e":"가격 변동 위험을 관리하기 위하여 파생금융상품을 활용한다.","ep":[5]}];const SUBJECTS={"1":"펀드일반","2":"파생상품펀드","3":"부동산펀드"};
const S='fund-hackers-practice-02-v1',circ=['①','②','③','④'];
let A=Array(Q.length).fill(null),filter=0,wrong=false,unanswered=false,allExp=false,summaryOpen=false;
try{const saved=JSON.parse(localStorage.getItem(S)||'null');if(Array.isArray(saved))A=Q.map((_,i)=>Number.isInteger(saved[i])&&saved[i]>=0&&saved[i]<4?saved[i]:null)}catch(e){document.getElementById('storageStatus').textContent='저장된 기록을 읽지 못해 새 풀이를 시작합니다.'}
function save(){try{localStorage.setItem(S,JSON.stringify(A));document.getElementById('storageStatus').textContent=''}catch(e){document.getElementById('storageStatus').textContent='현재 브라우저에서 자동저장이 제한되어 있습니다. 이 창에서는 계속 풀 수 있습니다.'}}
function esc(text){return String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function questionText(text){
 const lines=text.split('\n');
 const bulletIndex=lines.findIndex(line=>line.trimStart().startsWith('•'));
 if(bulletIndex<0)return esc(text);
 return esc(lines.slice(0,bulletIndex).join('\n'))+`<span class="question-bullets">${esc(lines.slice(bulletIndex).join('\n'))}</span>`;
}
function context(q){
 if(q.data)return `<div class="question-data">${q.data.map((item,i)=>`<p>${'㉠㉡㉢㉣㉤㉥㉦'[i]} ${esc(item)}</p>`).join('')}</div>`;
 if(q.table){const [headers,values]=q.table;return `<div class="table-scroll question-table"><table aria-label="A펀드 성과지표"><tbody>${headers.map((x,i)=>`<tr><th scope="row">${esc(x)}</th><td>${esc(values[i])}</td></tr>`).join('')}</tbody></table></div>`}
 return '';
}
function explanation(q){
 const excerpt=q.image?`<img class="exp-image" loading="lazy" src="${esc(q.image)}" alt="절대적 위험과 상대적 위험의 측정 지표를 비교한 원본 표">`:'';
 return `<span class="exp-text">${esc(q.e)}</span>${excerpt}<br><span class="source">정답·해설 PDF ${q.ep.join('·')}쪽</span>`;
}
function render(){let shown=0;document.getElementById('questions').innerHTML=Q.map((q,i)=>{if(filter&&q.s!==filter)return '';const a=A[i],done=a!==null,ok=a===q.a;if(wrong&&(!done||ok))return '';if(unanswered&&done)return '';shown++;return `<article class="qcard ${done?'answered':''} ${done&&!ok?'wrong-answer':''}" id="q${i+1}"><div class="meta"><span>제${q.s}과목 · ${SUBJECTS[q.s]}</span><span>문제 PDF ${q.p}쪽</span></div><div class="q">Q${i+1}. ${questionText(q.q)}</div>${context(q)}<div class="opts">${q.o.map((x,j)=>`<button class="opt ${done&&j===q.a?'ok':''} ${done&&j===a&&!ok?'bad':''}" aria-pressed="${a===j}" onclick="pick(${i},${j})">${circ[j]} ${esc(x)}</button>`).join('')}</div><div class="exp ${done||allExp?'show':''}"><b>${done?(ok?'정답입니다.':'오답입니다.')+' ':''}정답 ${circ[q.a]} | 해설</b><br>${explanation(q)}</div></article>`}).join('')||'<div class="empty">해당 조건의 문제가 없습니다.</div>';document.getElementById('countline').textContent=`현재 ${shown}문항 표시 · ${filter?SUBJECTS[filter]:'전체 과목'}${wrong?' · 응답한 오답만':''}${unanswered?' · 미응답만':''}`;document.querySelectorAll('.filter').forEach((b,i)=>b.setAttribute('aria-pressed',String(filter===i)));document.getElementById('wrongbtn').setAttribute('aria-pressed',String(wrong));document.getElementById('unansweredbtn').setAttribute('aria-pressed',String(unanswered));document.getElementById('expbtn').setAttribute('aria-pressed',String(allExp));document.getElementById('expbtn').textContent=allExp?'해설 전체 접기':'해설 전체 펼치기';progress();if(summaryOpen)updateSummary()}
function pick(i,j){const x=window.scrollX,y=window.scrollY;A[i]=j;save();const c=document.getElementById('q'+(i+1)),q=Q[i];if(c){c.classList.add('answered');c.classList.toggle('wrong-answer',j!==q.a);c.querySelectorAll('.opt').forEach((b,n)=>{b.classList.toggle('ok',n===q.a);b.classList.toggle('bad',n===j&&j!==q.a);b.setAttribute('aria-pressed',String(n===j))});const e=c.querySelector('.exp');e.classList.add('show');e.innerHTML=`<b>${j===q.a?'✓ 정답입니다.':'✕ 오답입니다.'} 정답 ${circ[q.a]} | 해설</b><br>${explanation(q)}`;progress();if(summaryOpen)updateSummary()}else render();if(window.scrollY!==y)window.scrollTo({left:x,top:y,behavior:'instant'});requestAnimationFrame(()=>{if(window.scrollY!==y)window.scrollTo({left:x,top:y,behavior:'instant'})})}
function progress(){[0,1,2,3].forEach(s=>{const idx=Q.map((q,i)=>i).filter(i=>!s||Q[i].s===s);const done=idx.filter(i=>A[i]!==null).length,ok=idx.filter(i=>A[i]===Q[i].a).length;document.getElementById('t'+s).textContent=`${done}/${idx.length} · 정답 ${ok}`;document.getElementById('b'+s).style.width=done/idx.length*100+'%';document.getElementById('progress'+s).setAttribute('aria-valuenow',String(Math.round(done/idx.length*100)))})}
function setf(s){filter=s;render()}
function toggleWrong(){wrong=!wrong;unanswered=false;render()}
function toggleUnanswered(){unanswered=!unanswered;wrong=false;render()}
function toggleExp(){allExp=!allExp;render()}
function updateSummary(){let rows='';[0,1,2,3].forEach(s=>{const idx=Q.map((q,i)=>i).filter(i=>!s||Q[i].s===s),done=idx.filter(i=>A[i]!==null).length,ok=idx.filter(i=>A[i]===Q[i].a).length;rows+=`<tr><th>${s?SUBJECTS[s]:'전체'}</th><td>${ok}/${idx.length}</td><td>${done-ok}</td><td>${idx.length-done}</td><td>${done?(ok/done*100).toFixed(1)+'%':'—'}</td></tr>`});document.getElementById('summary').innerHTML=`<h2>채점 요약 · 총 ${Q.filter((q,i)=>A[i]===q.a).length}/100점</h2><div class="table-scroll"><table><thead><tr><th>과목</th><th>정답/전체</th><th>오답</th><th>미응답</th><th>응답 정답률</th></tr></thead><tbody>${rows}</tbody></table></div><p class="meta">각 1점 · 미응답은 총점에 가산하지 않습니다. 학습용 점수이며 공식 합격판정이 아닙니다.</p>`}
function grade(){summaryOpen=true;updateSummary();const el=document.getElementById('summary');el.hidden=false;el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}
function resetAll(){if(!confirm('100문항의 풀이기록을 모두 초기화할까요?'))return;A=Array(Q.length).fill(null);wrong=false;unanswered=false;allExp=false;summaryOpen=false;document.getElementById('summary').hidden=true;save();render()}
window.addEventListener('beforeprint',()=>{window._printState={filter,wrong,unanswered,allExp};filter=0;wrong=false;unanswered=false;allExp=true;render()});window.addEventListener('afterprint',()=>{if(!window._printState)return;({filter,wrong,unanswered,allExp}=window._printState);delete window._printState;render()});
render();
</script><script>
const requestedSubject=Number(new URLSearchParams(location.search).get('subject'));
if(Number.isInteger(requestedSubject)&&requestedSubject>=0&&requestedSubject<=3)setf(requestedSubject);
</script><script>(function(){var b=document.getElementById('study-theme-toggle');if(!b)return;function sync(){var d=document.documentElement.dataset.theme==='dark';b.textContent=d?'라이트모드':'다크모드';b.setAttribute('aria-pressed',String(d))}b.addEventListener('click',function(){var t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('fund-study-theme-v1',t)}catch(e){}sync()});sync()})()</script></body></html>
