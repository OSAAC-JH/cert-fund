<div class="controls" aria-label="문제 필터"><button type="button" class="study-theme-toggle" id="study-theme-toggle" aria-pressed="false">다크모드</button><button class="btn filter" id="filter0" aria-pressed="true" onclick="setf(0)">전체</button><button class="btn filter" id="filter1" aria-pressed="false" onclick="setf(1)">제1과목 · 펀드일반</button><button class="btn filter" id="filter2" aria-pressed="false" onclick="setf(2)">제2과목 · 파생상품펀드</button><button class="btn filter" id="filter3" aria-pressed="false" onclick="setf(3)">제3과목 · 부동산펀드</button><button class="btn" id="wrongbtn" aria-pressed="false" onclick="toggleWrong()">오답만 보기</button><button class="btn" id="unansweredbtn" aria-pressed="false" onclick="toggleUnanswered()">미응답만 보기</button><button class="btn" id="expbtn" aria-pressed="false" onclick="toggleExp()">해설 전체 펼치기</button><button class="btn" onclick="grade()">채점 요약</button><button class="btn" onclick="resetAll()">기록 초기화</button></div><div class="countline" id="countline" aria-live="polite"></div><div class="status" id="storageStatus" role="status"></div><section class="summary" id="summary" hidden tabindex="-1" aria-label="채점 결과"></section></section><main class="wrap"><div id="questions"></div><footer>문제 및 해설의 쪽수는 각 원본 PDF 기준입니다.<br>진행기록은 이 브라우저에 저장됩니다. 파일을 다른 브라우저나 경로에서 열면 기록이 별도로 관리될 수 있습니다.</footer></main><script>const Q=[{"s":1,"p":1,"q":"다음 중 자본시장법상 집합투자의 요건과 거리가 먼 것은?","o":["1인 이상의 자에게 판매되어야 한다.","투자자로부터 일상적인 운용지시를 받지 않아야 한다.","투자자의 운용관여는 총회를 통한 간접적인 관여만 허용된다.","재산적 가치가 있는 자산을 취득, 처분 그 밖의 방법으로 운용해야 한다."],"a":0,"e":"집합투자가 되려면 2인 이상의 자에게 판매되어야 한다.","ep":[1]},{"s":1,"p":1,"q":"집합투자기구의 형태 중 투자회사에 대한 설명과 거리가 먼 것은?","o":["수익증권을 발행하는 형태이다.","서류상의 회사 (Paper Company)로서 투자업무 외의 업무를 할 수 없다.","본점 외의 영업소를 설치할 수 없다.","직원 및 상근임원을 채용할 수 없다."],"a":0,"e":"투자회사는 주권을 발행하는 형태이고, 투자신탁은 수익증권을 발행하는 형태이다.","ep":[1]},{"s":1,"p":1,"q":"다음 중 투자신탁의 기관인 수익자총회에 대한 설명이 잘못된 것은?","o":["자본시장법에서 정한 사항은 출석자 과반수와 총좌수 1/4 이상의 찬성으로 의결할 수 있다.","신탁계약에서 정한 사항은 출석자 과반수와 총좌수 1/5 이상의 찬성으로 의결할 수 있다.","수익자총회의 소집권자는 원칙적으로 수익자이다.","반대수익자의 수익증권 매수청구권 인정범위는 신탁계약 변경, 합병결의에 한한다."],"a":2,"e":"수익자총회의 소집권자는 원칙적으로 집합투자업자이나, 신탁업자, 수익증권의 5%이상 보유 수익자도 집합투자업자에게 총회소집 요구를 할 수 있다.","ep":[1]},{"s":1,"p":2,"q":"집합투자증권의 거래가격에 대한 설명 중 잘못된 것은?","o":["투자매매업자 또는 투자중개업자가 집합투자증권을 판매하는 경우 그 가격은 금전 등을 납입한 후 최초로 산정되는 기준가격(미래가격)으로 판매해야 한다.","외국환평형기금에게 단기금융집합투자기구의 펀드를 판매하는 경우 판매가격은 금전 등의 납입일에 공고된 기준가격으로 한다.","투자자가 금융투자상품 매수에 따른 결제대금을 지급하기 위하여 MMF를 환매하기로 증권사와 미리 약정한 경우 환매가격은 환매청구일에 공고되는 기준가격으로 한다.","장 마감 후 거래는 금전 등의 납입일에 공고된 기준가격으로 한다."],"a":3,"e":"장 마감 후 거래는 불법적인 거래이므로 매수 또는 환매의 기준시점 이후에 매입 또는 환매를 청구한 투자자에게 적용되는 기준가격은 기준시점 이전에 매입 또는 환매하는 경우에 적용되는 기준가격 다음에 산출되는 기준가격을 적용해야 한다.","ep":[1]},{"s":1,"p":2,"q":"금융소비자보호법상 금융투자업자의 상품판매와 관련한 투자성 상품에 해당하지 않는 것은?","o":["금융투자상품","투자일임계약","신탁계약(관리형신탁 및 투자성 없는 신탁은 제외)","연계투자 (P2P 투자)"],"a":3,"e":"연계투자(P2P투자)는 「온라인투자연계금융업 및 이용자보호에 관한 법률」에 따른 것으로 온라인플랫폼을 통하여 투자자의 자금을 투자자가 지정한 해당 차입자에게 대출 등의 방법으로 자금을 공급하고 그에 따른 원리금수취권을 투자자에게 제공하는 것이다.","ep":[1]},{"s":1,"p":2,"q":"다음 중 자본시장법이 금지하는 불건전 영업행위와 거리가 먼 것은?","o":["투자권유의 요청을 받지 않은 증권과 장내파생상품에 대한 투자권유행위","일반투자자를 상대로 하는 차별적인 판매촉진노력","수익률 보장 또는 손실보전 행위","투자자로부터 집합투자증권을 매수·중개·주선·대리하는 행위"],"a":0,"e":"요청받지 않은 투자권유행위는 원칙적으로 금지되지만 증권과 장내파생상품에 대한 투자권유행위는 가능하다.","ep":[1]},{"s":1,"p":3,"q":"다음 중 집합투자증권의 환매에 대한 설명이 잘못된 것은?","o":["투자자는 언제든지 판매사(투자매매·중개업자)에 집합투자증권의 환매를 청구할 수 있다.","판매사가 환매에 응할 수 없는 경우 집합투자업자, 신탁업자에게 청구할 수 있다.","집합투자자 전원의 동의를 얻으면 집합투자재산으로 환매대금을 지급할 수 있다.","환매수수료는 집합투자증권 평가잔액을 기준으로 부과하며, 징수한 환매수수료는 판매사 에 귀속된다."],"a":3,"e":"환매수수료는 환매금액 또는 이익금을 기준으로 부과하며, 징수한 환매수수료는 당해 집합투자재산에 귀속된다.","ep":[1]},{"s":1,"p":3,"q":"다음 중 집합투자증권의 가격결정 기준에 대한 설명이 잘못된 것은?","o":["집합투자증권의 가격결정은 원칙적으로 미래가격을 기준으로 한다.","판매가격과 환매가격은 순자산가치에 비하여 할인 또는 할증된다.","결제대금으로 결제일에 MMF를 매수하기로 약정하거나, 급여 등 정기적 금전 수취일에 MMF를 매수하기로 약정한 경우에는 예외적으로 과거가격을 기준으로 한다.","장 마감 후 거래는 기준시점 이전에 적용되는 기준가격 다음에 산출되는 기준가격을 적용한다."],"a":1,"e":"집합투자증권의 판매가격과 환매가격은 매수청구 또는 환매청구를 받은 이후에 최초로 산출되는 순자산가치(미래가격)를 기준으로 하며, 순자산가치 대비 할인 또는 할증이 금지된다.","ep":[1]},{"s":1,"p":3,"q":"다음 중 투자신탁 자산의 운용에 대한 설명이 잘못된 것은?","o":["투자신탁의 집합투자업자는 신탁업자에 대하여 투자대상자산의 취득·처분 등에 관하여 필요한 지시를 한다.","신탁업자는 집합투자업자의 지시에 따라 투자대상자산의 취득·처분 등을 하여야 한다.","투자신탁은 신탁업자의 명의로만 투자대상자산을 취득·처분할 수 있다.","회사형 집합투자기구의 경우 집합투자업자는 집합투자기구 명의로 투자대상자산을 취득·처분하고, 신탁업자는 집합투자업자의 지시에 따라야 한다."],"a":2,"e":"투자신탁재산의 효율적 운용을 위하여 불가피한 경우 집합투자업자 자신의 명의로 직접 투자대상자산을 취득·처분할 수도 있다.","ep":[1]},{"s":1,"p":4,"q":"집합투자증권의 환매에 대한 설명이 잘못된 것은?","o":["투자자는 언제든지 투자매매업자 또는 투자중개업자에게 집합투자증권의 환매를 청구할 수 있다.","환매대금은 금전으로만 지급할 수 있다.","투자매매업자·투자중개업자, 집합투자업자, 신탁업자는 환매대상 집합투자증권을 자기의 계산으로 취득하거나 타인에게 취득하게 할 수 없다.","환매수수료는 환매금액 또는 이익금을 기준으로 부과하며, 징수한 환매수수료는 당해 집합투자재산에 귀속된다."],"a":1,"e":"환매대금은 금전으로 지급하는 것이 원칙이나, 집합투자자 전원의 동의를 얻은 경우 집합투자재산으로 지급할 수 있다.","ep":[1]},{"s":1,"p":4,"q":"집합투자업자의 영업행위준칙에 대한 설명이 잘못된 것은?","o":["전자단기사채 매매의 경우 투자신탁의 집합투자업자가 직접 해당 자산을 취득, 매각할 수 있다.","시가총액비중이 10%를 넘는 지분증권에 대하여는 그 시가총액비중까지 투자할 수 있다.","집합투자재산으로 해당 집합투자기구 이외의 자를 위하여 채무보증이나 담보제공을 할 수 없다.","집합투자업자는 어떠한 경우에도 성과보수를 받을 수 없다."],"a":3,"e":"집합투자업자는 원칙적으로 성과보수를 받을 수 없다. 다만, 사모집합투자기구인 경우와 공모집합투자기구라도 투자자보호 및 거래질서를 저해하지 않는 경우로서 일정한 요건을 충족하는 경우에는 예외적으로 성과보수를 받을 수 있다.","ep":[1]},{"s":1,"p":4,"q":"ETF 운용규제의 특례에 대한 설명이 잘못된 것은?","o":["ETF는 자산총액의 30%까지 동일종목의 증권에 운용할 수 있다.","각 ETF에서 동일법인 등이 발행한 지분증권 총수의 20%까지 투자할 수 있다.","투자자보호 차원에서 ETF 설정 목적으로 이해관계인과 거래하는 것은 금지된다.","ETF는 자본시장법 규정 중 집합투자증권 환매, 계열사 발행주식에 대한 중립투표 의무, 자산운용보고서, 내부자의 단기매매차익 반환의무, 임원 등의 특정증권 소유상황보고 등 에 관한 규정이 적용되지 않는다."],"a":2,"e":"이해관계인과의 거래제한규정에도 불구하고 ETF 설정 목적으로 이해관계인과의 거래를 할 수 있다.","ep":[2]},{"s":1,"p":5,"q":"금융상품판매대리·중개업자에 대한 금지행위에 해당하는 것은?","o":["㉡, ㉢, ㉤","㉠, ㉡, ㉢, ㉤, ㉦","㉡, ㉢, ㉣, ㉤, ㉥, ㉦","㉠, ㉡, ㉢, ㉣, ㉤, ㉥, ㉦"],"a":3,"e":"㉠~㉦은 모두 금융상품판매대리·중개업자에 대한 금지행위에 해당한다.","ep":[2],"data":["금융소비자로부터 투자금, 보험료 등 계약의 이행으로서 급부를 받는 행위","금융상품판매대리·중개업자가 대리·중개하는 업무를 제3자에게 하게 하거나 그러한 행위에 관하여 수수료·보수나 그 밖의 대가를 지급하는 행위","금융상품직접판매업자로부터 정해진 수수료 외의 금품, 그 밖의 재산상 이익을 요구하거나 받는 행위","금융상품직접판매업자를 대신하여 계약을 체결하는 행위","투자일임재산이나 신탁재산을 모아서 운용하는 것처럼 투자일임계약이나 신탁계약의 계약체결 등을 대리·중개하거나 광고하는 행위","금융소비자로부터 금융투자상품을 매매할 수 있는 권한을 위임받는 행위","투자성 상품에 관한 계약체결과 관련하여 제3자가 금융소비자에게 금전을 대여하도록 대리·중개하는 행위"]},{"s":1,"p":5,"q":"다음 중 직무윤리의 필요성 및 배경에 대한 설명이 잘못된 것은?","o":["전통적 윤리규범이 공공재적 성격을 띠게 되었다.","신용이 무형의 자본으로 인정되고 있다.","금융투자산업은 이해상충 가능성이 높다.","자본시장에서는 정보비대칭 문제가 사라졌다."],"a":3,"e":"금융투자상품이 전문화, 다양화되고 복잡한 첨단금융상품이 나오면서 정보비대칭 문제가 발생하였으며, 이로 인해 금융투자업종사자에게는 직무윤리의 필요성이 더욱 강조된다.","ep":[2]},{"s":1,"p":5,"q":"다음은 금융투자업종사자의 어떤 의무와 가장 관계가 깊은가?\n• 고객의 재산을 이용한 자기 또는 제3자의 이익 도모 금지\n• 자신이 수익자의 거래 상대방이 될 수 없음\n• 직무를 통해 알게 된 고객의 정보에 대한 비밀유지의무\n• 고객의 이익과 경합하거나 상충하는 행위 금지","o":["충실의무","주의의무","설명의무","주지의무"],"a":0,"e":"충실의무에 대한 내용이다.","ep":[2]},{"s":1,"p":6,"q":"다음 중 금융투자회사의 직무윤리 관련 법령 및 표준윤리준칙에 근거한 내용이 가장 적절하지 않은 것은?","o":["금융투자업 직무윤리의 기본원칙은 고객우선의 원칙과 신의성실의 원칙이다.","금융소비자는 본인의 투자금액 이외의 판매수수료, 해지수수료 등 추가적인 비용을 금융 투자회사에게 지불해야 한다.","금융투자상품은 금융소비자가 일정한 대가를 바라고 지불한 금액보다 기대했던 대가가 적어질 수 있는 위험성을 내포한 상품이다.","금융소비자보호법은 금융소비자보호의 대상을 투자성 있는 금융투자상품으로 보고 있다."],"a":3,"e":"자본시장법은 금융소비자의 보호대상을 금융투자상품으로 정의하고 있으나, 금융소비자보호법은 금융소비자의 보호대상을 ‘금융상품’으로 정의하여 투자성 있는 금융투자상품뿐만 아니라 예금성상품, 대출성상품, 보험성상품까지 그 범위를 확대 적용하고 있다.","ep":[2]},{"s":1,"p":6,"q":"다음은 무엇을 설명하는 내용인가?\n• 투자권유 전 당해 고객이 투자권유를 원하는지 여부를 확인해야 함\n• 투자자가 일반금융소비자인지 전문금융소비자인지 여부를 확인해야 함\n• 투자권유 전 면담·질문 등을 통하여 일반금융소비자의 투자목적·재산상황 및 투자경험 등의 정보를 파악해야 함\n• 일반금융소비자로부터 서명, 기명날인, 녹취, 전자통신, 우편, 전화자동응답시스템 등으로 확인을 받아 이를 유지·관리해야 함\n• 확인받은 내용을 금융소비자에게 지체 없이 제공해야 함","o":["Know-Your-Customer-Rule","Prudent Investor Rule","Chinese Wall Policy","Unsolicited Call"],"a":0,"e":"Know—Your—Customer—Rule (고객알기의무)에 대한 내용이다.","ep":[2]},{"s":1,"p":6,"q":"다음 중 금융소비자보호법상 내부통제조직에 대한 기술이 적절하지 않은 것은?","o":["이사회는 내부통제에 영향을 미치는 경영전략 및 정책을 승인한다.","금융회사는 금융소비자보호 내부통제기준에 따라 금융소비자보호 총괄책임자 (CCO)를 지 정해야 하며, CCO는 대표이사 직속의 독립적인 지위를 갖는다.","금융소비자보호 총괄기관은 금융상품 개발 및 판매업무로부터 독립하여 업무를 수행해야 하고, 대표이사 직속기관으로 두어야 한다.","금융소비자 내부통제위원회는 설치가 의무화 되어 있고, 준법감시인을 의장으로 한다."],"a":3,"e":"금융소비자 내부통제위원회는 설치가 의무화 되어 있고, 대표이사를 의장으로 한다.","ep":[2]},{"s":1,"p":7,"q":"직무윤리의 구체적 내용에 대한 설명 중 잘못된 것은?","o":["금융투자업종사자의 고객에 대한 투자정보 제공 및 투자권유는 그에 앞서 정밀한 조사·분석에 의한 자료에 기하여 합리적이고 충분한 근거에 기초하여야 한다.","투자정보를 제시할 때에는 사실과 의견을 명확히 구별하여야 한다.","중요한 사실에 대해서는 모두 정확하게 표시하여야 한다.","자본시장법 시행으로 운용방법에 따라 투자성과를 보장하는 상품이 가능해졌다."],"a":3,"e":"고객에 대하여 투자권유와 투자관리 등의 서비스를 제공함에 있어서 이익을 확실하게 보장하는 듯한 표현을 사용해서는 안 된다. 자본시장법에서는 금융투자업자가 금융상품의 매매, 그 밖의 거래와 관련하여 투자자가 입을 손실의 전부 또는 일부를 보전하여 줄 것을 사전에 약속하는 행위, 투자자가 입은 손실의 전부 또는 일부를 사후에 보전하여 주는 행위, 투자자에게 일정한 이익을 보장할 것을 사전에 약속 하는 행위, 투자자에게 일정한 이익을 사후에 제공 하는 행위를 금지하고 있다.","ep":[2]},{"s":1,"p":7,"q":"금융투자업자의 성과보수 및 수수료 제한에 대한 설명 중 잘못된 것은?","o":["고객으로부터 성과보수를 받기로 하는 약정을 체결하거나 그에 의한 성과보수 수령은 금지된다.","투자자문업자 또는 투자일임업자는 계약으로 정한 수수료 외의 대가를 추가로 받는 행위가 허용된다.","금융투자업자는 수수료 부과기준과 절차에 관한 사항을 금융투자협회에 통보하여야 한다.","금융투자협회는 금융투자업자별로 수수료를 비교하여 공시하여야 한다."],"a":1,"e":"투자자문업자 또는 투자일임업자는 계약으로 정한 수수료 외의 대가를 추가로 받는 행위는 금지된다.","ep":[2]},{"s":1,"p":7,"q":"내부통제기준 위반행위 발견 시 처리절차에 대한 설명 중 잘못된 것은?","o":["준법감시부서 직원 중 조사원을 임명하여 임무를 부여한다.","범죄와 연루되었을 가능성이 있는 경우 감독·사법당국에 통보 및 고발을 검토한다.","금융당국이 회사의 주요 내부정보를 요구하는 경우에는 준법감시인에게 보고하지 않아 도 된다.","필요한 경우 변호사 및 회계사에게 자문을 의뢰한다."],"a":2,"e":"금융당국이나 금융투자협회가 회사의 주요 내부정보를 요구하는 경우에 임직원은 상위 결재권자 및 준법감시인에게 그 사실을 지체 없이 보고해야 한다.","ep":[2]},{"s":1,"p":8,"q":"금융위원회의 금융투자업자에 대한 제재권의 내용과 거리가 먼 것은?","o":["회원의 제명권","조치명령권","승인권","금융업등록 취소권"],"a":0,"e":"회원의 제명권은 금융투자협회의 제재내용이다.","ep":[2]},{"s":1,"p":8,"q":"내부고발제도에 대한 설명 중 잘못된 것은?","o":["준법감시인은 내부고발제도를운영할수 있으며, 이에 필요한 세부운영지침을 정할수 있다.","내부고발자가 인사상 불이익을 받은 것으로 인정되는 경우 준법감시인은 회사에 시정을 요구할 수 있다.","②의 경우 회사는 정당한 사유가 없는 한 이에 응하여야 한다.","준법감시인은 내부고발자에 대하여 본인이 원하든 원치 않든 인사상 또는 금전적 혜택을 부여하도록 회사에 요청할 수 있다."],"a":3,"e":"준법감시인은 내부고발자 또는 내부통제우수자를 선정하여 인사상 또는 금전적 혜택을 부여하도록 회사에 요청할 수 있다. 그러나 내부고발자가 이를 원하지 않는 경우에는 그러하지 아니한다.","ep":[2]},{"s":1,"p":8,"q":"직무윤리 위반으로 인하여 민사책임을 질 경우에 대한 설명 중 잘못된 것은?","o":["법률행위에 중대한 하자가 있는 경우에는 무효가 된다.","법률행위에 가벼운 하자가 있는 경우에는 취소할 수 있는 행위가 된다.","계약당사자 일방의 채무불이행으로 인하여 계약목적을 달성할 수 없는 경우, 그것이 일시 적인 거래이면 계약을 해제할 수 있다.","계약을 해제하면 해제 시점부터 계약이 실효된다."],"a":3,"e":"계약을 해제하면 계약이 소급적으로 실효되어 원상회복의무가 발생하고, 계약을 해지하면 해지 시점부터 계약이 실효된다.","ep":[2]},{"s":1,"p":9,"q":"개인정보보호에 대한 설명 중 잘못된 것은?","o":["개인정보의 처리 방법 및 종류 등에 따라 정보주체의 권리가 침해받을 가능성과 그 위험 정도를 고려하여 개인정보를 안전하게 관리해야 한다.","개인정보의 보유 기간이 경과하더라도 이를 파기하는 것은 금지된다.","개인정보처리자가 정보주체의 동의를 받아 제3자에게 개인정보를 제공하는 경우, 개인 정보를 제공받는 자의 개인정보 보유 및 이용 기간에 대하여 정보주체에게 알려야 한다.","개인정보처리자의 정당한 이익을 달성하기 위해 필요한 경우로서 명백하게 정보주체의 권리보다 우선하는 경우, 개인정보처리자는 개인정보를 수집할 수 있으며 그 수집 목적의 범위 내에서 이용할 수 있다."],"a":1,"e":"보유 기간이 경과하거나 처리목적이 달성되는 등 개인정보가 불필요하게 된 경우에는 다른 법령에 따른 보존의무가 없는 경우를 제외하고 지체 없이 개인정보를 파기해야 하며, 개인정보의 처리를 위탁한 경우에는 수탁자가 안전하게 개인정보를 관리하도록 문서를 작성하고, 해당 업무를 초과한 이용이나 제3자 제공은 금지해야 한다.","ep":[2]},{"s":1,"p":9,"q":"영업점에 대한 준법감시통제와 관련하여 단일영업관리자가 2 이상의 영업점 영업관리자 업무를 수행할 수 있는 요건과 거리가 먼 것은?","o":["감독대상 영업직원 수, 영업규모와 내용 및 점포의 지역적 분포가 단일영업관리자만으로 감시·감독하는 데 특별한 어려움이 없을 것","해당 영업관리자가 대상 영업점 중 1 개의 영업점에 상근하고 있을 것","해당 영업관리자가 수행할 업무의 양과 질이 감독업무 수행에 지장을 주지 않을 것","해당 영업관리자가 준법감시업무 이외의 업무를 겸직하지 않을 것"],"a":3,"e":"해당 영업관리자가 준법감시 업무 이외의 업무를 겸직하지 않을 것까지 요건으로 하는 것은 아니다.","ep":[2]},{"s":1,"p":9,"q":"자금세탁절차 중 불법재산을 덜 의심스런 형태로 변형하여 금융회사에 유입시키거나 국외로 이송시키는 단계로 옳은 것은?","o":["예치단계","은폐단계","합법화단계","적법화단계"],"a":0,"e":"예치단계는 불법재산을 덜 의심스런 형태로 변형하여 금융회사에 유입시키거나 국외로 이송시키는 단계, 은폐단계는 복잡한 금융거래를 거쳐 자금추적을 불가능하게 만드는 단계, 합법화단계는 충분한 반복 단계를 거쳐 자금출처 추적이 불가능하게 된 불법자금을 정상적인 경제활동에 재투입하는 단계를 말한다.","ep":[2]},{"s":1,"p":10,"q":"다음 중 STR (의심거래보고제도)에 대한 설명이 잘못된 것은?","o":["1 거래일 동안 2 천만원 이상의 현금을 입금하거나 출금한 경우 적용한다.","금융회사종사자의 업무지식, 전문성, 경험 등을 바탕으로 의심되는 거래정황을 고려하여 판단한다.","불법적 인 차명거래도 보고대상이 된다.","정확도가 높다는 장점이 있으나 참고유형의 제시가 곤란하다는 단점이 있다."],"a":0,"e":"STR은 금액 제한이 없다.","ep":[2]},{"s":1,"p":10,"q":"수익증권의 인출 및 해지에 대한 설명이 잘못된 것은?","o":["환매가 제한되어 있지 않더라도 3개월 이내에 환매하는 것은 금지된다.","저축자가 수익증권현물을 요구하는 경우 판매회사는 특별한 사유가 없는 한 수익증권 현물로 지급해야 한다.","판매회사는 정액적립식 저축자가 계속하여 6개월 이상 저축금을 납입하지 않는 경우 저축 계약을 해지할 수 있다.","판매회사는 저축자가 저축금을 납입하지 않는 경우 14일 이상의 기간을 부여하여 저축금 의 추가납입을 요구할 수 있다."],"a":0,"e":"환매가 제한되어 있지 않는 한 언제든지 수익증권의 전부 또는 일부를 인출할 수 있다.","ep":[2]},{"s":1,"p":10,"q":"A 펀드의 매수 기준가격이 1,138.25인 경우 1 천만원으로 매수 가능한 좌수는? (원 미만 절상)","o":["8,685,417좌","8,785,417좌","8,885,417좌","8,985,417좌"],"a":1,"e":"매수좌수 = 저축금액 ÷ (매수 시 기준가격 ÷ 1,000)\n= 10,000,000 ÷ (1,138.25 ÷ 1,000) ≈ 8,785,416.21좌\n문제의 절상 조건을 적용하면 8,785,417좌이다.","ep":[2]},{"s":1,"p":11,"q":"수익증권저축에 대한 설명으로 잘못된 것은?","o":["수익증권저축제도는 수익증권현물의 양수도에 따른 업무의 번거로움이 가장 큰 단점이다.","수익증권저축은 판매회사가 저축자로부터 저축금을 받아 그 자금으로 수익증권을 매입하 고 보관·관리함으로써 저축자의 편익을 도모함을 목적으로 한다.","저축자의 저축가입신청과 수익증권저축통장 교부로 성립하는 혼장임치계약이다.","수익증권저축의 종류는 크게 임의식과 목적식으로 구분된다."],"a":0,"e":"수익증권저축제도는 수익증권현물의 양수도에 따른 업무의 번거로움·현물 보관관리에 따른 불편·현물 분실·훼손교부 시 절차의 복잡 등 수익증권현물거래의 불편함을 해소하고 고객과 판매사 간 거래 관계를 직접적으로 규율하는 수익증권저축약관을 제정·시행함으로써 투자신탁상품의 고유한 특성을 유지하면서 타 금융기관의 저축제도에 대응하기 위해 도입되었다.","ep":[2]},{"s":1,"p":11,"q":"수익증권저축의 만기지급일과 관련된 내용 중 잘못된 것은?","o":["저축기간을 월,연 단위로 정한 경우 저축기간이 만료되는 월의 최초 납입상당일을 만기지 급일로 한다.","①의 경우 만료되는 월에 그 해당일이 없으면 그 월의 말일을 만기지급일로 한다.","저축기간을 일 단위로 정한 경우 최초 매수일로부터 계산하여 저축기간이 만료되는 날을 만기 지급일로 한다.","투자신탁계약을 해지한 경우에는 해지결산 후 첫 영업일을 만기지급일로 한다."],"a":2,"e":"저축기간을 일 단위로 정한 경우 최초 매수일로부터 계산하여 저축기간이 만료되는 날의 다음 영업일을 만기 지급일로 한다.","ep":[2]},{"s":1,"p":11,"q":"적립식 저축에 대한 설명 중 잘못된 것은?","o":["저축기간 중 저축재산의 일부인출이 가능하지만 신탁계약에서 정한 환매수수료를 징구한다.","저축금을 완납하고 저축기간이 종료된 이후에는 일부인출하여도 환매수수료가 없다.","저축자가 6개월 이상 저축금을 납입하지 않은 경우에는 14일 이상 기간을 정하여 추가납 입을 요구하고 그 기간 동안 저축자가 적절한 조치를 취하지 않으면 판매회사는 저축계약 을해지할 수 있다.","저축자가 약정한 만기일이 도래했으나 미납입 저축금이 있는 경우 이를 납입한 날을 만기 지급일로 한다."],"a":3,"e":"저축자가 약정한 만기일이 도래했으나 미납입 저축금이 있는 경우 이를 납입 완료한 다음 영업일을 만기지급일로 한다.","ep":[2]},{"s":1,"p":12,"q":"투자신탁의 수입시기는 과세시기를 의미한다. 다음 중 투자신탁의 과세시기가 아닌 것은?","o":["투자신탁의 이익을 지급받는 날, 즉 현금으로 이익을 수령하는 날","당초 소득이 신탁재산에 귀속된 날","재투자 특약에 의하여 원본이 전입되는 날","신탁계약기간을 연장하는 경우 그 기간을 연장하는 날"],"a":1,"e":"투자신탁의 경우 수입시기는 당초 소득이 신탁재산에 귀속되는 때가 아니라 투자자에게 소득이 분배되는 때이다.","ep":[3]},{"s":1,"p":12,"q":"파생상품과 파생결합증권에 간접투자하는 경우, 매매평가손익의 과세에 대한 설명 중 잘못된 것은?","o":["상장 주식의 매매평가손익은 투자신탁이익 계산 시 과세제외된다.","장외파생상품의 매매평가손익은 투자신탁이 익에 포함하여 배당소득으로 과세한다.","ELW에서 발생한 소득은 양도소득으로 과세된다.","비상장 파생결합증권의 매매평가손익은 투자신탁이익에 포함되지 않는다."],"a":3,"e":"상장되지 않은 ELS (주가연계증권), DLS (파생결합증권), ELW (주식워런트증권) 등의 매매평가손익은 투자신탁이익에 포함된다.","ep":[3]},{"s":1,"p":12,"q":"투자신탁이 투자한 유가증권에 대한 세제 중 과세제외되는 것으로 모두 묶인 것은?","o":["㉠, ㉢","㉠, ㉡, ㉢","㉠, ㉢, ㉣","㉠, ㉤, ㉥"],"a":0,"e":"㉡, ㉣, ㉤, ㉥은 과세된다.","ep":[3],"data":["주식선물거래에서 발생한 소득","장외파생상품의 매매평가손익","벤처기업 주식의 매매평가손익","비상장 파생결합증권의 매매평가손익","소득세법 제46조 제1항에 따른 채권을 투자하여 발생한 손익","국외 상장주식의 매매차익"]},{"s":1,"p":13,"q":"단기금융집합투자기구가 투자하는 단기금융상품으로 옳은 것은?","o":["잔존만기 5년 이내 국채증권","잔존만기 3년 이내 지방채증권","잔존만기 1년 이내 CD","잔존만기 1년 이내 주권관련사채권"],"a":0,"e":"단기금융집합투자기구의 투자대상 단기금융상품\n• 잔존만기 6개월 이내 양도성예금증서\n• 잔존만기 5년 이내 국채증권, 잔존만기 1년 이내 지방채·특수채·사채(단, 주권관련사채, 사모사채 제외) 및 기업어음증권\n• 잔존만기 1년 이내의 금융기관이 발행·할인·매매·중개·인수·보증하는 어음\n• 단기대출\n• 금융기관 예치\n• 다른 단기금융집합투자기구의 집합투자증권 등","ep":[3]},{"s":1,"p":13,"q":"환매금지형집합투자기구가 집합투자증권을 추가로 발행할 수 있는 경우에 해당하지 않는 것은?","o":["환매금지형집합투자기구로부터 이익분배금 범위 내에서 그 집합투자기구의 집합투자증권 을 추가로 발행하는 경우","기존 투자자의 이익을 해할 우려가 없다고 신탁업자의 확인을 받은 경우","기존 투자자 전원의 동의를 받은 경우","집합투자업자가 운용수익을 높이기 위한 경우"],"a":3,"e":"환매금지형집합투자기구가 집합투자증권을 추가로 발행 가능한 경우\n• 환매금지형집합투자기구로부터 이익분배금 범위 내에서 그 집합투자기구의 집합투자증권을 추가로 발행하는 경우\n• 기존 투자자의 이익을 해할 우려가 없다고 신탁업자로부터 확인을 받은 경우\n• 기존 투자자 전원의 동의를 받은 경우\n• 기존 투자자에게 집합투자증권의 보유비율에 따라 추가로 발행되는 집합투자증권의 우선 매수기회를 부여하는 경우","ep":[3]},{"s":1,"p":13,"q":"모자형집합투자기구와 Fund of Funds (재간접펀드)의 차이점으로 거리가 먼 것은?","o":["모자형집합투자기구는 운용의 효율성을 위하여 도입된 반면 Fund of Funds는 운용회사 운용능력의 아웃소싱을 위해 도입되었다.","모자형집합투자기구는 투자자가 하위투자기구에 투자하지만 Fund of Funds는 투자자가 그 투자기구 자체에 투자한다.","모자형집합투자기구는 상위 및 하위의 집합투자업자가 같지만 Fund of Funds는 대부분 그 투자기구와 투자대상투자기구의 집합투자업자가 다르다.","모자형집합투자기구는 다른 집합투자기구가 발행한 집합투자증권에 주로 투자하나 Fund of Funds는 동일한 집합투자기구가 발행한 집합투자증권에 주로 투자한다."],"a":3,"e":"모자형집합투자기구와 Fund of Funds는 하나의 집합투자기구가 다른 집합투자기구에 투자한다는 면에서 비슷하다.","ep":[3]},{"s":1,"p":14,"q":"펀드의 분류에 대한 설명으로 잘못된 것은?","o":["추가형은 신탁계약기간이 정해져 있지 않고 최초모집기간이 종료된 이후에도 투자할 수 있으나 단위형은 신탁계약기간이 정해져 있고 추가로 투자할 수 없다.","개방형은 계약기간 중도에 환매를 요구할 수 있으나 폐쇄형은 환매를 요구할 수 없다.","주식형(채권형)펀드는 주식(채권)에 펀드재산의 60%이상을 투자하는 펀드로 시장위험, 개별위험, 유동성위험이 있다.","장내파생상품에 투자하는 펀드는 장외파생상품에 투자하는 위험에 해당하는 위험 외에 거래상대방위험, 계약 조기해지위험, 지급금액 변동위험 등이 발생할 수 있다."],"a":3,"e":"장외파생상품에 투자하는 펀드는 장내파생상품에 투자하는 위험에 해당하는 위험 외에 거래상대방위험, 계약 조기해지위험, 지급금액의 변동위험 등이 발생할 수 있다.","ep":[3]},{"s":1,"p":14,"q":"인덱스펀드에 대한 설명으로 잘못된 것은?","o":["비용이 저렴하고, 운용이 투명하다.","장기투자를 할 경우 인덱스펀드는 동일한 수준의 수익률을 실현하는 액티브펀드보다 높은 수익률을 내는 것이 보통이다.","인핸스드 인덱스펀드는 추적 대상지수 수익률을 초과하는 수익률을 목표로 하는 인덱스펀 드로 알파 추구 전략 또는 차익거래를 이용한다.","인핸스드 인덱스펀드는 액티브펀드와 같이 위험을 제한 없이 부담하면서 추가수익전략을 수행한다."],"a":3,"e":"인핸스드 인덱스펀드는 액티브펀드와 달리 제한적 위험을 부담하며 추가수익전략을 수행한다.","ep":[3]},{"s":1,"p":14,"q":"특별자산펀드에 대한 설명으로 잘못된 것은?","o":["집합투자재산의 50%를 초과하여 증권 및 부동산을 제외한 투자대상자산인 특별자산에 투자하는 펀드이다.","자본시장법은 특별자산펀드를 반드시 환매금지 형 펀드로 설정하도록 의무화하고 있다.","발행일로부터 30일 이내에 증권시장에 상장해야 한다.","특별자산펀드를 금융위원회에 등록 시 특별자산 평가방법을 기재한 서류를 금융위원회에 제출해야 한다."],"a":2,"e":"발행일로부터 90일 이내에 증권시장에 상장해야한다.","ep":[3]},{"s":1,"p":15,"q":"특별자산펀드에서 펀드재산의 50%를 초과하여 투자해야 하는 특별자산과 거리가 먼 것은?","o":["특별자산이 신탁재산의 50%이상을 차지하는 경우의 수익증권","해외자원개발 전담회사와 특별자산에 대한 투자만을 목적으로 하는 법인이 발행한 수익 증권","사회기반시설사업의 시행을 목적으로 하는 법인이 발행한 주식과 채권","증권 및 부동산을 제외한 자산으로서 펀드에서 투자할 만한 경제적 가치가 있는 모든 투자대상자산"],"a":1,"e":"해외자원개발 전담회사와 특별자산에 대한 투자만을 목적으로 하는 법인이 발행한 지분증권·채무증권이 특별자산에 해당한다.","ep":[3]},{"s":1,"p":15,"q":"모자형집합투자기구에 대한 설명으로 잘못된 것은?","o":["운용의 집중도를 높일 수 있다.","기존 집합투자기구를 모자형집합투자기구로 변경할 수 있으며, 이 경우 하나의 집합투자 기구의 자산을 분리하여 둘 이상의 모집합투자기구로 이전할 수 있다.","사모집합투자기구가 아닌 집합투자기구로서 원본액이 50 억원 미만일 경우에는 금융위원 회가 고시하는 기준에 따라 이전이 가능하다.","모자형집합투자기구는 상위 및 하위 투자기구의 집합투자업자가 동일하지만 Fund of Funds의 경우에는 집합투자업자가 동일하지 않은 경우가 대부분이다."],"a":1,"e":"기존 집합투자기구를 모자형 집합투자기구로 변경할 수 있으나, 둘 이상의 집합투자기구의 자산을 합하여 하나의 모집합투자기구에 이전하거나 하나의 집합투자기구의 자산을 분리하여 둘 이상의 모집합투자기구로 이전할 수 없다.","ep":[3]},{"s":1,"p":15,"q":"ETF 에 대한 설명으로 가장 거리가 먼 것은?","o":["ETF는 반드시 상장해야 한다.","증권시장에서 거래되는 주식의 일종이다.","증권회사에 직접 주문을 내거나 HTS 또는 전화로 매매할 수 있다.","투자자가 원하는 가격과 시간에 매매할 수 있으므로 의사결정과 실제 투자 간의 차이가 발생하지 않는다."],"a":1,"e":"ETF는 주식처럼 거래되는 인덱스펀드이다.","ep":[3]},{"s":1,"p":16,"q":"다음 중 자본시장법상 특별자산펀드라고 보기 어려운 것은?","o":["원유를 생산하는 사업을 영위하는 회사의 지분증권에 투자하는 특별자산펀드","자연적 현상에 속하는 위험을 기초자산으로 하는 파생상품에 투자하는 특별자산펀드","선박투자회사법에 의거하여 설립된 선박투자회사의 발행주식에 투자하는 특별자산펀드","탄소배출권에 투자하는 특별자산펀드"],"a":0,"e":"농산물, 귀금속, 비철금속, 에너지자원(원유, 가스) 등과 같은 일반상품과 관련된 사업을 영위하는 회사의 지분증권에 투자하는 펀드는 자본시장법상 증권펀드에 해당한다.","ep":[3]},{"s":1,"p":16,"q":"신탁상품의 판매 관련 금지행위와 거리가 먼 것은?","o":["특정금전신탁 안내 및 홍보 금지","확정된 신탁계약조건 공시 금지","기준을 초과하는 재산상의 이익제공 및 수령 금지","신탁업 겸영 투자중개업자의 다른 수수료 부과 금지"],"a":1,"e":"확정된 신탁계약은 조건 등을 공시하여야 한다.","ep":[3]},{"s":1,"p":16,"q":"다음 중 신탁에서 수탁자의 의무와 가장 거리가 먼 것은?","o":["선량한 관리자로서의 주의의무","충실의무","통합관리의무","실적배당의 원칙 준수"],"a":2,"e":"수탁자는 자신의 고유재산과 고객의 신탁재산을 구분하여 관리해야 한다.","ep":[3]},{"s":1,"p":17,"q":"다음 중 특정금전신탁에 대한 설명이 잘못된 것은?","o":["고객 재산을 합동운용하는 신탁상품이라 최저 가입금액이 다른 상품에 비하여 낮은 편이다.","위탁자의 운용지시에 의하여 운용된다.","손실이 발생하더라도 신탁회사의 원금보존의무는 없다.","신탁금액의 일부 해지도 가능하다."],"a":0,"e":"고객별로 운용하는 단독운용 신탁상품이라 최저 가입금액이 다른 상품에 비하여 높은 편이다.","ep":[3]},{"s":1,"p":17,"q":"재산신탁의 유형과 거리가 먼 것은?","o":["연금신탁","부동산신탁","금전채권신탁","동산신탁"],"a":0,"e":"연금신탁은 금전신탁에 해당된다. 재산신탁(금전 외 신탁)은 신탁재산이 금전이 아닌 재산인 신탁상품으로 그 유형에는 금전채권신탁, 증권신탁, 부동산신탁, 부동산권리신탁, 동산신탁, 무체 재산권신탁 등이 있다.","ep":[3]},{"s":1,"p":17,"q":"신탁상품 판매 시 신탁상품의 상품설명서를 교부하고 일반투자자가 알 수 있도록 설명해야 한다. 특정금전신탁의 경우 추가 설명해야 할 사항과 거리가 먼 것은?","o":["수익자가 운용방법을 지정하고, 수탁자는 지정된 운용방법에 따라 운용한다는 사실","위탁자는 운용방법 변경지정 또는 계약의 해지를 요구할 수 있고, 신탁회사(수탁자)는 특 별한 사유가 없는 한 이에 응할 의무가 있다는 사실","위탁자는 신탁회사 임직원에게 상담 요청을 할 수 있고, 신탁회사 임직원은 이에 응할 준 비가 되어 있다는 사실","위탁자는 신탁재산의 운용내역 및 자산의 평가가액을 조회할 수 있다는 사실"],"a":0,"e":"특정금전신탁의 추가설명사항\n• 위탁자는 운용방법을 지정하고, 신탁회사(수탁자)는 지정된 운용방법에 따라 신탁재산을 운용한다는 사실\n• 위탁자는 운용방법 변경지정 또는 계약해지를 요구할 수 있고, 신탁회사(수탁자)는 특별한 사유가 없는 한 이에 응할 의무가 있다는 사실\n• 위탁자는 신탁회사 임직원에게 상담 요청을 할 수 있고, 신탁회사 임직원은 이에 응할 준비가 되어 있다는 사실\n• 위탁자는 신탁재산의 운용내역 및 자산의 평가가액을 조회할 수 있다는 사실","ep":[3]},{"s":1,"p":18,"q":"비지정형 금전신탁 판매 시 준수사항과 거리가 먼 것은?","o":["신탁회사의 임직원은 투자자 정보를 파악하여 투자자를 유형화 하고 고객 서명 등의 방법 으로 확인 후 이를 지체 없이 고객에게 제공해야 한다.","신탁회사는 하나 이상의 자산배분유형군을 마련해야 하며, 하나의 자산배분유형군은 둘 이상의 세부자산배분유형으로 구분해야 한다.","신탁회사는 투자자 유형에 적합한 세부자산배분유형을 정하고 신탁계약을 체결해야 한다.","신탁회사 임직원이 성과보수를 수취하더라도 그로 인한 잠재위험에 관한 사항까지 설명 해야 하는 것은 아니다."],"a":3,"e":"신탁회사의 임직원은 비지정형 금전신탁계약을 체결하기 전에 세부자산배분유형 간 구분기준, 차이점 및 예상위험수준에 관한 사항, 분산투자규정이 없을 수 있어 수익률의 변동성이 펀드 등에 비하여 더 클 수 있다는 사실, 투자자유형별 위험도를 초과하지 않는 범위 내에서만 신탁재산의 운용에 대해 투자자가 개입할 수 있다는 사실, 성과보수를 수취하는 경우 그 수취요건 및 그로 인한 잠재위험에 관한 사항 등을 설명해야 한다.","ep":[3,4]},{"s":1,"p":18,"q":"듀레이션에 대한 설명으로 거리가 먼 것은?","o":["포트폴리오의 듀레이션은 포트폴리오 내 각 채권 듀레이션의 가중평균과 같다.","다른 조건이 동일하면 표면금리가 낮을수록 듀레이션이 작아진다.","다른 조건이 동일하면 만기가 길수록 듀레이션이 커진다.","이표채의 듀레이션은 만기보다 길 수 없다."],"a":1,"e":"표면금리가 낮을수록 듀레이션은 커진다.","ep":[4]},{"s":1,"p":18,"q":"주가분석에 대한 설명으로 가장 올바른 것은?","o":["주가순자산비율 (PBR)은 기업의 단위당 수익가치에 대한 상대적인 수준을 나타내는 지표 이다.","패턴분석 중 삼각형·깃발형은 반전형에 해당한다.","기술적 분석은 수급이 아닌 다른 요인으로 발생된 주가변동도 잘 설명할 수 있다.","지표분석은 과거의 추세성향이 향후에도 반복될 가능성이 있다는 것을 전제로 하여 주가 를 예측한다."],"a":3,"e":"① 주가수익비율 (PER)은 기업의 단위당 수익가치에 대한 상대적인 수준을 나타내는 지표이다. ② 패턴분석 중 삼각형·깃발형은 지속형에 해당한다. ③ 기술적 분석은 수급이 아닌 다른 요인으로 발생된 주가변동을 설명하기 어렵다.","ep":[4]},{"s":1,"p":19,"q":"다음 중 채권투자 시 신용위험 (Credit Risk) 에 해당하지 않는 것은?","o":["유동성위험 (Liquidity Risk)","신용등급 하향위험 (Downgrade Risk)","신용 스프레드 확대위험 (Credit Spread Risk)","부도위험 (Default Risk)"],"a":0,"e":"유동성위험 (Liquidity Risk)은 신용위험 (Credit Risk) 에 해당하지 않는다.","ep":[4]},{"s":1,"p":19,"q":"채권의 종류와 성격에 대한 설명으로 잘못된 것은?","o":["국채는 정부가 원리금을 지급하므로 무위험채권으로 분류된다.","할인채는 만기금액을 기간 이자율로 할인하여 발행한다.","지방채는 국채보다 안정성이 높고 이자율은 낮다.","선순위채의 청구권은 후순위채의 청구권보다 우선한다."],"a":2,"e":"국채가 지방채보다 안정성이 높고, 이자율은 낮다.","ep":[4]},{"s":1,"p":19,"q":"적극적 주식운용전략으로 잘못된 것은?","o":["성장주 투자전략","가치주 투자전략","중소형주 투자전략","주식 인덱싱전략"],"a":3,"e":"주식 인덱싱전략은 대표적인 소극적 주식운용전략이다.","ep":[4]},{"s":1,"p":20,"q":"절대적 위험을 나타내는 위험지표로 옳은 것은?","o":["표준편차","공분산","초과수익률","베타"],"a":0,"e":"②③④는 상대적 위험지표이다.","ep":[4]},{"s":1,"p":20,"q":"소극적 채권운용전략으로 잘못된 것은?","o":["만기보유전략","듀레이션조절전략","채권면역전략","현금흐름일치전략"],"a":1,"e":"듀레이션을 조절하는 것은 금리예측이 필요하며 적극적 채권운용전략이다.","ep":[4]},{"s":1,"p":20,"q":"펀드 분석 및 평가에 대한 일반적인 설명으로 잘못된 것은?","o":["펀드 분석이란 분석대상 펀드의 특징을 찾아내는 과정이다.","양적 평가에는 성과요인 분석, 포트폴리오 분석 등이 있다.","펀드 평가란 평가대상 펀드의 운용성과를 측정하여 그 우열이나 순위를 가리는 과정이다.","계량적 평가는 성과의 우열을 가리기 위한 것이다."],"a":1,"e":"성과요인 분석, 포트폴리오 분석, 운용회사의 질적 평가는 집합투자기구의 성과 원인과 특성을 파악하는 질적(정성적) 성과평가이다. 계량적(정량적) 성과평가는 성과의 우열을 가리기 위한 것이다.","ep":[4]},{"s":2,"p":21,"q":"자본시장법상 내국인 또는 외국인이 발행한 금융투자상품으로서 투자자가 취득과 동시에 지급한 금전 등 외에 어떠한 명목으로도 추가지급의무를 부담하지 않는 것은?","o":["ELS","스 왑","선 도","CDS"],"a":0,"e":"내국인 또는 외국인이 발행한 금융투자상품으로서 투자자가 취득과 동시에 지급한 금전 등 외에 어떠한 명목으로든지 추가지급의무를 부담하지 않는 것은 증권이다. ELS는 증권 중 파생결합증권에 해당한다.","ep":[4]},{"s":2,"p":21,"q":"기초자산의 가격·이자율·지표·단위 또는 이를 기초로 하는 지수 등의 변동과 연계하여 미리 정해진 방법에 따라 지급하거나 회수하는 금전 등이 결정되는 권리가 표시된 것은?","o":["ETF","ELS","주권","Futures"],"a":1,"e":"ELS는 파생결합증권이며 ETF는 수익증권, 주권은 지분증권, Futures (선물)는 파생상품이다.","ep":[4]},{"s":2,"p":21,"q":"단기금융집합투자기구에 대한 제한사항과 거리가 먼 것은?","o":["부동산에 투자할수 없다.","특별자산에 투자할 수 없다.","채무증권에 투자할수 없다.","파생상품에 투자할 수 없다."],"a":2,"e":"단기금융집합투자기구 (MMF)는 증권에만 투자할 수 있고, 부동산·특별자산·파생상품에는 투자할 수 없다.","ep":[4]},{"s":2,"p":21,"q":"집합투자업자가 파생상품매매에 따른 명목계약금액을 산정할 때 사용할 수 있는 방법과 거리가 먼 것은?","o":["옵션매도는 델타위험액에 감마위험액과 베가위험액을 모두 합산하여 산정한다.","회계기준상 위험회피 회계의 적용대상이 되는 거래는 명목계약금액 산정대상에서 제외 할 수 있다.","서로 다른 통화를 교환하는 거래(통화스왑)의 경우 지급하기로 한 통화의 명목원금이 계 약금액이 된다.","기초자산이 동일하고 가격의 변화방향이 반대인 파생상품 거래는 명목계약금액 산정대상 에서 제외할 수 있다."],"a":3,"e":"기초자산이 동일하고 가격의 변화방향이 반대인 파생상품 거래는 각각의 위험평가액을 기준으로 상계 한 후 잔여 명목계약금액을 위험평가액으로 산정할 수 있다.","ep":[4]},{"s":2,"p":22,"q":"자본시장법은 파생상품펀드에 대하여 별도의 위험관리방법에 대한 신고의무를 집합투자업자에게 부여하고 있다. 다음 중 예외적으로 신고의무가 적용되지 않는 펀드를 모두 고른 것은?","o":["㉠","㉠, ㉡","㉠, ㉡, ㉢","㉠, ㉡, ㉢, ㉣"],"a":2,"e":"공모펀드는 위험관리방법에 대한 신고의무가 적용된다.","ep":[4],"data":["사모펀드","전문사모펀드","헤지펀드","공모펀드"]},{"s":2,"p":22,"q":"파생상품거래에 따른 만기시점의 손익구조를 공시하는 방법에 대한 설명 중 잘못된 것은?","o":["당해 파생상품 기초자산의 가격변동에 따른 손익구조변동을 기재해야 한다.","이 익발생구간, 손실발생구간으로 구분해야 한다.","투자자가 이해하기 쉽도록 도표 등으로 나타내야 한다.","서술식으로 요약하여 기재해야 한다."],"a":1,"e":"이익발생구간, 손익이 없는 구간, 손실발생구간으로 구분해야 한다.","ep":[4]},{"s":2,"p":22,"q":"파생상품펀드 위험지표의 공시 시기가 잘못된 것은?","o":["계약금액은 파생상품 거래 후 그 다음 날까지 공시해야 한다.","파생상품 거래에 따른 만기시점의 손익구조는 파생상품 거래 후 그 다음 날까지 공시해 야 한다.","시장상황 변동에 따른 펀드재산의 손익구조변동은 파생상품 거래 후 그 다음 날까지 공시 해야 한다.","최대손실예상금액은 매일 공시해야 한다."],"a":2,"e":"시장상황 변동에 따른 펀드재산의 손익구조변동은 매일 공시해야 한다.","ep":[4]},{"s":2,"p":23,"q":"주가연계 금융상품에 대한 설명으로 가장 거리가 먼 것은?","o":["주가연계증권 (ELS)에서 발생한 소득은 이자소득으로 과세된다.","주가연계증권 (ELS)은 원금보장구조도 가능하다.","주가연동예금 (ELD)은 5 천만원까지 예금자보호를 받는다.","주가연계펀드 (ELF)에서 발생한 소득은 배당소득으로 과세된다."],"a":0,"e":"주가연계증권 (ELS)에서 발생한 소득은 배당소득으로 과세된다.","ep":[4]},{"s":2,"p":23,"q":"다음 중 환율관련펀드에 대한 설명으로 올바른 것은?","o":["원화 강세가 예상될 때는 하락형 낙아웃 (Knock-Out) 구조가 적절하다.","환율은 안정적으로 움직이다가 짧은 기간에 큰 폭의 등락을 보이기 때문에 위험관리에 신중하여야 한다.","환율이 제한적으로 움직일 것으로 예상될 때는 디지털 구조가 유효하다.","환율 변동 범위가 제한적으로 예상될 때는 낙인 (Knock-In) 구조가 효과적이다."],"a":1,"e":"① 원화 강세가 예상될 때는 디지털 구조가 적절하다. ③ 환율이 제한적으로 움직일 것으로 예상될 때는 양방향 낙아웃 (Knock-Out) 구조가 유효하다. ④ 환율 변동 범위가 제한적으로 예상될 때는 낙아웃 (Knock-Out) 구조가 효과적이다.","ep":[4]},{"s":2,"p":23,"q":"다음 중 멀티에셋 파생상품펀드에 대한 설명으로 가장 올바른 것은?","o":["자산배분 효과가 거의 없다.","적은 투자금액으로 효율적인 자산에 집중투자할 수 있다.","자산배분을 통하여 안정적인 수익을 추구하는 것이 일반적이다.","구조가 단순하여 이해하기 쉽다."],"a":2,"e":"① 자산배분 효과가 있다. ② 적은 투자금액으로 다양한 자산에 분산투자할 수 있다. ④ 구조가 복잡한 경우가 많다.","ep":[4]},{"s":2,"p":24,"q":"현재 시장에서 A 기업의 주가는 20,000 원에, B 기업의 주가는 8,000 원에 거래되고 있는 상태이다. 이때 A 기업은 B 기업의 주주에게 1 주당 A 기업의 주식 0.5 주를 지급하는 것을 내용으로 하는 합병계획을 발표하였는데, 합병 차익거래를 위해 투자자들은 어떻게 하여 야 하는가?","o":["A 기업의 주식 매수, B 기업의 주식 매수","A 기업의 주식 매도(공매도), B 기업의 주식 매도(공매도)","A 기업의 주식 매도(공매도), B 기업의 주식 매수","A 기업의 주식 매수, B 기업의 주식 매도(공매도)"],"a":2,"e":"적정가 대비 낮게 거래되는 B 기업의 주식을 매수하고, A 기업의 주식을 매도(공매도)한다.","ep":[4]},{"s":2,"p":24,"q":"이색옵션에 관한 다음 설명에서 빈칸 안에 들어갈 말을 순서대로 나열한 것은?\n만기 이전에 아무 때나 한 번 옵션을 행사할 수 있는 구조는 ( ), 만기일 당일에만 권리행사가 가능하면 ( ), 미리 정한 특정 일자들 중 한 번을 선택하여 권리행사를 할 수 있으면 ( )이다.","o":["버뮤다식 – 유럽식 – 미국식","미국식 – 버뮤다식 – 유럽식","미국식 – 유럽식 – 버뮤다식","유럽식 – 미국식 – 버뮤다식"],"a":2,"e":"순서대로 미국식, 유럽식, 버뮤다식이 들어가야 한다. 예를 들어 만기가 한 달이라면 유럽식의 행사가능 시점은 만기시점 1회, 미국식의 행사가능 시점은 아무 때나이고, 버뮤다식은 10일, 20일, 30 일의 3 회로 설정되어 있는 것이다.","ep":[4]},{"s":2,"p":24,"q":"구조화형 펀드에 대한 설명으로 거리가 먼 것은?","o":["펀드매니저의 주관을 배제한 채 시스템에서 보내주는 매매 신호에 따라 기계적으로 파생 상품을 거래한다.","기초자산과 파생상품을 어떤 식으로 조합하느냐에 따라 다양한 수준의 위험과 기대수익률 을 갖춘 상품을 고안해 낼 수 있다.","채권 + 초과성과를 추구하기 위하여 접근하는 유형이다.","장내파생상품 혹은 주식을 활용한 델타헤징 (Delta Hedging) 기 법을 이용한다."],"a":0,"e":"시스템 운용형 펀드에 대한 설명이다.","ep":[4]},{"s":2,"p":25,"q":"다음 중 포트폴리오 보험 (Portfolio Insurance) 기법을 단순화하여 최초 투자금액의 일정 비 율을 방어하도록 설계하는 투자전략은?","o":["방어적 풋전략 (Protective Put Strategy)","이자추출전략 (Cash Extraction Strategy)","일정 비율 보험전략 (Constant Proportion Portfolio Insurance Strategy)","시간 불변 포트폴리오 보존전략 (Time Invariant Portfolio Protection Strategy)"],"a":2,"e":"일정 비율 보험전략(Constant Proportion Portfolio Insurance Strategy)에 대한 설명이다.","ep":[4]},{"s":2,"p":25,"q":"다음 중 W.P.(Worst Performer)를 이용하여 수익률을 산정한 값은?\n• A기업 주가 50,000원 → 60,000원\n• B기업 주가 300,000원 → 345,000원","o":["15%","18%","20%","22%"],"a":0,"e":"A기업 수익률 = 60,000 ÷ 50,000 − 1 = 20%\nB기업 수익률 = 345,000 ÷ 300,000 − 1 = 15%\n두 수익률 중 낮은 값을 적용하므로 W.P. 수익률은 15%이다.","ep":[4]},{"s":2,"p":25,"q":"다음 중 선도거래의 일반적인 특징에 대한 설명으로 거리가 먼 것은?","o":["앞으로 얼마가 될지 모르는 가격을 미리 정해놓음으로써 위험회피효과를 거둘 수 있다.","특히 가격이 폭락할 경우 기업의 파산 위험이 존재하므로 선도거래는 기업의 파산 위험을 줄여주는 효과가 있다.","사후적으로 현물시세가 나온 후 선도거래를 평가하는 경우 사후적 제로섬 게임이 되어 거래의 한쪽 당사자가 손실을 볼 가능성이 있다는 점에 주의하여야 한다.","선도거래의 묘미는 신용 위험을 없애고 반대매매를 자유롭게 할 수 있다는 데에 있다."],"a":3,"e":"선물거래에 관한 설명이며, 참고로 선물거래는 신용 위험을 없애기 위해서 증거금제도와 일일정산제도를 두고 있다.","ep":[5]},{"s":2,"p":26,"q":"만기가 1개월 남은 선물 1계약을 매입한 투자자의 일일정산 후 증거금이 165만원이다. 증거금 수준이 다음과 같을 때 추가증거금을 가장 많이 납부하여야 하는 경우는?","o":["개시증거금 230만원·유지증거금 140만원","개시증거금 220만원·유지증거금 150만원","개시증거금 210만원·유지증거금 160만원","개시증거금 200만원·유지증거금 170만원"],"a":3,"e":"추가증거금은 증거금잔고가 유지증거금 미만이 되는 경우에 납부하여야 한다. 이때, 증거금은 개시증거금 수준까지 회복시켜야 한다.","ep":[5]},{"s":2,"p":26,"q":"주가지수선물 이론가격에 대한 설명으로 가장 올바른 것은?","o":["이론적 보유비용은 이론선물가격과 현물가격의 차이이다.","이론선물가격이 실제선물가격보다 높을 경우 현물을 매입하고 선물을 매도하는 차익거래가 가능하다.","이자율과 배당률이 동일할 때, 선물의 만기가 길어질수록 이론선물가격은 높아진다.","배당률이 낮아지면 이론선물가격은 낮아진다."],"a":0,"e":"② 이론선물가격이 실제선물가격보다 높을 경우 현물을 매도하고 선물을 매수하는 차익거래가 가능하다. ③ 이자율과 배당률이 동일할 때 이론선물가격은 현물가격과 같아진다. ④ 배당률이 낮아지면 이론선물가격은 높아진다.","ep":[5]},{"s":2,"p":26,"q":"다음 중 최초에 원금이 교환되고 만기 때 재교환되는 거래는?","o":["금리스왑","통화스왑","금리선도계약","신용연계증권 (CLN)"],"a":1,"e":"통화스왑은 금리스왑과는 달리 실제 원금이 교환된다.","ep":[5]},{"s":2,"p":27,"q":"A 주식의 가격이 150 원일 때, A 주식에 대한 콜옵션 매수 포지션의 시간가치가 가장 큰 것은?","o":["만기 1개월, 행사가격 160원, 프리미엄 10원","만기 2개월, 행사가격 155원, 프리미엄 20원","만기 3개월, 행사가격 145원, 프리미엄 30원","만기 4개월, 행사가격 140원, 프리미엄 40원"],"a":3,"e":"①은 10원, ②는 20원, ③은 25원, ④는 30 원이므로 ④의 시간가치가 가장 크다.","ep":[5]},{"s":2,"p":27,"q":"다음 중 파생결합증권에 관한 설명으로 거리가 먼 것은?","o":["파생결합증권 수익구조의 기본이 되는 논리로 이자추출전략이 있다.","낙아웃 옵션 (Knock-Out Option)은 만기 이전에 기초자산의 가격이 미리 설정된 경계수 준 (Barrier)을 건드리면 옵션이 무효가 되도록 짜여진 옵션이다.","채권 투입부분은 다 똑같지만 옵션의 매수 또는 매도포지션을 부가하는 것이 대부분이다.","파생결합증권에 사용되는 옵션은 주로 장내옵션이 대부분이다."],"a":3,"e":"파생결합증권에 사용되는 옵션은 주로 장외옵션이 대부분이다.","ep":[5]},{"s":2,"p":27,"q":"다음 경우에 옵션을 가진 투자자가 얻을 수 있는 수익의 크기와 최종 조정된 행사가격은?\n• 최초 행사가격이 100인 래더(Ladder) 콜옵션이 있다.\n• 래더 수준이 95, 100, 105, 110으로 정해져 있다.\n• 기초자산 가격이 100에서 시작하여 움직이다가 105를 통과하여 109가 되었다.","o":["이익 5, 행사가격 105","손실 5, 행사가격 109","이익 없음, 행사가격 100","이익 없음, 행사가격 109"],"a":0,"e":"스텝록 래더옵션의 경우, 기초자산의 가격이 래더 수준을 어디까지 건드리느냐에 따라 행사가격이 결정된다. 109까지 가격이 상승한 경우 래더수준의 105까지 건드린 것으로, 110 까지는 가지 못했다. 따라서 행사가격은 105 로 재설정되면서 최초 100에서 105 까지의 상승분에 대해 이익을 확정지급하게 된다.","ep":[5]},{"s":2,"p":28,"q":"다음 중 파생상품펀드의 리스크관리에 관한 설명으로 올바른 것은?","o":["자체헤징이 불가능하거나 여의치 않을 경우 동일한 수익구조를 가진 장외파생상품거래를 통하여 다른 거래상대에게 위험을 전가한다.","파생결합증권의 발행사가 자체적으로 매매활동을 통한 수익구조를 창출하는 경우에는 백투백 (BTB) 거래가 필요하다.","Unfunded Swap은 파생결합증권의 발행금액 대부분을 거래 상대방에게 지급하고 중도상환 혹은 만기일에 원리금을 되돌려 받는 구조이다.","파생결합증권에 내재된 파생상품부분만 따로 떼어내서 거래를 체결하는 방식을 Funded Swap 이라고 한다."],"a":0,"e":"② BTB 거래가 필요 없다. ③ Funded Swap 에 대한 설명이다. ④ Unfunded Swap 에 대한 설명이다.","ep":[5]},{"s":2,"p":28,"q":"다음 중 백투백 (BTB) 거래를 하는 파생결합증권 발행사의 리스크관리에 대한 설명으로 옳은 것은?","o":["신용 리스크의 관리방안으로는 Funded Swap의 활용 및 담보제공계약 등이 있다.","파생결합증권과 동일한 수익구조의 장외파생상품 거래를 하므로 시장 리스크는 발생하지 않는다.","표준적인 담보제공계약서는 별도의 법률적 자문이 필요 없다.","파생결합증권과 장외파생상품 거래는 상이한 양식의 계약서로 이루어져 있으므로 특별히 검토할 필요는 없다."],"a":1,"e":"① 신용 리스크의 관리방안으로는 Unfunded Swap의 활용 및 담보제공계약 등이 있다. ③ 표준적인 담보제공계약서는 별도의 법률적 자문이 필요하다. ④ 파생결합증권과 장외파생상품 거래는 상이한 양식의 계약서로 이루어져 있으므로 내용이 상충 되지 않는지 충분한 검토를 하여야 한다.","ep":[5]},{"s":2,"p":28,"q":"다음 중 환리스크 헤지에 대한 설명으로 거리가 먼 것은?","o":["채권형 펀드의 경우 대체로 투자원금 규모의 50 〜 70% 의 환헤지를 하는 것이 보통이다.","역외펀드의 경우 환율의 폭등과 투자원금의 손실이 겹치면서 의도하지 않은 과다헤지로 인한 추가손실이 발생하기도 한다.","통화선물보다 선물환 거래의 유동성이 더 풍부하다.","펀드 만기보다 짧은 만기의 선물환 거래를 하였을 경우, 만기이월 시 펀드에서 가용현금이 부족한 사태가 발생할 수 있다."],"a":0,"e":"채권형 펀드는 대체로 투자원금 규모의 환헤지를 하는 것이 보통이다.","ep":[5]},{"s":3,"p":29,"q":"부동산펀드의 투자대상인 부동산에 대한 설명 중 잘못된 것은?","o":["민법상 토지와 그 정착물이 부동산펀드 투자대상 부동산에 해당한다.","부동산에 투자하는 방법은 부동산을 취득하여 매각하는 방법에 한한다.","부동산펀드가 주로 투자하는 부동산은 임대료를 수취하는 수익형 부동산이다.","호텔, 리조트 등을 부동산펀드가 직접 또는 간접적으로 운영할 수 있다."],"a":1,"e":"부동산에 투자하는 방법은 단순히 부동산을 취득하여 매각하는 방법에 한하지 않고, 부동산관리, 부동산개량, 부동산임대, 부동산개발 등의 방법으로 투자하는 것도 가능하다.","ep":[5]},{"s":3,"p":29,"q":"부동산펀드의 운용제한에 대한 설명 중 잘못된 것은?","o":["부동산펀드에서 취득한 부동산은 일정 기간 내 처분을 제한하고 있다.","부동산펀드에서 토지를 취득한 경우 원칙적으로 그 토지에 대하여 부동산개발사업 시행 전에 처분할 수 없다.","전문투자형사모펀드가 부동산에 투자하는 경우에는 ①의 처분제한 이외의 다른 운용규제 를 적용받지 않는다.","부동산개발회사가 발행한 증권은 사모에 한하여 펀드재산의 100%까지 투자할 수 있다."],"a":3,"e":"부동산개발회사가 발행한 증권, 부동산투자목적회사가 발행한 증권, 주택저당담보부채권, 주택저당 증권의 경우에는 공모·사모 구분 없이 펀드재산의 100%까지 투자할 수 있다.","ep":[5]},{"s":3,"p":29,"q":"부동산펀드의 금전차입에 대한 설명 중 잘못된 것은?","o":["부동산펀드의 금전차입을 허용한 이유는 부동산을 취득하는 경우 타인자본을 활용하여 취득하는 것이 일반적이라는 현실을 수용한 것이다.","국가재정법에 따른 기금에서는 차입할 수 있으나 외국 금융기관에서는 차입할 수 없다.","해당 차입기관에 대하여 부동산 담보를 제공하거나 금융위원회가 정하여 고시하는 방법으로 금전을 차입한다.","집합투자자총회에서 차입기관 및 차입방법을 다르게 의결한 경우 그 의결에 따라 금전을 차입할수 있다."],"a":1,"e":"외국 금융기관에서도 차입할 수 있다.","ep":[5]},{"s":3,"p":30,"q":"집합투자업자가 펀드재산으로 부동산개발사업에 투자하는 경우에는 사업계획서를 작성해야 한다. 다음 중 그 사업계획서에 포함되어야 할 내용을 모두 고른 것은?","o":["㉠, ㉡, ㉢, ㉣","㉠, ㉡, ㉢, ㉣, ㉤","㉠, ㉡, ㉢, ㉣, ㉤, ㉥","㉠, ㉡, ㉢, ㉣, ㉤, ㉥, ㉦"],"a":3,"e":"㉠~㉦ 모두 사업계획서에 포함되어야 한다.","ep":[5],"data":["부동산개발사업 추진일정","부동산개발사업 추진방법","건축계획 등이 포함된 사업계획에 관한 사항","자금의 조달, 투자 및 회수에 관한 사항","추정손익에 관한 사항","사업의 위험에 관한 사항","공사시공 등 외부용역에 관한 사항"]},{"s":3,"p":30,"q":"부동산펀드의 금전대여에 대한 설명 중 잘못된 것은?","o":["원칙적으로 펀드는 콜론을 제외한 금전대여를 금지하고 있지만, 부동산펀드는 예외적으 로 허용하고 있다.","부동산개발사업을 영위하는 법인에 대하여 해당 요건을 모두 충족해야 금전을 대여할 수 있다.","집합투자규약에서 금전대여에 관한 사항을 정하고 있어야 한다.","공모부동산펀드뿐만 아니라 사모부동산펀드도 집합투자업자가 부동산에 대하여 담보권 을 설정하거나 시공사 등으로부터 지급보증을 받는 등 대여금 회수를 위한 적절한 수단을 확보해야 한다."],"a":3,"e":"사모부동산펀드의 경우에는 대여금 회수를 위한 적절한 수단을 확보해야 한다는 요건이 적용되지 않는다.","ep":[5]},{"s":3,"p":31,"q":"펀드재산의 50%를 초과하여 부동산과 관련된 증권에 투자하는 부동산펀드는?","o":["실물형부동산펀드","대출형부동산펀드","재간접형부동산펀드","증권형부동산펀드"],"a":3,"e":"펀드재산의 50%를 초과하여 ‘부동산과 관련된 증권’에 투자하는 부동산펀드는 증권형부동산펀드이다. ‘부동산과 관련된 증권’에는 부동산담보부채권 이나 해외증권시장에 상장된 글로벌리츠의 집합투자증권 등을 들 수 있으며 후자에 투자하는 경우 재간접펀드가 된다.","ep":[5]},{"s":3,"p":31,"q":"부동산펀드의 종류 및 특성에 관한 설명으로 잘못된 것은?","o":["펀드의 설정·설립 이전에 펀드재산으로 투자할 부동산 등이나 대출할 대상개발사업을 미 리 특정하는 형태를 사전특정형부동산펀드라고 한다.","국내에서 설정·설립되는 대부분의 부동산펀드는 사전불특정 (Blind) 형부동산펀드에 해당한다.","펀드재산으로 투자할 대상이 미리 특정하지 않은 상태에서 펀드자금을 모집하는 펀드를 사전불특정 형 부동산펀드라고 한다.","경·공매형부동산펀드는 사전불특정 형부동산펀드의 대표적인 사례이다."],"a":1,"e":"국내에서 설정·설립되는 대부분의 부동산펀드는 사전특정형 부동산펀드에 해당한다.","ep":[5]},{"s":3,"p":31,"q":"다음 중 임대형부동산펀드에 대한 설명으로 거리가 먼 것은?","o":["일종의 매입 - 임대 (Buy & Lease) 방식의 부동산펀드라고 할 수 있다.","업무용 부동산 또는 상업용 부동산 등과 같은 수익성 부동산을 대상으로 한다.","안정적인 이자소득과 매각에 따른 자본소득을 주된 운용전략으로 한다.","대표적인 위험요인은 관리비 상승이다."],"a":3,"e":"대표적인 위험요인은 공실률이다.","ep":[5]},{"s":3,"p":32,"q":"투자대상자산에 따른 부동산펀드의 유형과 관계가 없는 것은?","o":["임대형부동산펀드","파생상품형부동산펀드","대출형부동산펀드","국내투자부동산펀드"],"a":3,"e":"투자대상자산에 따라 임대형, 경·공매형, 파생상품형, 대출형, 개발형, 권리형, 증권형부동산펀드로 구분된다.","ep":[5]},{"s":3,"p":32,"q":"펀드재산의 50%를 초과한 자금으로 업무용 또는 상업용 부동산 등을 매입한 후 이를 임대하여 안정적인 임대수입과 향후 매입 부동산 가치 상승 시 자본소득도 확보하려는 펀드로 옳은 것은?","o":["임대형부동산펀드","대출형부동산펀드","개발형부동산펀드","증권형부동산펀드"],"a":0,"e":"임대형부동산펀드에 대한 설명이다.","ep":[5]},{"s":3,"p":32,"q":"다음 중 자본시장과 부동산시장에 관한 내용으로 올바른 것은?","o":["부동산은 자본시장의 투자여건 변화에 거의 영향을 받지 않는다.","부동산과 경쟁하는 다른 자산에 대한 상황을 파악할 필요가 없다.","금리상황과 향후 금리변화를 수시로 파악할 필요가 없다.","부동산투자는 금융비용에 영향을 주어 자기자본의 투자수익률에도 영향을 주게 된다."],"a":3,"e":"① 부동산은 자본시장의 투자여건 변화에 상당한 영향을 받는다. ② 부동산과 경쟁하는 다른 자산에 대한 상황을 파악하여야 한다. ③ 금리상황과 향후 금리변화를 수시로 파악할 필요가 있다.","ep":[5]},{"s":3,"p":33,"q":"부동산시장의 세 가지 하부시장으로 잘못된 것은?","o":["공간시장","자산시장","개발시장","대출시장"],"a":3,"e":"부동산시장의 하부시장은 공간시장, 자산시장, 개발시장으로 구성된다.","ep":[5]},{"s":3,"p":33,"q":"다음 중 프로젝트 파이낸싱(PF)에 대한 설명으로 잘못된 것은?","o":["프로젝트 파이낸싱 (PF)은 물적 담보로 대출을 받는 것이 아니라 사업자의 신용이나 해 당 사업으로부터 발생하는 미래의 현금흐름을 담보로 자금을 조달하는 공급자금융이다.","원리금 상환은 해당 사업에서 발생하는 현금흐름에 의존하기 때문에 사업의 수익성이 장 기, 안정, 고수익성이어야 하므로 대부분 대규모 프로젝트나 해외 건설부문에 많이 사용 된다.","해당 사업이 도산할 경우 사업의 수익성을 담보로 한 대출이기 때문에 사업주는 개인적인 채무를 지지 않지만, 이 경우에 해당 사업에서 발생하는 현금흐름이나 자산의 범위 내에 서 채권청구가 가능하다.","다양한 사업 주체가 해당 사업에 참여하고 이해당사자 간의 위험분산이 가능하나 이해당 사자 간의 계약관계에 따라 절차가 복잡하므로 사업이 지연될 가능성이 있다."],"a":0,"e":"프로젝트 파이낸싱 (PF)은 사업자의 신용이나 물적 담보가 아닌 해당 사업의 수익성을 담보로 자금을 조달하는 방법이다.","ep":[5]},{"s":3,"p":34,"q":"다음 중 대안투자(부동산투자)의 위험에 대한 내용으로 거리가 먼 것은?","o":["투자금이 회수되지 않았을 경우를 대비하여 펀드 자동연장 조항을 집합투자규약에 넣고 있다.","실물형 부동산펀드에서는 부동산 매입금액의 50 〜 100bp 수준의 취득수수료가 발생한다.","부동산펀드운용의 경쟁이 심화되면서 완만하게 성장하였다.","운용자 스스로 시장에 많지 않은 프로젝트(부동산투자)를 발굴하고 투자적정성 여부를 검토하여야 한다."],"a":2,"e":"부동산펀드운용의 경쟁이 심화되면서 시행착오를 겪으며 성장하였다.","ep":[6]},{"s":3,"p":34,"q":"다음 중 위험관리방안에 대한 내용으로 거리가 먼 것은?","o":["현재 국내에서는 부동산관련 지수가 개발되지 않았거나 공신력이 떨어진다.","유동성 위험은 개발사업과 관련하여 부동산을 분양하고자 하는 경우 주로 발생한다.","개발 위험을 회피하기 위하여서는 확정가격에 의한 일괄도급계약을 활용할 수 있다.","수익을 감소시키지 않고 체계적 위험 등 전체 포트폴리오의 위험을 감소시키기 위하여 분 산투자를 할 수 있다."],"a":3,"e":"수익을 감소시키지 않고 비체계적 위험 등 전체 포트폴리오의 위험을 감소시키기 위하여 분산투자를 할 수 있다.","ep":[6]}];const SUBJECTS={"1":"펀드일반","2":"파생상품펀드","3":"부동산펀드"};
const S='fund-hackers-practice-01-v1',circ=['①','②','③','④'];
let A=Array(Q.length).fill(null),filter=0,wrong=false,unanswered=false,allExp=false,summaryOpen=false;
try{const saved=JSON.parse(localStorage.getItem(S)||'null');if(Array.isArray(saved))A=Q.map((_,i)=>Number.isInteger(saved[i])&&saved[i]>=0&&saved[i]<4?saved[i]:null)}catch(e){document.getElementById('storageStatus').textContent='저장된 기록을 읽지 못해 새 풀이를 시작합니다.'}
function save(){try{localStorage.setItem(S,JSON.stringify(A));document.getElementById('storageStatus').textContent=''}catch(e){document.getElementById('storageStatus').textContent='현재 브라우저에서 자동저장이 제한되어 있습니다. 이 창에서는 계속 풀 수 있습니다.'}}
function esc(text){return String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function questionText(text){
 const lines=text.split('\n');
 const bulletIndex=lines.findIndex(line=>line.trimStart().startsWith('•'));
 if(bulletIndex<0)return esc(text);
 return esc(lines.slice(0,bulletIndex).join('\n'))+`<span class="question-bullets">${esc(lines.slice(bulletIndex).join('\n'))}</span>`;
}
function context(q){
 if(q.data)return `<div class="question-data">${q.data.map((item,i)=>`<p>${'㉠㉡㉢㉣㉤㉥㉦'[i]} ${esc(item)}</p>`).join('')}</div>`;
 if(q.table){const [headers,values]=q.table;return `<div class="table-scroll question-table"><table aria-label="A펀드 성과지표"><tbody>${headers.map((x,i)=>`<tr><th scope="row">${esc(x)}</th><td>${esc(values[i])}</td></tr>`).join('')}</tbody></table></div>`}
 return '';
}
function explanation(q){
 const excerpt=q.image?`<img class="exp-image" loading="lazy" src="${esc(q.image)}" alt="절대적 위험과 상대적 위험의 측정 지표를 비교한 원본 표">`:'';
 return `<span class="exp-text">${esc(q.e)}</span>${excerpt}<br><span class="source">정답·해설 PDF ${q.ep.join('·')}쪽</span>`;
}
function render(){let shown=0;document.getElementById('questions').innerHTML=Q.map((q,i)=>{if(filter&&q.s!==filter)return '';const a=A[i],done=a!==null,ok=a===q.a;if(wrong&&(!done||ok))return '';if(unanswered&&done)return '';shown++;return `<article class="qcard ${done?'answered':''} ${done&&!ok?'wrong-answer':''}" id="q${i+1}"><div class="meta"><span>제${q.s}과목 · ${SUBJECTS[q.s]}</span><span>문제 PDF ${q.p}쪽</span></div><div class="q">Q${i+1}. ${questionText(q.q)}</div>${context(q)}<div class="opts">${q.o.map((x,j)=>`<button class="opt ${done&&j===q.a?'ok':''} ${done&&j===a&&!ok?'bad':''}" aria-pressed="${a===j}" onclick="pick(${i},${j})">${circ[j]} ${esc(x)}</button>`).join('')}</div><div class="exp ${done||allExp?'show':''}"><b>${done?(ok?'정답입니다.':'오답입니다.')+' ':''}정답 ${circ[q.a]} | 해설</b><br>${explanation(q)}</div></article>`}).join('')||'<div class="empty">해당 조건의 문제가 없습니다.</div>';document.getElementById('countline').textContent=`현재 ${shown}문항 표시 · ${filter?SUBJECTS[filter]:'전체 과목'}${wrong?' · 응답한 오답만':''}${unanswered?' · 미응답만':''}`;document.querySelectorAll('.filter').forEach((b,i)=>b.setAttribute('aria-pressed',String(filter===i)));document.getElementById('wrongbtn').setAttribute('aria-pressed',String(wrong));document.getElementById('unansweredbtn').setAttribute('aria-pressed',String(unanswered));document.getElementById('expbtn').setAttribute('aria-pressed',String(allExp));document.getElementById('expbtn').textContent=allExp?'해설 전체 접기':'해설 전체 펼치기';progress();if(summaryOpen)updateSummary()}
function pick(i,j){const x=window.scrollX,y=window.scrollY;A[i]=j;save();const c=document.getElementById('q'+(i+1)),q=Q[i];if(c){c.classList.add('answered');c.classList.toggle('wrong-answer',j!==q.a);c.querySelectorAll('.opt').forEach((b,n)=>{b.classList.toggle('ok',n===q.a);b.classList.toggle('bad',n===j&&j!==q.a);b.setAttribute('aria-pressed',String(n===j))});const e=c.querySelector('.exp');e.classList.add('show');e.innerHTML=`<b>${j===q.a?'✓ 정답입니다.':'✕ 오답입니다.'} 정답 ${circ[q.a]} | 해설</b><br>${explanation(q)}`;progress();if(summaryOpen)updateSummary()}else render();if(window.scrollY!==y)window.scrollTo({left:x,top:y,behavior:'instant'});requestAnimationFrame(()=>{if(window.scrollY!==y)window.scrollTo({left:x,top:y,behavior:'instant'})})}
function progress(){[0,1,2,3].forEach(s=>{const idx=Q.map((q,i)=>i).filter(i=>!s||Q[i].s===s);const done=idx.filter(i=>A[i]!==null).length,ok=idx.filter(i=>A[i]===Q[i].a).length;document.getElementById('t'+s).textContent=`${done}/${idx.length} · 정답 ${ok}`;document.getElementById('b'+s).style.width=done/idx.length*100+'%';document.getElementById('progress'+s).setAttribute('aria-valuenow',String(Math.round(done/idx.length*100)))})}
function setf(s){filter=s;render()}
function toggleWrong(){wrong=!wrong;unanswered=false;render()}
function toggleUnanswered(){unanswered=!unanswered;wrong=false;render()}
function toggleExp(){allExp=!allExp;render()}
function updateSummary(){let rows='';[0,1,2,3].forEach(s=>{const idx=Q.map((q,i)=>i).filter(i=>!s||Q[i].s===s),done=idx.filter(i=>A[i]!==null).length,ok=idx.filter(i=>A[i]===Q[i].a).length;rows+=`<tr><th>${s?SUBJECTS[s]:'전체'}</th><td>${ok}/${idx.length}</td><td>${done-ok}</td><td>${idx.length-done}</td><td>${done?(ok/done*100).toFixed(1)+'%':'—'}</td></tr>`});document.getElementById('summary').innerHTML=`<h2>채점 요약 · 총 ${Q.filter((q,i)=>A[i]===q.a).length}/100점</h2><div class="table-scroll"><table><thead><tr><th>과목</th><th>정답/전체</th><th>오답</th><th>미응답</th><th>응답 정답률</th></tr></thead><tbody>${rows}</tbody></table></div><p class="meta">각 1점 · 미응답은 총점에 가산하지 않습니다. 학습용 점수이며 공식 합격판정이 아닙니다.</p>`}
function grade(){summaryOpen=true;updateSummary();const el=document.getElementById('summary');el.hidden=false;el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}
function resetAll(){if(!confirm('100문항의 풀이기록을 모두 초기화할까요?'))return;A=Array(Q.length).fill(null);wrong=false;unanswered=false;allExp=false;summaryOpen=false;document.getElementById('summary').hidden=true;save();render()}
window.addEventListener('beforeprint',()=>{window._printState={filter,wrong,unanswered,allExp};filter=0;wrong=false;unanswered=false;allExp=true;render()});window.addEventListener('afterprint',()=>{if(!window._printState)return;({filter,wrong,unanswered,allExp}=window._printState);delete window._printState;render()});
render();
</script><script>
const requestedSubject=Number(new URLSearchParams(location.search).get('subject'));
if(Number.isInteger(requestedSubject)&&requestedSubject>=0&&requestedSubject<=3)setf(requestedSubject);
</script><script>(function(){var b=document.getElementById('study-theme-toggle');if(!b)return;function sync(){var d=document.documentElement.dataset.theme==='dark';b.textContent=d?'라이트모드':'다크모드';b.setAttribute('aria-pressed',String(d))}b.addEventListener('click',function(){var t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('fund-study-theme-v1',t)}catch(e){}sync()});sync()})()</script></body></html>
