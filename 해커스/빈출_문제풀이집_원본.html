<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>펀드자문 빈출 문제풀이집 · 원본 지면</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18273b;font:16px/1.65 system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:1040px;margin:auto;padding:26px 18px 70px}a{color:#0759aa}h1{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.25;margin:.4em 0}h2{margin:28px 0 12px;font-size:1.28rem}p{margin:.5em 0}.intro{color:#52667a}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.toolbar button,.toolbar select,input{font:inherit;padding:9px 13px;border:1px solid #b9c8d9;border-radius:9px;background:white;color:#213650}.toolbar button{cursor:pointer}.toolbar button.active{background:#145dab;color:white;border-color:#145dab}input{width:min(100%,500px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px}.term{background:white;border:1px solid #d6e0eb;border-radius:12px;padding:15px}.term h3{margin:0 0 6px;color:#174e84;font-size:1.02rem}.term p{margin:0}.sub{font-size:.82rem;color:#62758a}.notice{border-left:4px solid #4382c2;padding:10px 14px;background:#e8f2fc}.pageimg{display:block;width:100%;height:auto;background:white;border:1px solid #d5dfeb}.pagewrap{max-width:850px;margin:auto;overflow:auto}.pagewrap .pageimg{max-width:none}.pages{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pages button{min-width:80px}.pages select{max-width:180px}.muted{font-size:.9rem;color:#52667a}@media(prefers-color-scheme:dark){body{background:#101a28;color:#e6eef7}.term{background:#19283a;border-color:#374d64}.term h3{color:#abd5ff}.intro,.sub,.muted{color:#bacbdc}.notice{background:#203650}a{color:#9bc9ff}}</style></head><body><main><a href="../index.html">← 전체 목차</a><h1>빈출 문제풀이집 원본 지면</h1><p class="intro">공식과 예제, 정답·해설을 원본 순서대로 확인하세요.</p><p class="notice">이 자료는 문제와 정답·해설이 같은 지면에 있습니다. <a href="빈출_문제풀이집.html">원본 문항 풀기 →</a> · <a href="../펀드자문_모의고사(빈출)01.html">재구성한 빈출 모의고사 100문항 풀기 →</a></p><div class="toolbar pages"><button id="previous">이전</button><label for="page">페이지</label><select id="page"><option value="1">1쪽</option><option value="2">2쪽</option><option value="3">3쪽</option><option value="4">4쪽</option><option value="5">5쪽</option><option value="6">6쪽</option><option value="7">7쪽</option><option value="8">8쪽</option><option value="9">9쪽</option><option value="10">10쪽</option><option value="11">11쪽</option><option value="12">12쪽</option><option value="13">13쪽</option><option value="14">14쪽</option><option value="15">15쪽</option><option value="16">16쪽</option><option value="17">17쪽</option><option value="18">18쪽</option><option value="19">19쪽</option><option value="20">20쪽</option><option value="21">21쪽</option><option value="22">22쪽</option><option value="23">23쪽</option><option value="24">24쪽</option><option value="25">25쪽</option><option value="26">26쪽</option><option value="27">27쪽</option></select><button id="next">다음</button><label for="zoom">확대</label><select id="zoom"><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option><option value="250">250%</option><option value="300">300%</option></select><span id="status" aria-live="polite"></span></div><p class="muted">확대 후 화면을 좌우로 움직여 읽을 수 있습니다.</p><div class="pagewrap"><img id="sheet" class="pageimg" alt="빈출 문제풀이집 1쪽" width="1043" height="1473"></div></main><script>const select=document.querySelector('#page'),sheet=document.querySelector('#sheet'),previous=document.querySelector('#previous'),next=document.querySelector('#next');function render(){const n=Number(select.value);sheet.src=`assets/빈출_문제풀이집/${String(n).padStart(2,'0')}.webp`;sheet.alt=`빈출 문제풀이집 ${n}쪽 원본`;document.querySelector('#status').textContent=`${n} / 27쪽`;previous.disabled=n===1;next.disabled=n===27;history.replaceState(null,'',`#page=${n}`)}function change(offset){select.value=String(Number(select.value)+offset);render();window.scrollTo({top:0,behavior:'smooth'})}select.addEventListener('change',render);previous.addEventListener('click',()=>change(-1));next.addEventListener('click',()=>change(1));const zoom=document.querySelector('#zoom');function applyZoom(){sheet.style.width=zoom.value+'%'}zoom.value=matchMedia('(max-width:700px)').matches?'200':'100';zoom.addEventListener('change',applyZoom);applyZoom();const match=location.hash.match(/^#page=(\d+)$/);if(match&&Number(match[1])>=1&&Number(match[1])<=27)select.value=match[1];render()</script></body></html>
