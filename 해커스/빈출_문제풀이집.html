{"s": 1, "p": 8, "label": "05/06-3", "q": "3년 만기, 연 8%, 듀레이션 3인 채권수익률이 오늘 7.2%에서 7.7%로 상승하였을 경우, 듀레이션으로 계산하면 채권가격은 몇 % 하락할까?", "o": ["0.5%", "0.7%", "1.3%", "1.5%"], "a": 3, "e": "채권가격변동률 = −3 × 0.005 + 0 × (0.005)² = −0.015. 따라서 1.5% 하락한다.", "ep": [8]},
{"s": 1, "p": 8, "label": "05/06-4", "q": "듀레이션 3, 컨벡시티 50인 은행채의 경우, 채권수익률이 4% 상승하면 채권가격변동률은 어떠한가?", "o": ["2.2% 상승", "4% 하락", "2.2% 하락", "4% 상승"], "a": 1, "e": "원본 예제의 계산: 채권가격변동률 = −3 × 0.04 + 50 × (0.04)² = −0.12 + 0.08 = −0.04. 따라서 4% 하락한다.", "ep": [8], "note": "원본 예제의 정답과 계산을 표시했습니다. 예제 해설은 컨벡시티 항의 ½을 생략하고 계산하며, 같은 쪽의 공식 상자에는 ½이 표기되어 있습니다."},
{"s": 1, "p": 9, "label": "07-1", "q": "만기가 3년 10일 남은 연단위 복리채권의 만기상환금액이 12,000원이다. 이 때 시장수익률 8%로 매매하면 채권가격은 얼마인가? (단, 소수점 첫째 자리에서 반올림함)", "o": ["7,605원", "7,970원", "9,505원", "9,715원"], "a": 2, "e": "채권가격(PV) = FV ÷ [(1 + r)ⁿ × (1 + r × d ÷ 365)]\n= 12,000 ÷ [(1 + 0.08)³ × (1 + 0.08 × 10 ÷ 365)] ≈ 9,505원", "ep": [9]},
{"s": 1, "p": 9, "label": "07-2", "q": "만기가 2년 15일 남은 연단위 복리채권의 만기상환금액이 11,000원이다. 이 때 시장수익률 5%로 매매하면 채권가격은 얼마인가? (단, 소수점 첫째 자리에서 반올림함)", "o": ["8,557원", "8,751원", "9,957원", "11,247원"], "a": 2, "e": "채권가격(PV) = 11,000 ÷ [(1 + 0.05)² × (1 + 0.05 × 15 ÷ 365)] ≈ 9,957원", "ep": [9]},
{"s": 1, "p": 9, "label": "08-1", "q": "채권투자수익을 이자수익과 자본손익으로 나누고, 3년 만기 은행채를 7.5%에 매입하여 1년간 보유한 후, 6%에 매도할 때의 투자수익률을 계산한 것은? (매도 시의 듀레이션은 2로 가정함)", "o": ["9.0%", "9.5%", "10.0%", "10.5%"], "a": 3, "e": "이자수익 = 매입금리 = 7.5%\n자본손익 = −매도 시 듀레이션 × 금리변동 × 연율화 = −2 × (6% − 7.5%) × 1\n채권투자수익률 = 7.5% + 3% = 연 10.5%", "ep": [9]},
{"s": 1, "p": 10, "label": "08-2", "q": "채권투자수익을 이자수익과 자본손익으로 나누고, 2년 만기 은행채를 4.5%에 매입하여 1년간 보유한 후, 6%에 매도할 때의 투자수익률을 계산한 것은? (매도 시의 듀레이션은 1로 가정함)", "o": ["1.5%", "2.0%", "2.5%", "3.0%"], "a": 3, "e": "이자수익 = 매입금리 = 4.5%\n자본손익 = −매도 시 듀레이션 × 금리변동 × 연율화 = −1 × (6% − 4.5%) × 1\n채권투자수익률 = 4.5% − 1.5% = 연 3.0%", "ep": [10]},
{"s": 1, "p": 10, "label": "08-3", "q": "채권투자수익을 이자수익과 자본손익으로 나누고, 2년 만기 은행채를 3%에 매입하여 1년간 보유한 후, 2%에 매도할 때의 투자수익률을 계산한 것은? (매도 시의 듀레이션은 1로 가정함)", "o": ["2.0%", "3.5%", "4.0%", "5.5%"], "a": 2, "e": "이자수익 = 매입금리 = 3%\n자본손익 = −매도 시 듀레이션 × 금리변동 × 연율화 = −1 × (2% − 3%) × 1\n채권투자수익률 = 3% + 1% = 연 4.0%", "ep": [10]},
{"s": 1, "p": 10, "label": "08-4", "q": "채권투자수익은 이자수익과 자본손익으로 구성되고, 이자수익은 매입금리, 자본손익은 듀레이션을 활용하여 계산한다고 가정한다. 2년 만기 은행채(복리채)를 9%에 매입하여 1년간 보유한 후, 6.5%에 매도할 때의 투자수익률은 얼마인가?", "o": ["연 10%", "연 10.5%", "연 11%", "연 11.5%"], "a": 3, "e": "이자수익 = 매입금리 = 9%\n원본 해설에서 매도 시 듀레이션을 1로 적용한다. 자본손익 = −1 × (6.5% − 9%) × 1\n채권투자수익률 = 9% + 2.5% = 연 11.5%", "ep": [10]},
{"s": 1, "p": 10, "label": "08-5", "q": "채권투자수익은 이자수익과 자본손익으로 구성되고, 이자수익은 매입금리, 자본손익은 듀레이션을 활용하여 계산한다고 가정한다. 2년 만기 은행채(복리채)를 4%에 매입하여 1년간 보유한 후, 3%에 매도할 때의 투자수익률은 얼마인가?", "o": ["연 4%", "연 5%", "연 6%", "연 7%"], "a": 1, "e": "이자수익 = 매입금리 = 4%\n원본 해설에서 매도 시 듀레이션을 1로 적용한다. 자본손익 = −1 × (3% − 4%) × 1\n채권투자수익률 = 4% + 1% = 연 5%", "ep": [10]},
{"s": 1, "p": 11, "label": "09-1", "q": "다음에 주어진 근거로 산출한 A기업의 주가수익비율(PER)은?\n• 주가 20,000원\n• 당기순이익 5억원\n• 배당금 3억원\n• 발행주식 2,000,000주", "o": ["80", "90", "100", "110"], "a": 0, "e": "주당순이익 = 당기순이익 ÷ 발행주식 수 = 500,000,000 ÷ 2,000,000 = 250원\nPER = 주가 ÷ 주당순이익 = 20,000 ÷ 250 = 80", "ep": [11]},
{"s": 1, "p": 11, "label": "09-2", "q": "A기업의 주가수익비율이 20이며 주당순이익이 7,000원일 때, A기업의 주가는 얼마인가?", "o": ["20,000원", "50,000원", "100,000원", "140,000원"], "a": 3, "e": "PER = 주가 ÷ 주당순이익\n주가 = 주당순이익 × PER = 7,000 × 20 = 140,000원", "ep": [11]},
{"s": 1, "p": 12, "label": "10-1", "q": "다음 중 PBR을 추정하는 방법으로 틀린 것은?", "o": ["PBR = 주가 ÷ 주당순자산", "PBR = 마진 × 활동성 × 부채레버리지 × 이익승수", "PBR = 자기자본장부가액 × 주가수익비율(P/E)", "PBR = (순이익 ÷ 자기자본장부가액) × (자기자본시장가격 ÷ 순이익)"], "a": 2, "e": "PBR = 자기자본이익률 × 주가수익비율(P/E)", "ep": [12]},
{"s": 1, "p": 12, "label": "10-2", "q": "다음에 주어진 근거로 산출한 A기업의 주가순자산비율(PBR)은?\n• 주가 3,200원\n• 발행주식 500,000주\n• 총자산 800,000,000원\n• 총부채 480,000,000원", "o": ["4.5", "5", "5.5", "6"], "a": 1, "e": "순자산 = 800,000,000 − 480,000,000 = 320,000,000원\n주당순자산 = 320,000,000 ÷ 500,000 = 640원\nPBR = 3,200 ÷ 640 = 5", "ep": [12]},
{"s": 1, "p": 13, "label": "11-1", "q": "A기업의 주가매출액비율이 15이며 주당매출액이 9,000원일 때, A기업의 주가는 얼마인가?", "o": ["120,000원", "125,000원", "130,000원", "135,000원"], "a": 3, "e": "PSR = 주가 ÷ 주당매출액\n주가 = 15 × 9,000 = 135,000원", "ep": [13]},
{"s": 1, "p": 13, "label": "11-2", "q": "A기업의 주가매출액비율이 50이며 주가가 60,000원일 때, A기업의 주당매출액은 얼마인가?", "o": ["500원", "1,000원", "1,200원", "1,500원"], "a": 2, "e": "PSR = 주가 ÷ 주당매출액\n주당매출액 = 60,000 ÷ 50 = 1,200원", "ep": [13]},
{"s": 1, "p": 14, "label": "12-1", "q": "다음 중 기업가치분석방법 중 주가배수를 활용한 상대가치평가방법으로 이자, 세금, 감가상각비 차감 전 이익으로 기업가치를 나누는 평가모형은 무엇인가?", "o": ["PER평가모형", "PBR평가모형", "EBITDA/EV모형", "EV/EBITDA모형"], "a": 3, "e": "EV/EBITDA = 기업가치 ÷ 이자, 세금, 감가상각비 차감 전 이익\nEV/EBITDA 모형은 현금흐름의 크기를 중시하는 기업가치 측정 방법이다.", "ep": [14]},
{"s": 1, "p": 14, "label": "12-2", "q": "(　) 안에 들어갈 표현으로 올바른 것은?\nEV/EBITDA모형은 주가배수를 활용한 상대가치 평가방법 중 현금흐름을 중시한 기업가치측정방법으로 기업가치를 (　)으로/로 나눈 것이다.", "o": ["이자, 세금, 감가상각비 차감 전 이익", "이자, 세금, 감가상각비 차감 후 이익", "기업의 주식가치", "기업의 매출액"], "a": 0, "e": "EV/EBITDA = 기업가치 ÷ 이자, 세금, 감가상각비 차감 전 이익", "ep": [14]},
{"s": 1, "p": 15, "label": "13-1", "q": "샤프비율에 의하여 평가하였을 때, 다음 중 위험 1단위당 성과가 가장 높은 펀드는 무엇인가? (단, 무위험률은 4%이며 펀드의 유형 등 다른 조건은 동일하다고 가정함)", "o": ["A펀드", "B펀드", "C펀드", "D펀드"], "a": 2, "e": "샤프비율 = (포트폴리오 평균수익률 − 무위험 평균이자율) ÷ 포트폴리오 수익률의 표준편차\nA펀드 1.6, B펀드 1.0, C펀드 2.0, D펀드 약 1.73. C펀드가 가장 높다.", "ep": [15], "table": [["구분", "A펀드", "B펀드", "C펀드", "D펀드"], ["평균수익률", "12%", "15%", "16%", "30%"], ["표준편차", "5%", "11%", "6%", "15%"]]},
{"s": 1, "p": 15, "label": "13-2", "q": "샤프비율에 의하여 평가하였을 때, 다음 중 위험 1단위당 성과가 가장 높은 펀드는 무엇인가? (단, 무위험률은 7%이며 펀드의 유형 등 다른 조건은 동일하다고 가정함)", "o": ["A펀드", "B펀드", "C펀드", "D펀드"], "a": 0, "e": "샤프비율 = (포트폴리오 평균수익률 − 무위험 평균이자율) ÷ 포트폴리오 수익률의 표준편차\nA펀드 3.25, B펀드 약 2.33, C펀드 3, D펀드 2. A펀드가 가장 높다.", "ep": [15], "table": [["구분", "A펀드", "B펀드", "C펀드", "D펀드"], ["평균수익률", "20%", "21%", "16%", "29%"], ["표준편차", "4%", "6%", "3%", "11%"]]},
{"s": 1, "p": 16, "label": "14-1", "q": "A펀드의 위험조정성과가 다음과 같을 때, A펀드의 젠센의 알파는 얼마인가?", "o": ["1.4", "3.4", "5.4", "7.4"], "a": 0, "e": "젠센의 알파 = (펀드수익률 − 무위험수익률) − 펀드 베타 × (시장수익률 − 무위험수익률)\n= (12% − 5%) − 1.4 × (9% − 5%) = 1.4%", "ep": [16], "table": [["베타", "펀드수익률", "무위험수익률", "시장수익률"], ["1.4", "12%", "5%", "9%"]]},
{"s": 1, "p": 16, "label": "14-2", "q": "A펀드의 위험조정성과지표가 다음과 같을 때, A펀드의 수익률은?", "o": ["19%", "22.5%", "24%", "27.3%"], "a": 3, "e": "젠센의 알파 = (펀드수익률 − 무위험수익률) − 펀드 베타 × (시장수익률 − 무위험수익률)\n8% = (펀드수익률 − 4%) − 1.7 × (13% − 4%)\n펀드수익률 = 8% + 1.7 × 9% + 4% = 27.3%", "ep": [16], "table": [["베타", "젠센의 알파", "무위험수익률", "시장수익률"], ["1.7", "8%", "4%", "13%"]]},
{"s": 1, "p": 16, "label": "14-3", "q": "다음 중 젠센의 알파가 가장 큰 펀드는 무엇인가? (단, 다른 조건은 모두 동일하다고 가정함)", "o": ["A펀드", "B펀드", "C펀드", "D펀드"], "a": 0, "e": "젠센의 알파 = (펀드수익률 − 무위험수익률) − 펀드 베타 × (시장수익률 − 무위험수익률)\nA펀드: (9% − 4%) − 1.2 × (5% − 4%) = 3.8%\nB펀드: (7% − 3%) − 0.7 × (4% − 3%) = 3.3%\nC펀드: (5% − 4%) − 0.8 × (5% − 4%) = 0.2%\nD펀드: (11% − 5%) − 1.3 × (7% − 5%) = 3.4%\nA펀드가 가장 높다.", "ep": [16, 17], "table": [["구분", "A펀드", "B펀드", "C펀드", "D펀드"], ["펀드수익률", "9%", "7%", "5%", "11%"], ["무위험수익률", "4%", "3%", "4%", "5%"], ["베타", "1.2", "0.7", "0.8", "1.3"], ["시장수익률", "5%", "4%", "5%", "7%"]]},
{"s": 1, "p": 17, "label": "14-4", "q": "다음 중 젠센의 알파가 가장 큰 펀드는 무엇인가? (단, 다른 조건은 모두 동일하다고 가정함)", "o": ["A펀드", "B펀드", "C펀드", "D펀드"], "a": 3, "e": "젠센의 알파 = (펀드수익률 − 무위험수익률) − 펀드 베타 × (시장수익률 − 무위험수익률)\nA펀드: (11% − 4%) − 1.2 × (6% − 4%) = 4.6%\nB펀드: (9% − 6%) − 0.9 × (8% − 6%) = 1.2%\nC펀드: (11% − 4%) − 1.3 × (8% − 4%) = 1.8%\nD펀드: (13% − 6%) − 0.7 × (7% − 6%) = 6.3%\nD펀드가 가장 높다.", "ep": [17], "table": [["구분", "A펀드", "B펀드", "C펀드", "D펀드"], ["펀드수익률", "11%", "9%", "11%", "13%"], ["무위험수익률", "4%", "6%", "4%", "6%"], ["베타", "1.2", "0.9", "1.3", "0.7"], ["시장수익률", "6%", "8%", "8%", "7%"]]},
{"s": 2, "p": 18, "label": "추가문제 1", "q": "파생상품매매에 따른 위험평가액 산정방법에 대한 설명으로 적절하지 않은 것은?", "o": ["선물: 선물가격 × 계약수 × 승수", "옵션매수: 기초자산 가격 × 계약수 × 승수 × 델타", "옵션매도: 델타위험액 + 감마위험액 + 베가위험액", "장외파생상품거래: 만기 시 지급할 금전총액"], "a": 3, "e": "장외파생상품거래는 명목원금으로 위험평가액을 산정한다.", "ep": [18]},
{"s": 2, "p": 18, "label": "추가문제 2", "q": "파생상품거래에 따른 위험평가액 산정방법에 대한 설명으로 적절하지 않은 것은?", "o": ["옵션매도: 델타위험액", "금전교환 및 기초자산교환을 하기로 한 거래: 기초자산 가격 + 만기 시 지급할 금전총액", "옵션매수: 기초자산 가격 × 계약수 × 승수 × 델타", "통화스왑: 지급하기로 한 통화의 명목원금"], "a": 0, "e": "옵션매도의 위험평가액 = 델타위험액 + 감마위험액 + 베가위험액", "ep": [18]},
{"s": 2, "p": 19, "label": "추가문제 1", "q": "포트폴리오 보험형 펀드와 관련한 지표가 아래와 같다면 노출치는 얼마인가?\n• 포트폴리오 현재가치: 500\n• 보장치: 300\n• 승수: 2", "o": ["250", "300", "350", "400"], "a": 3, "e": "완충치 = 포트폴리오 현재가치 − 보장치 = 500 − 300 = 200\n노출치(위험자산 투자금액) = 완충치 × 승수 = 200 × 2 = 400", "ep": [19]},
{"s": 2, "p": 19, "label": "추가문제 2", "q": "일정비율 보험전략(CPPI)에 따라 현재가치 400억원, 보장치 257억원, 승수 3일 때 노출치는 얼마인가?", "o": ["428", "429", "430", "431"], "a": 1, "e": "완충치 = 400 − 257 = 143억원\n노출치 = 143억원 × 3 = 429억원", "ep": [19]},
{"s": 2, "p": 19, "label": "추가문제 3", "q": "다음 중 포트폴리오 보험과 관련된 용어에 대한 설명으로 거리가 먼 것은?", "o": ["완충치(Cushion): 포트폴리오의 현재가치 − 노출치", "보장치(Floor): 포트폴리오의 최저가치", "노출치(Exposure): 위험자산 투자금액 = 완충치 × 승수", "승수: 위험자산 투자를 위한 배수"], "a": 0, "e": "완충치(Cushion) = 포트폴리오의 현재가치 − 보장치", "ep": [19]},
{"s": 2, "p": 20, "label": "합병차익거래 1", "q": "최근 A기업은 B기업을 인수하기로 하면서 B기업 주주에게 1주당 A기업 주식의 0.5주를 주겠다고 합병계획을 발표하였다. 현재 시장에서 A기업의 주식은 6만원에 거래되고 있고, B기업의 주식은 2만 7천원에 거래되고 있다. 이 경우 합병차익거래를 통해 얻는 B기업 주식의 1주당 이익금은 얼마인가?", "o": ["1,000원", "2,000원", "3,000원", "4,000원"], "a": 2, "e": "교환비율 A기업:B기업 = 2:1이므로 B기업 주식의 적정가격은 60,000 × 0.5 = 30,000원이다. 주당 차익 = 30,000 − 27,000 = 3,000원", "ep": [20]},
{"s": 2, "p": 20, "label": "선물거래 증거금 1", "q": "선물거래 개시증거금 500만원, 유지증거금 300만원, 일일정산 후 증거금 270만원일 때, 추가증거금은 얼마인가?", "o": ["170만원", "190만원", "210만원", "230만원"], "a": 3, "e": "유지증거금에 미달했으므로 개시증거금 수준까지 납부한다.\n추가증거금 = 500만원 − 270만원 = 230만원", "ep": [20]},
{"s": 2, "p": 20, "label": "선물거래 증거금 2", "q": "일일정산을 실시하는 과정에서 A는 유지증거금이 부족하여 마진콜되었다. 다음과 같은 거래에서 A가 추가적으로 납부해야 하는 증거금은 얼마인가?\n• 액면금액 = 1,100원/달러 × 1만 달러(1계약) = 1,100만원\n• 개시증거금 = 1,100만원 × 4.5% = 49만 5천원\n• 유지증거금 = 1,100만원 × 3% = 33만원\n• 마진콜 당시 유지증거금 = 17만원", "o": ["27만원", "30만 5천원", "32만 5천원", "34만원"], "a": 2, "e": "유지증거금에 미달했으므로 개시증거금 수준까지 납부한다.\n추가증거금 = 49만 5천원 − 17만원 = 32만 5천원", "ep": [20]},
{"s": 2, "p": 21, "label": "15-1", "q": "KOSPI200 주가지수가 300포인트, KOSPI200 주가지수선물의 균형가격이 306, 연 이자율은 7%, 배당수익률은 4%일 때 잔존만기는 얼마인가? (개월로 구하시오)", "o": ["약 7개월", "약 8개월", "약 9개월", "약 10개월"], "a": 1, "e": "선물의 균형가격 F = 현물가격 S × [1 + (이자율 r − 배당수익률 d) × 잔존만기(년)]\n306 = 300 × [1 + (0.07 − 0.04) × (잔존일수 ÷ 365)]\n잔존일수 ≈ 243.33일이므로 잔존만기는 약 8개월이다.", "ep": [21]},
{"s": 2, "p": 21, "label": "15-2", "q": "KOSPI200 주가지수가 500포인트, 연 이자율은 6%, 배당수익률은 3%일 때 잔존만기가 6개월인 KOSPI200 주가지수선물의 균형가격은 얼마인가?", "o": ["507", "507.5", "508", "508.5"], "a": 1, "e": "선물의 균형가격 F = 현물가격 S × [1 + (이자율 r − 배당수익률 d) × 잔존만기(년)]\nF = 500 × [1 + (0.06 − 0.03) × 6 ÷ 12] = 507.5", "ep": [21]},
{"s": 2, "p": 22, "label": "추가문제 1", "q": "베이시스란 임의의 거래일에 있어서 현물가격과 선물가격의 차이를 의미한다. 이 때 백워데이션 상태인 경우는?", "o": ["이자율 7% · 주가지수배당률 4%", "이자율 5% · 주가지수배당률 2%", "이자율 3% · 주가지수배당률 3%", "이자율 2% · 주가지수배당률 4%"], "a": 3, "e": "선물의 균형가격 F = 현물가격 S × [1 + (이자율 r − 배당수익률 d) × 잔존만기(년)]\n백워데이션은 선물가격이 현물가격보다 낮은 상태이다. r − d \u003c 0인 ④가 해당한다.", "ep": [22]},
{"s": 2, "p": 22, "label": "추가문제 2", "q": "원-달러 현물환율이 1달러당 1,400원이고 원화 1년 이자율과 달러화 1년 이자율이 각각 4%, 2%일 때 이자율등가식에 따른 1년 후 선물환율의 균형가격은 얼마인가?", "o": ["1,413원", "1,420원", "1,428원", "1,442원"], "a": 2, "e": "원본의 단리근사식: F = S × [1 + (원화이자율 − 달러이자율) × 잔존일수 ÷ 365]\nF = 1,400 × [1 + (0.04 − 0.02)] = 1,428원", "ep": [22]},
{"s": 2, "p": 22, "label": "추가문제 3", "q": "KOSPI200 현물주가지수가 150포인트이고 연 이자율은 5%, 배당률은 연 1%일 때, 3개월 만기 선물의 균형가격은 얼마인가?", "o": ["150", "150.5", "151", "151.5"], "a": 3, "e": "선물의 균형가격 F = 현물가격 S × [1 + (이자율 r − 배당수익률 d) × 잔존만기(년)]\nF = 150 × [1 + (0.05 − 0.01) × 3 ÷ 12] = 151.5", "ep": [22]},
{"s": 2, "p": 23, "label": "헤지 1", "q": "시가가 300억원인 A주식포트폴리오 포지션의 가치가 하락할 것을 염려한 투자자가 이 포지션을 정리하는 대신에 KOSPI200 주가지수선물을 이용하여 헤지하기로 하였다. KOSPI200 주가지수선물로 주식포트폴리오를 완전히 헤지할 수 있는 경우는? (KOSPI200에 대한 베타는 2이고, 선물의 현재가격은 100포인트, 포인트당 승수는 25만원임)", "o": ["선물 1,200계약 매도", "선물 1,200계약 매수", "선물 2,400계약 매도", "선물 2,400계약 매수"], "a": 2, "e": "현물포지션과 선물포지션 액면가의 단순비율 = 300억원 ÷ (25만원 × 100포인트) = 1,200계약\n1,200계약 × 베타 2 = 2,400계약을 매도한다.", "ep": [23]},
{"s": 2, "p": 23, "label": "금리스왑의 결제 1", "q": "금리스왑의 원금이 3,000만 달러이고 결제주기는 6개월이다. 스왑고정금리는 4%이고 변동금리가 8%가 되었다면 고정금리 수취자가 수취 혹은 지급하게 되는 액수는 얼마인가?", "o": ["30만 달러 지급", "30만 달러 수취", "60만 달러 지급", "60만 달러 수취"], "a": 2, "e": "3,000만 달러 × (0.08 − 0.04) × 6 ÷ 12 = 60만 달러\n고정금리 수취자는 변동금리 지급액이 더 크므로 차액을 지급한다.", "ep": [23]},
{"s": 2, "p": 23, "label": "금리스왑의 결제 2", "q": "어떤 금리스왑에 대하여 원금 1,500만 달러, 지급주기 4개월, 만기 3년, 고정금리는 6%이다. 만일 스왑 시작시점의 LIBOR금리가 9%, 6개월 후 LIBOR금리가 8%라면 고정금리 수취자가 금리스왑 시작시점 후 6개월이 지난 시점에서 지급해야 할 금액은 얼마인가?", "o": ["10만 달러", "15만 달러", "20만 달러", "25만 달러"], "a": 1, "e": "원본 해설은 시작시점 금리 9%와 지급주기 4개월을 적용한다.\n1,500만 달러 × (0.09 − 0.06) × 4 ÷ 12 = 15만 달러", "ep": [23], "note": "원본 문항의 지급주기(4개월)와 질문의 시점(6개월)이 서로 다릅니다. 채점은 PDF의 정답을 따릅니다."},
{"s": 2, "p": 24, "label": "추가문제 1", "q": "A는 차주 B에게 500만 달러를 빌려주고, B의 부도위험을 헤지하기 위해 보장매도자 C와 신용부도스왑(CDS)을 체결하였다. 채권발행자인 B가 파산할 경우 회수율이 15%라고 할 때, 보장매도자 C의 지급 의무액은 얼마인가?", "o": ["425만 달러", "430만 달러", "435만 달러", "440만 달러"], "a": 0, "e": "회수가치 = 500만 달러 × 15% = 75만 달러\nC의 지급 의무액 = 500만 달러 − 75만 달러 = 425만 달러", "ep": [24]},
{"s": 3, "p": 25, "label": "16-1", "q": "A아파트의 가격이 15% 상승하면서 A아파트에 대한 수요가 30% 하락하였다면, A아파트에 대한 수요의 가격탄력성은 얼마인가?", "o": ["1.0", "2.0", "3.0", "4.0"], "a": 1, "e": "원본은 수요의 가격탄력성을 절댓값으로 계산한다. 30 ÷ 15 = 2.0", "ep": [25]},

];const SUBJECTS={"1":"펀드일반","2":"파생상품펀드","3":"부동산펀드"};
const S='fund-hackers-source-book-v1',circ=['①','②','③','④'];
let A=Array(Q.length).fill(null),filter=0,wrong=false,unanswered=false,allExp=false,summaryOpen=false;
try{const saved=JSON.parse(localStorage.getItem(S)||'null');if(Array.isArray(saved))A=Q.map((_,i)=>Number.isInteger(saved[i])&&saved[i]>=0&&saved[i]<4?saved[i]:null)}catch(e){document.getElementById('storageStatus').textContent='저장된 기록을 읽지 못해 새 풀이를 시작합니다.'}
function save(){try{localStorage.setItem(S,JSON.stringify(A));document.getElementById('storageStatus').textContent=''}catch(e){document.getElementById('storageStatus').textContent='현재 브라우저에서 자동저장이 제한되어 있습니다. 이 창에서는 계속 풀 수 있습니다.'}}
function esc(text){return String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function questionText(text){
 const lines=text.split('\n');
 const bulletIndex=lines.findIndex(line=>line.trimStart().startsWith('•'));
 if(bulletIndex<0)return esc(text);
 return esc(lines.slice(0,bulletIndex).join('\n'))+`<span class="question-bullets">${esc(lines.slice(bulletIndex).join('\n'))}</span>`;
}
function context(q){
 if(!q.table)return '';
 const [headers,...rows]=q.table;
 const headings=headers.map(cell=>`<th scope="col">${esc(cell)}</th>`).join('');
 const body=rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('');
 return `<div class="table-scroll source-table"><table aria-label="문제에 주어진 자료"><thead><tr>${headings}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function explanation(q){
 const note=q.note?`<p class="source-note">${esc(q.note)}</p>`:'';
 const pages=q.ep.map(page=>`<a href="빈출_문제풀이집_원본.html#page=${page}">${page}쪽</a>`).join(' · ');
 return `<span class="exp-text">${esc(q.e)}</span>${note}<br><span class="source">원본 해설 ${pages}</span>`;
}
function render(){let shown=0;document.getElementById('questions').innerHTML=Q.map((q,i)=>{if(filter&&q.s!==filter)return '';const a=A[i],done=a!==null,ok=a===q.a;if(wrong&&(!done||ok))return '';if(unanswered&&done)return '';shown++;return `<article class="qcard ${done?'answered':''} ${done&&!ok?'wrong-answer':''}" id="q${i+1}"><div class="meta"><span>제${q.s}과목 · ${SUBJECTS[q.s]}</span><a class="source" href="빈출_문제풀이집_원본.html#page=${q.p}">PDF ${q.p}쪽 · ${esc(q.label)}</a></div><div class="q">Q${i+1}. ${questionText(q.q)}</div>${context(q)}<div class="opts">${q.o.map((x,j)=>`<button class="opt ${done&&j===q.a?'ok':''} ${done&&j===a&&!ok?'bad':''}" aria-pressed="${a===j}" onclick="pick(${i},${j})">${circ[j]} ${esc(x)}</button>`).join('')}</div><div class="exp ${done||allExp?'show':''}"><b>${done?(ok?'정답입니다.':'오답입니다.')+' ':''}정답 ${circ[q.a]} | 해설</b><br>${explanation(q)}</div></article>`}).join('')||'<div class="empty">해당 조건의 문제가 없습니다.</div>';document.getElementById('countline').textContent=`현재 ${shown}문항 표시 · ${filter?SUBJECTS[filter]:'전체 과목'}${wrong?' · 응답한 오답만':''}${unanswered?' · 미응답만':''}`;document.querySelectorAll('.filter').forEach((b,i)=>b.setAttribute('aria-pressed',String(filter===i)));document.getElementById('wrongbtn').setAttribute('aria-pressed',String(wrong));document.getElementById('unansweredbtn').setAttribute('aria-pressed',String(unanswered));document.getElementById('expbtn').setAttribute('aria-pressed',String(allExp));document.getElementById('expbtn').textContent=allExp?'해설 전체 접기':'해설 전체 펼치기';progress();if(summaryOpen)updateSummary()}
function pick(i,j){const x=window.scrollX,y=window.scrollY;A[i]=j;save();const c=document.getElementById('q'+(i+1)),q=Q[i];if(c){c.classList.add('answered');c.classList.toggle('wrong-answer',j!==q.a);c.querySelectorAll('.opt').forEach((b,n)=>{b.classList.toggle('ok',n===q.a);b.classList.toggle('bad',n===j&&j!==q.a);b.setAttribute('aria-pressed',String(n===j))});const e=c.querySelector('.exp');e.classList.add('show');e.innerHTML=`<b>${j===q.a?'✓ 정답입니다.':'✕ 오답입니다.'} 정답 ${circ[q.a]} | 해설</b><br>${explanation(q)}`;progress();if(summaryOpen)updateSummary()}else render();if(window.scrollY!==y)window.scrollTo({left:x,top:y,behavior:'instant'});requestAnimationFrame(()=>{if(window.scrollY!==y)window.scrollTo({left:x,top:y,behavior:'instant'})})}
function progress(){[0,1,2,3].forEach(s=>{const idx=Q.map((q,i)=>i).filter(i=>!s||Q[i].s===s);const done=idx.filter(i=>A[i]!==null).length,ok=idx.filter(i=>A[i]===Q[i].a).length;document.getElementById('t'+s).textContent=`${done}/${idx.length} · 정답 ${ok}`;document.getElementById('b'+s).style.width=done/idx.length*100+'%';document.getElementById('progress'+s).setAttribute('aria-valuenow',String(Math.round(done/idx.length*100)))})}
function setf(s){filter=s;render()}
function toggleWrong(){wrong=!wrong;unanswered=false;render()}
function toggleUnanswered(){unanswered=!unanswered;wrong=false;render()}
function toggleExp(){allExp=!allExp;render()}
function updateSummary(){let rows='';[0,1,2,3].forEach(s=>{const idx=Q.map((q,i)=>i).filter(i=>!s||Q[i].s===s),done=idx.filter(i=>A[i]!==null).length,ok=idx.filter(i=>A[i]===Q[i].a).length;rows+=`<tr><th>${s?SUBJECTS[s]:'전체'}</th><td>${ok}/${idx.length}</td><td>${done-ok}</td><td>${idx.length-done}</td><td>${done?(ok/done*100).toFixed(1)+'%':'—'}</td></tr>`});document.getElementById('summary').innerHTML=`<h2>채점 요약 · 총 ${Q.filter((q,i)=>A[i]===q.a).length}/${Q.length}점</h2><div class="table-scroll"><table><thead><tr><th>과목</th><th>정답/전체</th><th>오답</th><th>미응답</th><th>응답 정답률</th></tr></thead><tbody>${rows}</tbody></table></div><p class="meta">각 1점 · 미응답은 총점에 가산하지 않습니다. 학습용 점수이며 공식 합격판정이 아닙니다.</p>`}
function grade(){summaryOpen=true;updateSummary();const el=document.getElementById('summary');el.hidden=false;el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}
function resetAll(){if(!confirm(`${Q.length}문항의 풀이기록을 모두 초기화할까요?`))return;A=Array(Q.length).fill(null);wrong=false;unanswered=false;allExp=false;summaryOpen=false;document.getElementById('summary').hidden=true;save();render()}
window.addEventListener('beforeprint',()=>{window._printState={filter,wrong,unanswered,allExp};filter=0;wrong=false;unanswered=false;allExp=true;render()});window.addEventListener('afterprint',()=>{if(!window._printState)return;({filter,wrong,unanswered,allExp}=window._printState);delete window._printState;render()});
render();
const sourcePage=location.hash.match(/^#page=(\d+)$/);
const questionIndex=sourcePage ? Q.findIndex(q=>q.p===Number(sourcePage[1])) : -1;
if(questionIndex>=0)requestAnimationFrame(()=>document.getElementById(`q${questionIndex+1}`).scrollIntoView());
</script><script>

</script><script>(function(){var b=document.getElementById('study-theme-toggle');if(!b)return;function sync(){var d=document.documentElement.dataset.theme==='dark';b.textContent=d?'라이트모드':'다크모드';b.setAttribute('aria-pressed',String(d))}b.addEventListener('click',function(){var t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('fund-study-theme-v1',t)}catch(e){}sync()});sync()})()</script></body></html>
